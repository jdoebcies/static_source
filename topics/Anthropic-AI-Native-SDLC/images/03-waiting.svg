<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="title desc">
<title id="title">编码缩短，不会自动消除等待</title><desc id="desc">假设串行工时，仅演示算术；不代表实测效率。总周期减少 5/12，约 42%；模型忽略并行与返工。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Arial',sans-serif} .mono{font-family:ui-monospace,monospace}</style>
<rect width="800" height="404" fill="#f5f5f5"/>
<text x="32" y="40" font-size="28" fill="#2d3142" text-anchor="start" font-weight="650">编码缩短，不会自动消除等待</text><text x="32" y="72" font-size="16" fill="#4f5d75" text-anchor="start" font-weight="500">假设串行工时，仅演示算术；不代表实测效率</text>
<text x="32" y="152" font-size="20" fill="#2d3142" text-anchor="start" font-weight="500">调整前</text>
<rect x="176" y="120" width="144" height="48" fill="#d8dde4"/><text x="248" y="152" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="500">准备 3 天</text><rect x="320" y="120" width="288" height="48" fill="#eb6c36"/><text x="464" y="152" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="500">编码 6 天</text><rect x="608" y="120" width="144" height="48" fill="#4f5d75"/><text x="680" y="152" font-size="16" fill="#fff" text-anchor="middle" font-weight="500">交付 3 天</text>
<text x="32" y="256" font-size="20" fill="#2d3142" text-anchor="start" font-weight="500">调整后</text>
<rect x="176" y="224" width="144" height="48" fill="#d8dde4"/><text x="248" y="256" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="500">准备 3 天</text><rect x="320" y="224" width="48" height="48" fill="#eb6c36"/><rect x="368" y="224" width="144" height="48" fill="#4f5d75"/><text x="440" y="256" font-size="16" fill="#fff" text-anchor="middle" font-weight="500">交付 3 天</text>
<text x="344" y="300" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="500">编码 1 天</text>
<text x="752" y="204" font-size="16" fill="#4f5d75" text-anchor="end" font-weight="500">总计 12 天</text>
<text x="512" y="300" font-size="16" fill="#2d3142" text-anchor="end" font-weight="500">总计 7 天</text>
<path d="M32 340 H768" stroke="#bfc0c0" fill="none"/><text x="32" y="372" font-size="16" fill="#4f5d75" text-anchor="start" font-weight="500">总周期减少 5/12，约 42%；模型忽略并行与返工。</text>
</svg>