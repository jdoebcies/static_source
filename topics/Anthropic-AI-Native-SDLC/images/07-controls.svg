<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 576" role="img" aria-labelledby="title desc">
<title id="title">指导与执行，检查的是不同位置</title><desc id="desc">以订单访问隔离为例，规则需要对应实际执行点。本图用业务权限作类比；工具侧还需 Hooks、权限与 CI 等控制。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Arial',sans-serif} .mono{font-family:ui-monospace,monospace}</style>
<rect width="800" height="576" fill="#f5f5f5"/>
<text x="32" y="40" font-size="28" fill="#2d3142" text-anchor="start" font-weight="650">指导与执行，检查的是不同位置</text><text x="32" y="72" font-size="16" fill="#4f5d75" text-anchor="start" font-weight="500">以订单访问隔离为例，规则需要对应实际执行点</text>
<path d="M288 168 H512" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M640 264 V320" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M512 368 H288" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="360" y="140" width="80" height="28" rx="4" fill="#f5f5f5"/><text x="400" y="160" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">指导实现</text>
<rect x="600" y="280" width="80" height="28" rx="4" fill="#f5f5f5"/><text x="640" y="300" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">请求发生</text>
<rect x="352" y="340" width="96" height="28" rx="4" fill="#f5f5f5"/><text x="400" y="360" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">允许或拒绝</text><g class="node" data-title="CLAUDE.md / Skills"><rect x="32" y="112" width="256" height="112" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="160" y="148" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">CLAUDE.md / Skills</text><text x="160" y="180" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">告诉 Agent 应遵守什么</text><text x="160" y="208" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">例如：保持门店隔离</text></g>
<g class="node" data-title="实现代码"><rect x="512" y="112" width="256" height="152" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="640" y="148" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">实现代码</text><text x="640" y="180" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">Agent 阅读规则</text><text x="640" y="208" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">生成权限检查</text><text x="640" y="236" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">仍需验证是否正确</text></g>
<g class="node" data-title="访问控制执行点"><rect x="512" y="320" width="256" height="112" rx="8" fill="#fbe9df" stroke="#eb6c36" stroke-width="1.2"/><text x="640" y="356" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">访问控制执行点</text><text x="640" y="388" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">根据当前用户权限判断</text></g>
<g class="node" data-title="可观察结果"><rect x="32" y="320" width="256" height="112" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="160" y="356" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">可观察结果</text><text x="160" y="388" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">获准数据返回</text><text x="160" y="416" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">越权请求被拒绝</text></g>
<path d="M32 512 H768" stroke="#bfc0c0" fill="none"/><text x="32" y="544" font-size="16" fill="#4f5d75" text-anchor="start" font-weight="500">本图用业务权限作类比；工具侧还需 Hooks、权限与 CI 等控制。</text>
</svg>