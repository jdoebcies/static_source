<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="title desc">
<title id="title">同一个需要，逐步变得可执行</title><desc id="desc">订单导出是教学案例；三个文件回答不同问题。实线：同一需求逐步具体化；变化可以要求回查前面的决定。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Arial',sans-serif} .mono{font-family:ui-monospace,monospace}</style>
<rect width="800" height="432" fill="#f5f5f5"/>
<text x="32" y="40" font-size="28" fill="#2d3142" text-anchor="start" font-weight="650">同一个需要，逐步变得可执行</text><text x="32" y="72" font-size="16" fill="#4f5d75" text-anchor="start" font-weight="500">订单导出是教学案例；三个文件回答不同问题</text>
<path d="M256 216 H288" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M512 216 H544" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/><g class="node" data-title="intent.md"><rect x="32" y="120" width="224" height="192" rx="8" fill="#e9ebed" stroke="#4f5d75" stroke-width="1.2"/><text x="144" y="156" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">intent.md</text><text x="144" y="188" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">客服要核对销售</text><text x="144" y="216" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">需要某日订单清单</text><text x="144" y="244" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">说明目的与范围</text></g>
<g class="node" data-title="spec.md"><rect x="288" y="120" width="224" height="192" rx="8" fill="#e9ebed" stroke="#4f5d75" stroke-width="1.2"/><text x="400" y="156" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">spec.md</text><text x="400" y="188" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">只含本门店订单</text><text x="400" y="216" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">字段、权限、失败行为</text><text x="400" y="244" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">约定可观察的结果</text></g>
<g class="node" data-title="plan.md"><rect x="544" y="120" width="224" height="192" rx="8" fill="#fbe9df" stroke="#eb6c36" stroke-width="1.2"/><text x="656" y="156" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">plan.md</text><text x="656" y="188" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">改哪些接口与页面</text><text x="656" y="216" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">按什么顺序实现</text><text x="656" y="244" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">用什么测试证明</text></g>
<path d="M32 368 H768" stroke="#bfc0c0" fill="none"/><text x="32" y="400" font-size="16" fill="#4f5d75" text-anchor="start" font-weight="500">实线：同一需求逐步具体化；变化可以要求回查前面的决定。</text>
</svg>