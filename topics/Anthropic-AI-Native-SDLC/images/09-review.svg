<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" role="img" aria-labelledby="title desc">
<title id="title">“没有发现问题”与“批准合并”分开</title><desc id="desc">订单导出 PR：谁生成、谁检查、谁能批准。实线：交接；虚线：返工。生成者没有自批路径。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Arial',sans-serif} .mono{font-family:ui-monospace,monospace}</style>
<rect width="800" height="464" fill="#f5f5f5"/>
<text x="32" y="40" font-size="28" fill="#2d3142" text-anchor="start" font-weight="650">“没有发现问题”与“批准合并”分开</text><text x="32" y="72" font-size="16" fill="#4f5d75" text-anchor="start" font-weight="500">订单导出 PR：谁生成、谁检查、谁能批准</text>
<path d="M240 184 H288" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M512 184 H560" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M672 256 V320 H128 V256" fill="none" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<rect x="296" y="292" width="208" height="28" rx="4" fill="#f5f5f5"/><text x="400" y="312" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">发现问题：回到修改与验证</text><g class="node" data-title="生成 Agent"><rect x="32" y="112" width="208" height="144" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="136" y="148" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">生成 Agent</text><text x="136" y="180" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">实现＋测试证据</text><text x="136" y="208" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">提交 PR</text></g>
<g class="node" data-title="独立检查"><rect x="288" y="112" width="224" height="144" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="400" y="148" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">独立检查</text><text x="400" y="180" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">政策与行为审查</text><text x="400" y="208" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">记录发现及范围</text></g>
<g class="node" data-title="有权负责人"><rect x="560" y="112" width="208" height="144" rx="8" fill="#fbe9df" stroke="#eb6c36" stroke-width="1.2"/><text x="664" y="148" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">有权负责人</text><text x="664" y="180" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">判断意图与风险</text><text x="664" y="208" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">由保护条件执行</text></g>
<path d="M32 400 H768" stroke="#bfc0c0" fill="none"/><text x="32" y="432" font-size="16" fill="#4f5d75" text-anchor="start" font-weight="500">实线：交接；虚线：返工。生成者没有自批路径。</text>
</svg>