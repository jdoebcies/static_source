<path d="M400 304 V356" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M152 452 V520 H288" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M400 452 V488" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M648 452 V520 H512" fill="none" stroke="#4f5d75" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="296" y="276" width="208" height="28" rx="4" fill="#f5f5f5"/><text x="400" y="296" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">按证据与既有权限选择路径</text><g class="node" data-title="确定性规则触发"><rect x="32" y="112" width="224" height="112" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="144" y="148" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">确定性规则触发</text><text x="144" y="180" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">检查观测信号</text></g>
<g class="node" data-title="Agent 只读诊断"><rect x="288" y="112" width="224" height="112" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="400" y="148" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">Agent 只读诊断</text><text x="400" y="180" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">日志、变更、假设</text></g>
<g class="node" data-title="核对证据与权限"><rect x="544" y="112" width="224" height="112" rx="8" fill="#fbe9df" stroke="#eb6c36" stroke-width="1.2"/><text x="656" y="148" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">核对证据与权限</text><text x="656" y="180" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">不确定则升级处理</text></g>
<g class="node" data-title="受审查的修复 PR"><rect x="48" y="356" width="208" height="96" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="152" y="392" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">受审查的修复 PR</text><text x="152" y="424" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">修改实现</text></g>
<g class="node" data-title="已预批的 runbook"><rect x="296" y="356" width="208" height="96" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="400" y="392" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">已预批的 runbook</text><text x="400" y="424" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">满足条件才可执行</text></g>
<g class="node" data-title="重新明确需求"><rect x="544" y="356" width="208" height="96" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="648" y="392" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">重新明确需求</text><text x="648" y="424" font-size="16" fill="#4f5d75" text-anchor="middle" font-weight="500">涉及更大范围变化</text></g>
<g class="node" data-title="结果进入后续队列"><rect x="288" y="488" width="224" height="64" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="400" y="528" font-size="20" fill="#2d3142" text-anchor="middle" font-weight="650">结果进入后续队列</text></g>
