<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="824" viewBox="0 0 1120 824" role="img" aria-labelledby="title"><title id="title">领域边界之外，还要检查外围之间的访问</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#4f5d75"/></marker><marker id="accent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#eb6c36"/></marker></defs><rect width="1120" height="824" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="64" font-size="32" text-anchor="start" fill="#2d3142">领域边界之外，还要检查外围之间的访问</text><text x="40" y="124" font-size="24" text-anchor="start" fill="#2d3142">三个构建单元：两类适配代码分别依赖领域</text><path d="M 320 208 H 400" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M 800 208 H 720" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="320.0" y="164" width="80" height="32" fill="#f5f5f5"/><text x="360" y="188" font-size="20" text-anchor="middle" fill="#4f5d75">依赖</text><rect x="720.0" y="164" width="80" height="32" fill="#f5f5f5"/><text x="760" y="188" font-size="20" text-anchor="middle" fill="#4f5d75">依赖</text><rect x="40" y="160" width="280" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="180.0" y="200" font-size="24" text-anchor="middle" fill="#2d3142">Web</text><text x="180.0" y="232" font-size="20" text-anchor="middle" fill="#4f5d75">独立源码树</text><rect x="400" y="160" width="320" height="96" rx="8" fill="#fff4ed" stroke="#eb6c36" stroke-width="2"/><text x="560.0" y="200" font-size="24" text-anchor="middle" fill="#2d3142">Domain</text><text x="560.0" y="232" font-size="20" text-anchor="middle" fill="#4f5d75">业务规则与端口</text><rect x="800" y="160" width="280" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="940.0" y="200" font-size="24" text-anchor="middle" fill="#2d3142">持久化</text><text x="940.0" y="232" font-size="20" text-anchor="middle" fill="#4f5d75">独立源码树</text><text x="40" y="312" font-size="20" text-anchor="start" fill="#4f5d75">前提：Web 的构建依赖中不引入持久化实现。</text><text x="40" y="412" font-size="24" text-anchor="start" fill="#2d3142">两个构建单元：合并的外围可能出现绕行</text><rect x="40" y="444" width="640" height="200" rx="8" fill="none" stroke="#bfc0c0" stroke-width="2" stroke-dasharray="8 8"/><path d="M 304 540 H 400" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#accent)"/><path d="M 640 540 H 800" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="312.0" y="496" width="80" height="32" fill="#f5f5f5"/><text x="352" y="520" font-size="20" text-anchor="middle" fill="#4f5d75">直连</text><rect x="664.0" y="496" width="112" height="32" fill="#f5f5f5"/><text x="720" y="520" font-size="20" text-anchor="middle" fill="#4f5d75">依赖</text><rect x="64" y="492" width="240" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="184.0" y="532" font-size="24" text-anchor="middle" fill="#2d3142">Web</text><text x="184.0" y="564" font-size="20" text-anchor="middle" fill="#4f5d75">基础设施内</text><rect x="400" y="492" width="240" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="520.0" y="532" font-size="24" text-anchor="middle" fill="#2d3142">数据库访问</text><text x="520.0" y="564" font-size="20" text-anchor="middle" fill="#4f5d75">基础设施内</text><rect x="800" y="492" width="280" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="940.0" y="532" font-size="24" text-anchor="middle" fill="#2d3142">Domain</text><text x="940.0" y="564" font-size="20" text-anchor="middle" fill="#4f5d75">可能被绕过</text><text x="64" y="628" font-size="20" text-anchor="start" fill="#4f5d75">Infrastructure：共同源码树</text><text x="40" y="704" font-size="24" text-anchor="start" fill="#2d3142">领域不向外依赖，仍不足以阻止外围内部跳过业务规则。</text><line x1="40" x2="1080" y1="752" y2="752" stroke="#bfc0c0"/><text x="40" y="788" font-size="20" text-anchor="start" fill="#4f5d75">箭头：源代码依赖；橙色：风险路径　｜　根据原章源码树与环路反模式绘制</text></g></svg>
