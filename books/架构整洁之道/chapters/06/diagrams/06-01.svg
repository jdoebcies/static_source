<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img"><title>把计算与状态更新分开</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect width="1120" height="100%" fill="#f5f5f5"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142"><text x="40" y="56" font-size="32" text-anchor="start" fill="#2d3142">把计算与状态更新分开</text><text x="40" y="96" font-size="20" text-anchor="start" fill="#4f5d75">关注一次修改怎样生效；箭头表示通信</text><polyline points="344,208 736,208" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="435.5" y="160" width="209" height="32" fill="#f5f5f5"/><text x="540" y="184" font-size="20" text-anchor="middle" fill="#4f5d75">计算结果 / 更新请求</text><polyline points="736,284 344,284" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="435.5" y="300" width="209" height="32" fill="#f5f5f5"/><text x="540" y="324" font-size="20" text-anchor="middle" fill="#4f5d75">输入状态 / 更新结果</text><rect x="40" y="156" width="304" height="176" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="192.0" y="220.0" font-size="24" text-anchor="middle" fill="#2d3142">不可变组件</text><text x="192.0" y="252.0" font-size="20" text-anchor="middle" fill="#2d3142">根据输入计算</text><text x="192.0" y="284.0" font-size="20" text-anchor="middle" fill="#2d3142">不修改外部状态</text><rect x="736" y="156" width="344" height="176" rx="8" fill="#fff0e8" stroke="#eb6c36" stroke-width="2"/><text x="908.0" y="220.0" font-size="24" text-anchor="middle" fill="#2d3142">可变组件</text><text x="908.0" y="252.0" font-size="20" text-anchor="middle" fill="#2d3142">协调并接受状态更新</text><text x="908.0" y="284.0" font-size="20" text-anchor="middle" fill="#2d3142">事务或比较后重试</text><line x1="40" y1="376" x2="1080" y2="376" stroke="#bfc0c0"/><text x="40" y="408" font-size="20" text-anchor="start" fill="#4f5d75">来源：原书图6.1；通信标注为讲解补充，不表示源码依赖。</text></g></svg>
