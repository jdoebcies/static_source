<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">单向边界：接口挡住一侧依赖</title><desc id="desc">Client 和 ServiceImpl 都依赖 ServiceBoundary。ServiceImpl 指向 Client 的虚线是可能出现的违规源码依赖。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="1120" height="640" fill="#f5f5f5"/>
<g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142">
<text x="40" y="68" font-size="32">单向边界：接口挡住一侧依赖</text>
<text x="40" y="108" font-size="20" fill="#4f5d75">依据原书图24.1重绘 · 所有箭头均表示源码依赖</text>
<path d="M360 248 H700" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M840 432 V308" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M704 480 H220 V308" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow-accent)"/>
<rect x="80" y="192" width="280" height="112" rx="8" fill="#fff" stroke="#2d3142"/>
<text x="220" y="240" text-anchor="middle" font-size="24">Client</text><text x="220" y="276" text-anchor="middle" font-size="20" fill="#4f5d75">使用服务的代码</text>
<rect x="704" y="192" width="336" height="112" rx="8" fill="#fff" stroke="#2d3142"/>
<text x="872" y="240" text-anchor="middle" font-size="24">ServiceBoundary</text><text x="872" y="276" text-anchor="middle" font-size="20" fill="#4f5d75">服务接口</text>
<rect x="704" y="432" width="336" height="96" rx="8" fill="#fff" stroke="#2d3142"/>
<text x="872" y="472" text-anchor="middle" font-size="24">ServiceImpl</text><text x="872" y="508" text-anchor="middle" font-size="20" fill="#4f5d75">具体实现</text>
<rect x="448" y="208" width="160" height="32" fill="#f5f5f5"/><text x="528" y="232" text-anchor="middle" font-size="20">使用接口</text>
<rect x="808" y="352" width="104" height="36" fill="#f5f5f5"/><text x="860" y="376" text-anchor="middle" font-size="20">实现接口</text>
<rect x="288" y="436" width="336" height="32" fill="#f5f5f5"/><text x="456" y="460" text-anchor="middle" font-size="20" fill="#eb6c36">风险：实现直接认识 Client</text>
<line x1="40" y1="568" x2="1080" y2="568" stroke="#bfc0c0"/>
<text x="40" y="604" font-size="20" fill="#4f5d75">实线：已建立的依赖　　虚线：需要持续防止的依赖泄漏</text>
</g></svg>
