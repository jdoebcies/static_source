<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 624" width="1120" height="624" role="img" aria-labelledby="title description">
<title id="title">4-TEL：先稳定入口，再局部更换</title><desc id="description">同一入口选择一条调用路径；虚线表示入口被改为指向 RAM 补丁。。替换的前提：向量入口含义和芯片装载位置保持兼容。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect width="1120" height="624" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="40" y="64" font-size="32" text-anchor="start" fill="#2d3142" font-weight="600">4-TEL：先稳定入口，再局部更换</text><text x="40" y="108" font-size="20" text-anchor="start" fill="#4f5d75" font-weight="400">同一入口选择一条调用路径；虚线表示入口被改为指向 RAM 补丁。</text><path d="M 288 320 H 416" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M 688 276 H 776 V 236 H 864" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M 688 364 H 776 V 444 H 864" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 8"/><rect x="64" y="260" width="224" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="176.0" y="308.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="600">调用者</text><text x="176.0" y="348.0" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">沿固定入口调用</text><rect x="416" y="220" width="272" height="200" rx="8" fill="#fce9df" stroke="#eb6c36" stroke-width="2"/><text x="552.0" y="288.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="600">RAM 向量表</text><text x="552.0" y="328.0" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">入口 → 实际地址</text><text x="552.0" y="368.0" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">启动时从芯片复制</text><rect x="864" y="176" width="216" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="972.0" y="224.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="600">芯片中的程序</text><text x="972.0" y="264.0" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">正常路径</text><rect x="864" y="384" width="216" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="972.0" y="432.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="600">RAM 中的补丁</text><text x="972.0" y="472.0" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">应急替代路径</text><rect x="300.0" y="272" width="104" height="32" fill="#f5f5f5"/><text x="352" y="296" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">固定入口</text><rect x="768.0" y="188" width="88" height="32" fill="#f5f5f5"/><text x="812" y="212" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">原地址</text><rect x="752.0" y="396" width="104" height="32" fill="#f5f5f5"/><text x="804" y="420" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">补丁地址</text><line x1="40" y1="540" x2="1080" y2="540" stroke="#bfc0c0"/><text x="40" y="584" font-size="20" text-anchor="start" fill="#4f5d75" font-weight="400">替换的前提：向量入口含义和芯片装载位置保持兼容。</text></g></svg>
