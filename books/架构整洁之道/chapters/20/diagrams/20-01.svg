<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4f5d75" stroke-width="1.5"/></marker></defs><rect width="1120" height="700" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><path d="M856,384 L856,272" fill="none" stroke="#4f5d75" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M664,444 L608,444" fill="none" stroke="#4f5d75" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M304,444 L384,444" fill="none" stroke="#4f5d75" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="664" y="144" width="416" height="128" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><rect x="360" y="316" width="720" height="236" rx="8" fill="none" stroke="#bfc0c0" stroke-width="2" stroke-dasharray="8 6"/><rect x="664" y="384" width="384" height="120" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><rect x="384" y="384" width="224" height="120" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="2"/><rect x="40" y="384" width="264" height="120" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="2"/><text x="40" y="56" font-size="32" fill="#2d3142" font-weight="600" text-anchor="start">实体守住业务规则，用例安排本次办理</text><text x="40" y="96" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">箭头均表示源码依赖；不同对象可以拥有部分相同数据，但变化原因不同</text><text x="688" y="178" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">业务实体</text><text x="688" y="210" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">关键业务数据与关键业务逻辑</text><text x="688" y="238" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">例：Loan 的计息和还款</text><text x="376" y="348" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">特定应用的用例边界</text><text x="688" y="418" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">用例</text><text x="688" y="450" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">组织步骤、检查应用条件</text><text x="688" y="478" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">调用所需的业务实体</text><text x="408" y="418" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">请求 / 响应</text><text x="408" y="450" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">只携带需要的数据</text><text x="408" y="478" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">不继承框架类型</text><rect x="672" y="276" width="136" height="32" fill="#f5f5f5"/><text x="740" y="300" font-size="20" fill="#2d3142" font-weight="400" text-anchor="middle">使用业务实体</text><text x="64" y="418" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">接入代码</text><text x="64" y="450" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">转换外部格式</text><text x="64" y="478" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">调用用例</text><text x="40" y="604" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">实体变化：业务规则改了。</text><text x="40" y="640" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">用例与模型变化：本次办理步骤或需要交付的数据改了。</text><text x="40" y="676" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">省掉一次字段转换，可能让界面与实体内部结构直接相依。</text></g></svg>