<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 624" role="img"><title>相同算法，两个独立的变更来源</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect width="1120" height="100%" fill="#f5f5f5"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142"><text x="40" y="56" font-size="32" text-anchor="start" fill="#2d3142">相同算法，两个独立的变更来源</text><text x="40" y="96" font-size="20" text-anchor="start" fill="#4f5d75">本次只有财务要求修改正常工时口径</text><text x="208" y="152" font-size="24" text-anchor="middle" fill="#eb6c36">财务 → CFO</text><text x="896" y="152" font-size="24" text-anchor="middle" fill="#2d3142">人力资源 → COO</text><polyline points="208,280 208,348 432,348 432,388" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="268.0" y="312" width="56" height="32" fill="#f5f5f5"/><text x="296" y="336" font-size="20" text-anchor="middle" fill="#4f5d75">调用</text><polyline points="896,280 896,348 688,348 688,388" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="788.0" y="312" width="56" height="32" fill="#f5f5f5"/><text x="816" y="336" font-size="20" text-anchor="middle" fill="#4f5d75">调用</text><rect x="40" y="184" width="336" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="208.0" y="224.0" font-size="24" text-anchor="middle" fill="#2d3142">calculatePay()</text><text x="208.0" y="256.0" font-size="20" text-anchor="middle" fill="#2d3142">工资计算</text><rect x="728" y="184" width="352" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="904.0" y="224.0" font-size="24" text-anchor="middle" fill="#2d3142">reportHours()</text><text x="904.0" y="256.0" font-size="20" text-anchor="middle" fill="#2d3142">工时报表</text><rect x="360" y="388" width="400" height="112" rx="8" fill="#fff0e8" stroke="#eb6c36" stroke-width="2"/><text x="560.0" y="436.0" font-size="24" text-anchor="middle" fill="#2d3142">regularHours()</text><text x="560.0" y="468.0" font-size="20" text-anchor="middle" fill="#2d3142">两侧共用的正常工时算法</text><text x="40" y="540" font-size="24" text-anchor="start" fill="#2d3142">财务验收通过，不能证明未提出变更的 HR 报表仍然正确。</text><line x1="40" y1="560" x2="1080" y2="560" stroke="#bfc0c0"/><text x="40" y="592" font-size="20" text-anchor="start" fill="#4f5d75">来源：原书图7.1—7.2；连线表示调用，文字标明需求归属。</text></g></svg>
