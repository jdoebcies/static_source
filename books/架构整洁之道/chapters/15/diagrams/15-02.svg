<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img"><title>把磁盘物理位置留给转换程序</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect width="1120" height="100%" fill="#f5f5f5"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142"><text x="40" y="56" font-size="32" text-anchor="start" fill="#2d3142">把磁盘物理位置留给转换程序</text><text x="40" y="96" font-size="20" text-anchor="start" fill="#4f5d75">业务使用相对地址，设备变化集中在映射一侧</text><polyline points="336,224 424,224" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="332.0" y="168" width="96" height="32" fill="#f5f5f5"/><text x="380" y="192" font-size="20" text-anchor="middle" fill="#4f5d75">相对地址</text><polyline points="696,224 784,224" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="692.0" y="168" width="96" height="32" fill="#f5f5f5"/><text x="740" y="192" font-size="20" text-anchor="middle" fill="#4f5d75">物理地址</text><rect x="40" y="156" width="296" height="136" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="188.0" y="216.0" font-size="24" text-anchor="middle" fill="#2d3142">账务程序</text><text x="188.0" y="248.0" font-size="20" text-anchor="middle" fill="#2d3142">按连续整数访问扇区</text><rect x="424" y="156" width="272" height="136" rx="8" fill="#fff0e8" stroke="#eb6c36" stroke-width="2"/><text x="560.0" y="216.0" font-size="24" text-anchor="middle" fill="#2d3142">地址转换</text><text x="560.0" y="248.0" font-size="20" text-anchor="middle" fill="#2d3142">集中映射规则</text><rect x="784" y="156" width="296" height="136" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="932.0" y="216.0" font-size="24" text-anchor="middle" fill="#2d3142">具体磁盘</text><text x="932.0" y="248.0" font-size="20" text-anchor="middle" fill="#2d3142">柱面 / 磁头 / 扇区</text><text x="40" y="344" font-size="24" text-anchor="start" fill="#2d3142">换设备仍需适配与迁移，但业务不必到处认识新的磁盘结构。</text><line x1="40" y1="376" x2="1080" y2="376" stroke="#bfc0c0"/><text x="40" y="408" font-size="20" text-anchor="start" fill="#4f5d75">来源：原书“物理地址寻址”；箭头表示访问地址的转换。</text></g></svg>
