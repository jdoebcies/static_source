<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14-03</title><style>html,body{margin:0;background:#f5f5f5}main{max-width:1120px;margin:auto}svg{display:block;width:100%;height:auto}</style><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 744" role="img"><title>主序列把稳定程度与抽象程度放在一起</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect width="1120" height="100%" fill="#f5f5f5"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142"><text x="40" y="56" font-size="32" text-anchor="start" fill="#2d3142">主序列把稳定程度与抽象程度放在一起</text><text x="40" y="96" font-size="20" text-anchor="start" fill="#4f5d75">横轴 I 为不稳定性；纵轴 A 为抽象类与接口占比</text><path d="M136 180 L136 604 L560 604" fill="none" stroke="#4f5d75" stroke-width="2"/><path d="M136 180 L560 180 L560 604" fill="none" stroke="#bfc0c0" stroke-dasharray="6 6"/><path d="M136 604 L136 440 Q300 440 300 604 Z" fill="#fff0e8"/><path d="M560 180 L396 180 Q396 344 560 344 Z" fill="#ececec"/><path d="M136 180 L560 604" fill="none" stroke="#eb6c36" stroke-width="3"/><text x="80" y="168" font-size="20" text-anchor="start" fill="#2d3142">(0,1)</text><text x="532" y="168" font-size="20" text-anchor="start" fill="#2d3142">(1,1)</text><text x="76" y="632" font-size="20" text-anchor="start" fill="#2d3142">(0,0)</text><text x="532" y="632" font-size="20" text-anchor="start" fill="#2d3142">(1,0)</text><text x="68" y="392" font-size="28" text-anchor="start" fill="#2d3142">A</text><text x="344" y="648" font-size="28" text-anchor="start" fill="#2d3142">I</text><text x="184" y="556" font-size="24" text-anchor="start" fill="#2d3142">痛苦区</text><text x="444" y="256" font-size="24" text-anchor="start" fill="#2d3142">无用区</text><text x="640" y="216" font-size="28" text-anchor="start" fill="#2d3142">主序列：A + I = 1</text><text x="640" y="284" font-size="24" text-anchor="start" fill="#2d3142">难改且抽象 ↔ 易改且具体</text><text x="640" y="372" font-size="28" text-anchor="start" fill="#2d3142">D = |A + I − 1|</text><text x="640" y="420" font-size="20" text-anchor="start" fill="#2d3142">D 是检查线索，不是质量总分。</text><text x="640" y="500" font-size="20" text-anchor="start" fill="#2d3142">痛苦还取决于是否经常需要修改。</text><text x="640" y="544" font-size="20" text-anchor="start" fill="#2d3142">无用还要检查是否有实际使用者。</text><line x1="40" y1="680" x2="1080" y2="680" stroke="#bfc0c0"/><text x="40" y="712" font-size="20" text-anchor="start" fill="#4f5d75">来源：原书图14.12—14.13；区域为示意，边缘不是验收阈值。</text></g></svg>
