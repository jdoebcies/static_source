<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img"><title>新增一条依赖，三个组件一起受牵制</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect width="1120" height="100%" fill="#f5f5f5"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142"><text x="40" y="56" font-size="32" text-anchor="start" fill="#2d3142">新增一条依赖，三个组件一起受牵制</text><text x="40" y="96" font-size="20" text-anchor="start" fill="#4f5d75">沿箭头追踪：Entities → Authorizer → Interactors → Entities</text><polyline points="664,212 784,212 784,384 760,384" fill="none" stroke="#eb6c36" stroke-width="2.4" marker-end="url(#arrow-accent)"/><rect x="736.0" y="280" width="96" height="32" fill="#f5f5f5"/><text x="784" y="304" font-size="20" text-anchor="middle" fill="#eb6c36">新增依赖</text><polyline points="520,384 488,384 488,424 392,424" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="412.0" y="436" width="56" height="32" fill="#f5f5f5"/><text x="440" y="460" font-size="20" text-anchor="middle" fill="#4f5d75">依赖</text><polyline points="272,376 272,320 520,320 520,264" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="368.0" y="284" width="56" height="32" fill="#f5f5f5"/><text x="396" y="308" font-size="20" text-anchor="middle" fill="#4f5d75">依赖</text><polyline points="272,212 424,212" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="320.0" y="160" width="56" height="32" fill="#f5f5f5"/><text x="348" y="184" font-size="20" text-anchor="middle" fill="#4f5d75">依赖</text><polyline points="152,264 152,376" fill="none" stroke="#4f5d75" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="160" width="232" height="104" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="156.0" y="220.0" font-size="24" text-anchor="middle" fill="#2d3142">Database</text><rect x="424" y="160" width="240" height="104" rx="8" fill="#fff0e8" stroke="#eb6c36" stroke-width="2"/><text x="544.0" y="220.0" font-size="24" text-anchor="middle" fill="#2d3142">Entities</text><rect x="520" y="336" width="240" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="640.0" y="392.0" font-size="24" text-anchor="middle" fill="#2d3142">Authorizer</text><rect x="152" y="376" width="240" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="272.0" y="432.0" font-size="24" text-anchor="middle" fill="#2d3142">Interactors</text><text x="40" y="516" font-size="24" text-anchor="start" fill="#2d3142">Database 要兼容整条依赖链；环中的版本与测试需要共同协调。</text><line x1="40" y1="536" x2="1080" y2="536" stroke="#bfc0c0"/><text x="40" y="568" font-size="20" text-anchor="start" fill="#4f5d75">来源：原书图14.2的局部；箭头全部表示源码或组件依赖。</text></g></svg>
