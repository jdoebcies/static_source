<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 656" role="img" aria-labelledby="title"><title id="title">Main 选择依赖，再把业务执行交给应用</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs><rect width="1120" height="656" fill="#f5f5f5"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><path d="M320 232 H416" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 232 H796" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M940 288 V384 H560 V444" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><line x1="40" y1="584" x2="1080" y2="584" stroke="#bfc0c0"/><rect x="40" y="176" width="280" height="112" rx="8" fill="#fff" stroke="#2d3142"/><rect x="420" y="176" width="280" height="112" rx="8" fill="#fff" stroke="#2d3142"/><rect x="800" y="176" width="280" height="112" rx="8" fill="#fff" stroke="#2d3142"/><rect x="420" y="448" width="280" height="104" rx="8" fill="#fbede6" stroke="#eb6c36"/><text x="40" y="68" font-size="32" text-anchor="start" fill="#2d3142">Main 选择依赖，再把业务执行交给应用</text><text x="40" y="108" font-size="20" text-anchor="start" fill="#4f5d75">假设订单应用 · 箭头只表示启动与控制移交的先后</text><text x="180" y="220" font-size="24" text-anchor="middle" fill="#2d3142">选择当前配置</text><text x="180" y="256" font-size="20" text-anchor="middle" fill="#4f5d75">生产或测试环境</text><text x="560" y="220" font-size="24" text-anchor="middle" fill="#2d3142">创建具体对象</text><text x="560" y="256" font-size="20" text-anchor="middle" fill="#4f5d75">存储、通知等实现</text><text x="940" y="220" font-size="24" text-anchor="middle" fill="#2d3142">连接应用对象</text><text x="940" y="256" font-size="20" text-anchor="middle" fill="#4f5d75">把依赖传给使用者</text><text x="560" y="492" font-size="24" text-anchor="middle" fill="#2d3142">执行业务用例</text><text x="560" y="528" font-size="20" text-anchor="middle" fill="#4f5d75">处理同一套订单规则</text><rect x="336" y="192" width="64" height="32" fill="#f5f5f5"/><text x="368" y="216" font-size="20" text-anchor="middle" fill="#4f5d75">然后</text><rect x="716" y="192" width="64" height="32" fill="#f5f5f5"/><text x="748" y="216" font-size="20" text-anchor="middle" fill="#4f5d75">然后</text><rect x="660" y="352" width="160" height="32" fill="#f5f5f5"/><text x="740" y="376" font-size="20" text-anchor="middle" fill="#4f5d75">交出控制权</text><text x="40" y="620" font-size="20" text-anchor="start" fill="#4f5d75">业务代码获得所需接口后，不必再识别启动它的环境。</text></g></svg>
