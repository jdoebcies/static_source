<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 708" width="1120" height="708" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4f5d75" stroke-width="1.5"/></marker></defs><rect width="1120" height="708" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><path d="M352,240 L660,240" fill="none" stroke="#4f5d75" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M288,484 L400,484" fill="none" stroke="#4f5d75" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M820,484 L648,484" fill="none" stroke="#4f5d75" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="64" y="184" width="288" height="112" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="2"/><rect x="660" y="184" width="388" height="112" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><rect x="48" y="380" width="632" height="200" rx="8" fill="none" stroke="#bfc0c0" stroke-width="2" stroke-dasharray="8 6"/><rect x="72" y="436" width="216" height="96" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="2"/><rect x="400" y="436" width="248" height="96" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><rect x="820" y="436" width="248" height="96" rx="8" fill="#fff" stroke="#4f5d75" stroke-width="2"/><text x="40" y="56" font-size="32" fill="#2d3142" font-weight="600" text-anchor="start">跨边界调用：先看接口属于哪一侧</text><text x="40" y="96" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">同一图中的箭头均表示源码依赖；运行调用方向另行说明</text><text x="40" y="152" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">低层调用高层：调用与源码依赖同向</text><text x="88" y="218" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">低层 Client</text><text x="88" y="250" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">调用服务</text><text x="684" y="218" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">高层 Service + Data</text><text x="684" y="250" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">服务与传输结构归高层</text><rect x="428.0" y="204.0" width="156" height="32" fill="#f5f5f5"/><text x="506.0" y="228.0" font-size="20" fill="#2d3142" font-weight="400" text-anchor="middle">使用服务与数据</text><text x="40" y="352" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">高层调用低层：源码依赖保持指向高层</text><text x="64" y="412" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">高层组件</text><text x="96" y="470" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">Client</text><text x="96" y="502" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">只认识接口</text><text x="424" y="470" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">Service + Data</text><text x="424" y="502" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">接口与传输结构</text><text x="844" y="470" font-size="24" fill="#2d3142" font-weight="600" text-anchor="start">ServiceImpl</text><text x="844" y="502" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">低层具体实现</text><rect x="316.0" y="396" width="56" height="32" fill="#f5f5f5"/><text x="344.0" y="420" font-size="20" fill="#2d3142" font-weight="400" text-anchor="middle">使用</text><rect x="668.0" y="396" width="132" height="32" fill="#f5f5f5"/><text x="734.0" y="420" font-size="20" fill="#2d3142" font-weight="400" text-anchor="middle">实现 / 使用</text><text x="40" y="632" font-size="24" fill="#2d3142" font-weight="400" text-anchor="start">运行时：高层 Client 经 Service 接口调用低层 ServiceImpl。</text><text x="40" y="668" font-size="20" fill="#4f5d75" font-weight="400" text-anchor="start">边界保护的是源码；调用可以跨出去，源码依赖仍指向高层。</text></g></svg>