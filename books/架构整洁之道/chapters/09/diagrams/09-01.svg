<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 568" role="img" aria-label="同一组调用，是否仍能保住宽和高？"><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs><rect width="1120" height="568" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#2d3142"><text x="40" y="64" font-size="32" text-anchor="start" fill="#2d3142">同一组调用，是否仍能保住宽和高？</text><text x="40" y="112" font-size="24" text-anchor="start" fill="#2d3142">调用方依次执行 setW(5)，再执行 setH(2)</text><path d="M360 220 L432 220" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="354.0" y="160" width="84" height="32" fill="#f5f5f5"/><text x="396" y="184" font-size="20" text-anchor="middle" fill="#4f5d75">再设高</text><path d="M748 220 L820 220" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="742.0" y="160" width="84" height="32" fill="#f5f5f5"/><text x="784" y="184" font-size="20" text-anchor="middle" fill="#4f5d75">求面积</text><path d="M360 368 L432 368" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="354.0" y="308" width="84" height="32" fill="#f5f5f5"/><text x="396" y="332" font-size="20" text-anchor="middle" fill="#4f5d75">再设高</text><path d="M748 368 L820 368" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="742.0" y="308" width="84" height="32" fill="#f5f5f5"/><text x="784" y="332" font-size="20" text-anchor="middle" fill="#4f5d75">求面积</text><rect x="40" y="172" width="320" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="64" y="208" font-size="24" text-anchor="start" fill="#2d3142">长方形：宽5</text><text x="64" y="244" font-size="20" text-anchor="start" fill="#2d3142">高尚未重新设置</text><rect x="432" y="172" width="316" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="456" y="208" font-size="24" text-anchor="start" fill="#2d3142">宽5，高2</text><text x="456" y="244" font-size="20" text-anchor="start" fill="#2d3142">设置高不改变宽</text><rect x="820" y="172" width="260" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="844" y="208" font-size="24" text-anchor="start" fill="#2d3142">面积10</text><text x="844" y="244" font-size="20" text-anchor="start" fill="#2d3142">符合调用方预期</text><rect x="40" y="320" width="320" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="64" y="356" font-size="24" text-anchor="start" fill="#2d3142">正方形：边长5</text><text x="64" y="392" font-size="20" text-anchor="start" fill="#2d3142">宽、高必须保持相同</text><rect x="432" y="320" width="316" height="96" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><text x="456" y="356" font-size="24" text-anchor="start" fill="#2d3142">宽2，高2</text><text x="456" y="392" font-size="20" text-anchor="start" fill="#2d3142">设置高同时改变宽</text><rect x="820" y="320" width="260" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="844" y="356" font-size="24" text-anchor="start" fill="#2d3142">面积4</text><text x="844" y="392" font-size="20" text-anchor="start" fill="#2d3142">原判断不再成立</text><text x="40" y="464" font-size="24" text-anchor="start" fill="#2d3142">冲突来自可变操作的承诺；数学上的包含关系不能替代行为检查。</text><line x1="40" y1="492" x2="1080" y2="492" stroke="#bfc0c0" stroke-width="2"/><text x="40" y="528" font-size="20" text-anchor="start" fill="#4f5d75">箭头：操作执行顺序。来源：原书正方形／长方形案例，状态数值由代码推演。</text></g></svg>