<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 548" role="img" aria-label="把昂贵的链接提前完成，让装入可以重复"><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs><rect width="1120" height="548" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#2d3142"><text x="40" y="64" font-size="32" text-anchor="start" fill="#2d3142">把昂贵的链接提前完成，让装入可以重复</text><text x="40" y="120" font-size="24" text-anchor="start" fill="#2d3142">链接与装入合在一起</text><path d="M328 188 L424 188" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="324.0" y="152" width="104" height="32" fill="#f5f5f5"/><text x="376" y="176" font-size="20" text-anchor="middle" fill="#4f5d75">每次启动</text><path d="M744 188 L832 188" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="746.0" y="152" width="84" height="32" fill="#f5f5f5"/><text x="788" y="176" font-size="20" text-anchor="middle" fill="#4f5d75">完成后</text><rect x="40" y="144" width="288" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="64" y="180" font-size="24" text-anchor="start" fill="#2d3142">多个二进制文件</text><rect x="424" y="144" width="320" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="448" y="180" font-size="24" text-anchor="start" fill="#2d3142">解析引用＋重定位</text><rect x="832" y="144" width="248" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="856" y="180" font-size="24" text-anchor="start" fill="#2d3142">开始运行</text><text x="40" y="292" font-size="24" text-anchor="start" fill="#2d3142">链接器先产出完整文件</text><path d="M280 368 L352 368" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="284.0" y="328" width="64" height="32" fill="#f5f5f5"/><text x="316" y="352" font-size="20" text-anchor="middle" fill="#4f5d75">链接</text><path d="M664 368 L760 368" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="650.0" y="312" width="124" height="32" fill="#f5f5f5"/><text x="712" y="336" font-size="20" text-anchor="middle" fill="#4f5d75">可反复装入</text><rect x="40" y="320" width="240" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="64" y="356" font-size="24" text-anchor="start" fill="#2d3142">独立编译的模块</text><rect x="352" y="320" width="312" height="96" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><text x="376" y="356" font-size="24" text-anchor="start" fill="#2d3142">已链接的二进制文件</text><text x="376" y="392" font-size="20" text-anchor="start" fill="#2d3142">保留重定位能力</text><rect x="760" y="320" width="320" height="96" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="784" y="356" font-size="24" text-anchor="start" fill="#2d3142">快速装入并运行</text><text x="784" y="392" font-size="20" text-anchor="start" fill="#2d3142">不再重复解析全部引用</text><line x1="40" y1="472" x2="1080" y2="472" stroke="#bfc0c0" stroke-width="2"/><text x="40" y="508" font-size="20" text-anchor="start" fill="#4f5d75">箭头：处理顺序。来源：本章链接加载器与链接器的历史比较。</text></g></svg>