<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 664" role="img" aria-labelledby="title"><title id="title">让测试和界面使用同一套业务行为</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs><rect width="1120" height="664" fill="#f5f5f5"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><path d="M360 276 H468" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M672 328 V416 H856 V444" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 500 H676" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><line x1="40" y1="592" x2="1080" y2="592" stroke="#bfc0c0"/><rect x="40" y="160" width="880" height="208" rx="8" fill="none" stroke="#eb6c36" stroke-dasharray="8 8"/><rect x="80" y="224" width="280" height="104" rx="8" fill="#fff" stroke="#2d3142"/><rect x="472" y="224" width="400" height="104" rx="8" fill="#fff" stroke="#2d3142"/><rect x="80" y="448" width="280" height="104" rx="8" fill="#fff" stroke="#2d3142"/><rect x="680" y="448" width="352" height="104" rx="8" fill="#fff" stroke="#2d3142"/><text x="40" y="68" font-size="32" text-anchor="start" fill="#2d3142">让测试和界面使用同一套业务行为</text><text x="40" y="108" font-size="20" text-anchor="start" fill="#4f5d75">依据本章测试组件关系绘制 · 箭头表示源码依赖</text><text x="64" y="196" font-size="20" text-anchor="start" fill="#4f5d75">测试专用组件：仅由测试装配加载</text><text x="220" y="268" font-size="24" text-anchor="middle" fill="#2d3142">业务情形测试</text><text x="220" y="304" font-size="20" text-anchor="middle" fill="#4f5d75">准备输入、检查结果</text><text x="672" y="268" font-size="24" text-anchor="middle" fill="#2d3142">测试专用 API</text><text x="672" y="304" font-size="20" text-anchor="middle" fill="#4f5d75">准备状态、适配用例入口</text><text x="220" y="492" font-size="24" text-anchor="middle" fill="#2d3142">生产用户界面</text><text x="220" y="528" font-size="20" text-anchor="middle" fill="#4f5d75">真实用户操作入口</text><text x="856" y="492" font-size="24" text-anchor="middle" fill="#2d3142">取消订单用例</text><text x="856" y="528" font-size="20" text-anchor="middle" fill="#4f5d75">产品中的业务判断</text><rect x="384" y="240" width="64" height="32" fill="#f5f5f5"/><text x="416" y="264" font-size="20" text-anchor="middle" fill="#4f5d75">使用</text><rect x="704" y="384" width="112" height="32" fill="#f5f5f5"/><text x="760" y="408" font-size="20" text-anchor="middle" fill="#4f5d75">调用用例</text><rect x="464" y="464" width="112" height="32" fill="#f5f5f5"/><text x="520" y="488" font-size="20" text-anchor="middle" fill="#4f5d75">调用用例</text><text x="40" y="628" font-size="20" text-anchor="start" fill="#4f5d75">测试可以绕过无关准备成本，但不能绕过它正在验证的业务规则。</text></g></svg>
