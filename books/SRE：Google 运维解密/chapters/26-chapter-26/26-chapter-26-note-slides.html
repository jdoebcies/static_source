RC-040", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "云计算开发者面临的挑战"}]}], "sourceIds": ["SRC-041"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者列举了引用完整性、数据结构改变、旧代码等挑战。指出开发者常依赖分布式一致性API，但实现中存在Bug。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "随着服务增长，数据关系复杂化，若无主动管理，数据质量必下降。因此需通过带外校验等手段应对这些动态挑战。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "带外数据校验"}]}], "sourceIds": ["SRC-043"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者提出需建立带外检查修复系统，以检测数据存储内部及相互间的问题。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "以Gmail为例，说明校验器能检测真实完整性问题，提升开发者信心。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "同时指出需平衡校验严格度与性能，通过限速和分片降低对生产环境的影响，确保有效性。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "案例分析"}]}], "sourceIds": ["SRC-045"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节通过两个案例验证数据恢复系统。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "首先介绍2011年Gmail数据丢失，通过离线磁带备份恢复，证明深度多层防御和团队协作的重要性。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "接着引入2012年Google Music案例，说明海量数据恢复的后勤挑战，为后续详细分析该案例做铺垫。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "2011年2月27日，星期日，深夜"}]}], "sourceIds": ["SRC-047"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节描述2011年Gmail数据丢失事件，备份系统报警。由于内部恢复工具失效，启用GTape离线磁带系统。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过预先建模和演练，快速计算恢复时间并执行恢复。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "证明深度多层防御和应急流程的有效性，引出对Google Music案例的对比分析。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "2012年3月6日，星期二，下午"}]}], "sourceIds": ["SRC-049"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节描述2012年Google Music数据丢失事件，用户反馈歌曲无法播放。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "工程师发现元数据指针缺失，进一步调查发现是隐私数据删除流水线误删音频文件。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过MapReduce评估影响范围，发现误删60万条文件，影响2.1万用户，引出问题严重性评估。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "评估问题严重性"}]}], "sourceIds": ["SRC-051"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节评估Google Music数据丢失的严重性，指出隐私策略要求快速删除数据，但流水线重构后出现Bug。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "团队暂停流水线，通过MapReduce评估影响，发现误删大量文件。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{     pager.textContent = String(index + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
    metaFooter.hidden = index !== 0;
    body.dataset.current = slides[index]?.dataset.emphasis === "true" || slides[index]?.dataset.cover === "true" ? "emphasis" : "theme";
    requestAnimationFrame(() => fitSlide(slides[index]));
  }

  function fullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  function isEditableTarget(target) {
    return target instanceof Element && Boolean(target.closest('input, textarea, select, [contenteditable="true"]'));
  }

  document.addEventListener("keydown", (event) => {
    if (isEditableTarget(event.target)) return;
    if (["ArrowRight", "ArrowDown", " ", "Enter", "j", "PageDown"].includes(event.key)) {
      event.preventDefault();
      show(index + 1);
    } else if (["ArrowLeft", "ArrowUp", "k", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(slides.length - 1);
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      fullscreen();
    }
  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
