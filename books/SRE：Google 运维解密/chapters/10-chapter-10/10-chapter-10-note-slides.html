  const RAW_SLIDES = [{"cover": true, "lines": [{"indent": 0, "chunks": [{"t": "《SRE：Google运维解密》第10章 基于时间序列数据进行有效报警 · 原书回顾与主题讲解"}]}], "sourceIds": []}, {"lines": [{"indent": 0, "chunks": [{"t": "本单元要回答：如何构建一个能支撑大规模服务、低维护成本且能自动过滤噪声的有效报警系统？"}]}], "sourceIds": ["SRC-001"]}, {"lines": [{"indent": 0, "chunks": [{"t": "[图示] 图10-1｜从应用指标到可操作报警的监控链"}]}], "sourceIds": ["SRC-002"]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "一、原书回顾：作者怎样展开"}]}], "sourceIds": ["SRC-003"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "——SRE 谚语"}]}], "sourceIds": ["SRC-004"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本章开篇引用SRE谚语，强调监控是生产环境金字塔的基石，旨在通过数据让报警沉默。"}]}], "sourceIds": ["SRC-005"], "sourceParts": [{"id": "SRC-005", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出监控不仅用于应急响应，更需确保服务质量与产品目标一致。这一引言确立了全章基调："}]}], "sourceIds": ["SRC-005"], "sourceParts": [{"id": "SRC-005", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "监控的核心价值在于通过理性判断保障服务可靠性，而非单纯的技术堆砌。"}]}], "sourceIds": ["SRC-005"], "sourceParts": [{"id": "SRC-005", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "Borgmon的起源"}]}], "sourceIds": ["SRC-006"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者回顾Google监控系统从探针脚本向时间序列模型的演进，引出Borgmon的诞生。"}]}], "sourceIds": ["SRC-007"], "sourceParts": [{"id": "SRC-007", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "针对大型系统组件繁杂、单机报警无意义的问题，Borgmon采用自动汇总和高级别服务质量报警策略。"}]}], "sourceIds": ["SRC-007"], "sourceParts": [{"id": "SRC-007", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "它摒弃了复杂的子进程调用，转而依靠标准数据分析模型，实现了低成本、大规模的批量数据收集，奠定了白盒监控的基础。"}]}], "sourceIds": ["SRC-007"], "sourceParts": [{"id": "SRC-007", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "应用软件的监控埋点"}]}], "sourceIds": ["SRC-008"]}, {"lines": [{"indent": 0, "chunks": [{"t": "为解决大规模数据收集难题，Borgmon设计了标准化的监控指标格式。"}]}], "sourceIds": ["SRC-009"], "sourceParts": [{"id": "SRC-009", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过HTTP接口/varz以文本形式暴露变量，或增加Map格式支持标签，使得新增监控点仅需一行代码。"}]}], "sourceIds": ["SRC-009"], "sourceParts": [{"id": "SRC-009", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种低门槛接口降低了SRE与研发部门的协作成本，虽在可维护性上有所妥协，但通过自动校验工具弥补了定义与使用分离带来的风险。"}]}], "sourceIds": ["SRC-009"], "sourceParts": [{"id": "SRC-009", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "如何将内部变量暴露给监控系统"}]}], "sourceIds": ["SRC-010"]}, {"lines": [{"indent": 0, "chunks": [{"t": "Google二进制文件默认包含HTTP服务，主流语言提供API自动注册变量。"}]}], "sourceIds": ["SRC-011"], "sourceParts": [{"id": "SRC-011", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种机制允许开发者直接修改变量值，无需复杂配置。"}]}], "sourceIds": ["SRC-011"], "sourceParts": [{"id": "SRC-011", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "相比SNMP协议，HTTP协议虽看似违背简单传输理念，但实践证明其能很好地应对网络故障。"}]}], "sourceIds": ["SRC-011"], "sourceParts": [{"id": "SRC-011", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "结合自动生成的合成指标，如目标解析状态和健康检查响应，增强了报警规则的鲁棒性。"}]}], "sourceIds": ["SRC-011"], "sourceParts": [{"id": "SRC-011", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "监控指标的收集"}]}], "sourceIds": ["SRC-012"]}, {"lines": [{"indent": 0, "chunks": [{"t": "Borgmon通过配置目标列表动态抓取/varz URI，并将数据解码存储于内存。"}]}], "sourceIds": ["SRC-013"], "sourceParts": [{"id": "SRC-013", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "为避免上游同时抓取下游导致的负载峰值，Borgmon将收集工作均匀分散在周期内。"}]}], "sourceIds": ["SRC-013"], "sourceParts": [{"id": "SRC-013", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "同时，记录目标解析、响应及健康检查等合成指标，用于检测任务不可用状态。"}]}], "sourceIds": ["SRC-013"], "sourceParts": [{"id": "SRC-013", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种设计确保了在复杂网络环境下，监控数据收集的稳定性与可追溯性。"}]}], "sourceIds": ["SRC-013"], "sourceParts": [{"id": "SRC-013", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "时间序列数据的存储"}]}], "sourceIds": ["SRC-014"]}, {"lines": [{"indent": 0, "chunks": [{"t": "Borgmon将数据以(timestamp, value)格式存入内存链表，并按标签命名。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "内存存满后通过垃圾回收清除过期数据，保留约12小时的历史数据用于图表渲染。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "相比外部TSDB，内存查询更快但容量有限。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种设计平衡了查询速度与存储成本，确保在有限内存下能高效处理百万级时间序列，为上层计算提供实时数据支撑。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "标签与向量"}]}], "sourceIds": ["SRC-016"]}, {"lines": [{"indent": 0, "chunks": [{"t": "时间序列数据以向量形式存储，标签集合唯一标识一个时间序列。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "标签来源包括目标名称、提供数据、配置文件及规则。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过指定标签集合，可查询符合多维条件的多个时间序列，形成向量。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种机制支持灵活的数据聚合与过滤，使得监控数据能够按服务、区域等维度进行结构化组织，便于后续的高级计算与分析。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "Borg规则计算"}]}], "sourceIds": ["SRC-018"]}, {"lines": [{"indent": 0, "chunks": [{"t": "Borgmon本质是可编程计算器，规则由代数表达式组成，输入时间序列并输出新序列。"}]}], "sourceIds": ["SRC-019"], "sourceParts": [{"id": "SRC-019", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "规则可在时间维度和空间维度上同时应用，支持汇总计算如计算整体QPS。"}]}], "sourceIds": ["SRC-019"], "sourceParts": [{"id": "SRC-019", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过计数器与测量器的区分，确保数据准确性。"}]}], "sourceIds": ["SRC-019"], "sourceParts": [{"id": "SRC-019", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "规则计算集中化减少了重复代码，提高了表达力，并通过内部监控指标帮助分析性能瓶颈，确保系统高效运行。"}]}], "sourceIds": ["SRC-019"], "sourceParts": [{"id": "SRC-019", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "报警"}]}], "sourceIds": ["SRC-020"]}, {"lines": [{"indent": 0, "chunks": [{"t": "报警规则计算结果为真或假，真则触发报警。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "为防止报警频繁波动，规则设定最小持续时间，如错误率超过阈值且持续两分钟才触发。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "报警信息包含任务名称、报警名称及触发值，通过Alertmanager服务转发。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "Alertmanager负责抑制重复报警、合并排重及根据标签展开信息，确保报警精准送达On-call工程师或工单系统，避免噪音干扰。"}]}     value = value.replace(/\^([A-Za-z0-9αβγ+\-]+)/g, "<sup>$1</sup>");
    value = value.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");

    box.style.transform = "scale(" + scale.toFixed(5) + ")";
    slide.dataset.fitScale = scale.toFixed(5);

    const content = box.getBoundingClientRect();
    const bounds = slide.getBoundingClientRect();
    const safeLeft = bounds.left + parseFloat(style.paddingLeft) - 1;
    const safeRight = bounds.right - parseFloat(style.paddingRight) + 1;
    const safeTop = bounds.top + parseFloat(style.paddingTop) - 1;
    const safeBottom = bounds.bottom - parseFloat(style.paddingBottom) + 1;
    const fits = content.left >= safeLeft && content.right <= safeRight && content.top >= safeTop && content.bottom <= safeBottom;
    slide.dataset.fits = String(fits);
    return { scale, fits };
  }

  function show(nextIndex) {
    nextIndex = Math.max(0, Math.min(slides.length - 1, nextIndex));
    slides[index]?.classList.remove("active");
    index = nextIndex;
    slides[index]?.classList.add("active");
    pager.textContent = String(index + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
    metaFooter.hidden = index !== 0;
    body.dataset.current = slides[index]?.dataset.emphasis === "true" || slides[index]?.dataset.cover === "true" ? "emphasis" : "theme";
    requestAnimationFrame(() => fitSlide(slides[index]));
  }

  function fullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  function isEditableTarget(target) {
    return target instanceof Element && Boolean(target.closest('input, textarea, select, [contenteditable="true"]'));
  }

  document.addEventListener("keydown", (event) => {
    if (isEditableTarget(event.target)) return;
    if (["ArrowRight", "ArrowDown", " ", "Enter", "j", "PageDown"].includes(event.key)) {
      event.preventDefault();
      show(index + 1);
    } else if (["ArrowLeft", "ArrowUp", "k", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(slides.length - 1);
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      fullscreen();
    }
  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
