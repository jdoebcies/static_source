  const RAW_SLIDES = [{"cover": true, "lines": [{"indent": 0, "chunks": [{"t": "《SRE：Google运维解密》第22章 处理连锁故障 · 原书回顾与主题讲解"}]}], "sourceIds": []}, {"lines": [{"indent": 0, "chunks": [{"t": "本单元要回答：怎样理解并使用“处理连锁故障”，以及它在什么条件下不适用。"}]}], "sourceIds": ["SRC-001"]}, {"lines": [{"indent": 0, "chunks": [{"t": "[图示] 图22-1｜连锁故障如何从局部过载放大成系统失稳"}]}], "sourceIds": ["SRC-002"]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "一、原书回顾：作者怎样展开"}]}], "sourceIds": ["SRC-003"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "连锁故障产生的原因和如何从设计上避免"}]}], "sourceIds": ["SRC-004"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节定义连锁故障为正反馈循环导致的规模扩大，以莎士比亚搜索服务为例说明局部故障如何引发全局崩溃。"}]}], "sourceIds": ["SRC-005"], "sourceParts": [{"id": "SRC-005", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出服务器过载是常见触发原因，并引出资源耗尽这一核心概念，为后续详细分析各类资源耗尽场景做铺垫。"}]}], "sourceIds": ["SRC-005"], "sourceParts": [{"id": "SRC-005", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "资源耗尽"}]}], "sourceIds": ["SRC-006"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节阐述资源耗尽导致高延迟和错误率，进而引发负载均衡转发和连锁故障。"}]}], "sourceIds": ["SRC-007"], "sourceParts": [{"id": "SRC-007", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出不同资源耗尽影响各异，首先聚焦CPU资源不足，说明其会导致请求变慢及一系列副作用，自然过渡到对CPU具体副作用的逐一剖析。"}]}], "sourceIds": ["SRC-007"], "sourceParts": [{"id": "SRC-007", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "CPU"}]}], "sourceIds": ["SRC-008"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节详细列举CPU资源不足的副作用，包括in-flight请求上升、队列过长、线程卡住、死锁、RPC超时及缓存效率下降。"}]}], "sourceIds": ["SRC-009"], "sourceParts": [{"id": "SRC-009", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者通过列举这些相互关联的现象，说明CPU过载如何引发连锁反应，为后续讨论内存等资源耗尽做对比铺垫。"}]}], "sourceIds": ["SRC-009"], "sourceParts": [{"id": "SRC-009", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "正在处理的（in-flight）请求数量上升"}]}], "sourceIds": ["SRC-010"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出CPU资源不足导致处理变慢，使同一时间服务器需处理更多请求。"}]}], "sourceIds": ["SRC-011"], "sourceParts": [{"id": "SRC-011", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这会影响内存、线程及文件描述符等资源，可能引发队列排队，是服务器过载引发连锁故障的直接表现和后续资源耗尽的诱因。"}]}], "sourceIds": ["SRC-011"], "sourceParts": [{"id": "SRC-011", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "队列过长"}]}], "sourceIds": ["SRC-012"]}, {"lines": [{"indent": 0, "chunks": [{"t": "当资源不足以稳定处理请求时，服务器队列会逐渐填满。这导致延迟上升并消耗更多内存。"}]}], "sourceIds": ["SRC-013"], "sourceParts": [{"id": "SRC-013", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调队列过长是资源耗尽的典型后果，并指出应对策略需参考本章后续的“队列管理”小节，以平衡负载与处理能力。"}]}], "sourceIds": ["SRC-013"], "sourceParts": [{"id": "SRC-013", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "线程卡住"}]}], "sourceIds": ["SRC-014"]}, {"lines": [{"indent": 0, "chunks": [{"t": "若线程因等待锁而无法处理请求，服务器可能无法及时响应健康检查。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在Borg系统中，这会被视为服务器失败并触发杀掉进程的操作。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者以此说明线程阻塞如何间接导致服务被误判为故障，加剧系统不稳定。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "CPU死锁或者请求卡住"}]}], "sourceIds": ["SRC-016"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者描述服务器内置看门狗机制可能检测到工作停滞，导致软件因CPU不足而崩溃。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "若看门狗由远端触发，排队请求无法及时处理，会触发看门狗杀掉进程。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这展示了资源竞争如何触发自动化保护机制，导致服务中断。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "RPC超时"}]}], "sourceIds": ["SRC-018"]}, {"lines": [{"indent": 0, "chunks": [{"t": "服务器过载时RPC回复变慢，超过客户端超时时间。这导致服务器处理被浪费，客户端重试造成更严重过载。"}]}], "sourceIds": ["SRC-019"], "sourceParts": [{"id": "SRC-019", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出这是连锁故障中常见的正反馈循环，重试放大了负载，使系统更难恢复稳定状态。"}]}], "sourceIds": ["SRC-019"], "sourceParts": [{"id": "SRC-019", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "CPU缓存效率下降"}]}], "sourceIds": ["SRC-020"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出CPU使用增多会使任务分散到多个核心，导致本地缓存失效，降低处理效率。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这是资源耗尽时的副作用之一，说明CPU过载不仅影响吞吐量，还通过缓存命中率下降进一步恶化性能，形成恶性循环。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "内存"}]}], "sourceIds": ["SRC-022"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析内存耗尽的影响，包括任务崩溃、Java GC速率加快导致CPU上升（GC死亡螺旋）及缓存命中率下降。"}]}], "sourceIds": ["SRC-023"], "sourceParts": [{"id": "SRC-023", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出内存压力会减少缓存空间，导致更多RPC请求后端，进而引发后端过载，展示了资源间的相互依赖关系。"}]}], "sourceIds": ["SRC-023"], "sourceParts": [{"id": "SRC-023", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "任务崩溃"}]}], "sourceIds": ["SRC-024"]}, {"lines": [{"indent": 0, "chunks": [{"t": "内存耗尽可能导致任务因超过资源限制被容器管理器驱逐，或触发程序逻辑崩溃。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者将此列为内存耗尽的直接后果，说明资源不足不仅影响性能，还会直接导致服务实例不可用，进而将负载转移至其他节点。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "Java 垃圾回收（GC）速率加快，从而导致CPU使用率上升"}]}], "sourceIds": ["SRC-026"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者描述“GC死亡螺旋”场景：CPU减少致处理变慢，内存上升触发更多GC，进一步减少CPU。"}]}], "sourceIds": ["SRC-027"], "sourceParts": [{"id": "SRC-027", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这是极糟糕的连锁反应，说明Java应用中内存与CPU资源的相互依赖如何导致系统迅速崩溃，难以通过简单手段恢复。"}]}], "sourceIds": ["SRC-027"], "sourceParts": [{"id": "SRC-027", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "缓存命中率下降"}]}], "sourceIds": ["SRC-028"]}, {"lines": [{"indent": 0, "chunks": [{"t": "可用内存减少导致应用层缓存命中率降低，向后端发送更多RPC，可能致后端过载。"}]}], "sourceIds": ["SRC-029"], "sourceParts": [{"id": "SRC-029", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出这是内存压力引发的次级现象，说明缓存失效如何将负载转移至后端，加剧整个系统的资源紧张和故障风险。"}]}], "sourceIds": ["SRC-029"], "sourceParts": [{"id": "SRC-029", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "线程"}]}], "sourceIds": ["SRC-030"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节简述线程不足导致的错误和健康检查失败，以及线程增加带来的内存占用和PID耗尽风险。"}]}], "sourceIds": ["SRC-031"], "sourceParts": [{"id": "SRC-031", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出文件描述符不足会影响网络连接和健康检查，进而引出资源间相互依赖的复杂场景，说明定位根本问题往往十分困难。"}]}], "sourceIds": ["SRC-031"], "sourceParts": [{"id": "SRC-031", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "文件描述符"}]}], "sourceIds": ["SRC-032"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文件描述符不足可能导致无法建立网络连接，进而引发健康检查失败。"}]}], "sourceIds": ["SRC-033"], "sourceParts": [{"id": "SRC-033", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者将其列为资源耗尽的一种具体表现，说明底层资源限制如何影响网络通信和服务状态检测，最终可能导致服务被标记为不健康并触发故障转移。"}]}], "sourceIds": ["SRC-033"], "sourceParts": [{"id": "SRC-033", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "资源之间的相互依赖"}]}], "sourceIds": ["SRC-034"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节通过Java前端GC导致CPU不足、进而引发内存上升、缓存命中率下降、最终导致后端过载的复杂案例，说明资源耗尽的连锁效应。"}]}], "sourceIds": ["SRC-035"], "sourceParts": [{"id": "SRC-035", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调在前后端分离运维时，判断后端崩溃源于前端缓存命中率下降极为困难，引出服务不可用的严重后果。"}]}], "sourceIds": ["SRC-035"], "sourceParts": [{"id": "SRC-035", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "服务不可用"}]}], "sourceIds": ["SRC-036"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节描述资源耗尽导致服务器崩溃，引发负载转移和滚雪球效应，甚至导致服务无法通过简单降载恢复。"}]}], "sourceIds": ["SRC-037"], "sourceParts": [{"id": "SRC-037", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出负载均衡策略可能加剧此问题，引出防止软件服务器过载的策略，强调通过压力测试确定服务器极限的重要性。"}]}], "sourceIds": ["SRC-037"], "sourceParts": [{"id": "SRC-037", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "防止软件服务器过载"}]}], "sourceIds": ["SRC-038"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节提出防止过载的策略，包括压力测试、提供降级结果、主动拒绝请求及上层系统拒绝请求。"}]}], "sourceIds": ["SRC-039"], "sourceParts": [{"id": "SRC-039", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出速率限制可能无法阻止连锁故障，引出容量规划的重要性，说明好的容量规划能降低连锁反应可能性，但无法完全避免。"}]}], "sourceIds": ["SRC-039"], "sourceParts": [{"id": "SRC-039", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "提供降级结果"}]}], "sourceIds": ["SRC-040"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者建议向用户返回低质量但易计算的结果，以减轻服务器负担。策略取决于服务自身，旨在过载时减少计算量。"}]}], "sourceIds": ["SRC-041"], "sourceParts": [{"id": "SRC-041", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这是防止过载崩溃的主动策略之一，通过牺牲部分服务质量来换取系统的整体可用性和稳定性。"}]}], "sourceIds": ["SRC-041"], "sourceParts": [{"id": "SRC-041", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "在过载情况下主动拒绝请求"}]}], "sourceIds": ["SRC-042"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调软件服务器应保护自己不进入过载崩溃状态，尽早标记失败请求。"}]}], "sourceIds": ["SRC-043"], "sourceParts": [{"id": "SRC-043", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这是防止过载的关键策略，通过主动拒绝新请求来避免资源耗尽。"}]}], "sourceIds": ["SRC-043"], "sourceParts": [{"id": "SRC-043", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该策略需在过载模式早期实施，以防止系统进入不可逆的故障循环。"}]}], "sourceIds": ["SRC-043"], "sourceParts": [{"id": "SRC-043", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "上层系统应该主动拒绝请求"}]}], "sourceIds": ["SRC-044"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出简单速率限制可能无法阻止连锁故障，建议在反向代理、负载均衡器或任务自身实现。"}]}], "sourceIds": ["SRC-045"], "sourceParts": [{"id": "SRC-045", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过限制特定特性请求或丢弃非关键请求，可缓解过载。"}]}], "sourceIds": ["SRC-045"], "sourceParts": [{"id": "SRC-045", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这强调了多层防御的重要性，避免单一节点过载引发全局故障。"}]}], "sourceIds": ["SRC-045"], "sourceParts": [{"id": "SRC-045", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "进行容量规划"}]}], "sourceIds": ["SRC-046"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节强调容量规划需配合性能测试，以确定服务失败的负载程度。"}]}], "sourceIds": ["SRC-047"], "sourceParts": [{"id": "SRC-047", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出容量规划仅能减少触发可能性，无法避免计划内外不可用或突发流量导致的连锁反应，引出队列管理在应对突发流量中的作用，说明队列长度对延迟的影响。"}]}], "sourceIds": ["SRC-047"], "sourceParts": [{"id": "SRC-047", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "队列管理"}]}], "sourceIds": ["SRC-048"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析队列管理对延迟和内存的影响，指出稳定服务应减小队列长度，尽早拒绝请求。"}]}], "sourceIds": ["SRC-049"], "sourceParts": [{"id": "SRC-049", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者以Gmail为例说明无队列服务器的优势，引出流量抛弃和优雅降级策略，说明在临近过载时主动抛弃负载以避免内存超限和延迟升高。"}]}], "sourceIds": ["SRC-049"], "sourceParts": [{"id": "SRC-049", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "流量抛弃和优雅降级"}]}], "sourceIds": ["SRC-050"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节介绍流量抛弃通过拒绝请求避免过载，优雅降级通过降低回复质量减少计算量。"}]}], "sourceIds": ["SRC-051"], "sourceParts": [{"id": "SRC-051", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出实施时需考虑指标选择、动作执行及层级，并强调降级系统应简单、避免复杂逻辑导致反馈循环，引出重试机制可能加剧过载的风险。"}]}], "sourceIds": ["SRC-051"], "sourceParts": [{"id": "SR       event.preventDefault();
      show(index + 1);
    } else if (["ArrowLeft", "ArrowUp", "k", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(slides.length - 1);
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      fullscreen();
    }
  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
