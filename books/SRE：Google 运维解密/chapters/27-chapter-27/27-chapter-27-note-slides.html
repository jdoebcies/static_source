 [{"id": "SRC-006", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "发布协调工程师的角色"}]}], "sourceIds": ["SRC-007"]}, {"lines": [{"indent": 0, "chunks": [{"t": "深入剖析LCE团队的具体优势。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作为跨产品小组，LCE拥有广泛的跨产品知识和良好的团队关系，是知识共享的最佳媒介。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "其全局视角能协调多个分散团队，中立立场能在SRE、研发、产品与市场团队间起到平衡作用。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种客观性确保了在追求速度的同时，可靠性始终被置于核心地位，为后续建立标准化流程奠定基础。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "广泛的经验"}]}], "sourceIds": ["SRC-009"]}, {"lines": [{"indent": 0, "chunks": [{"t": "该节指出LCE团队作为跨产品小组，通过参与全线产品活动积累丰富知识。"}]}], "sourceIds": ["SRC-010"], "sourceParts": [{"id": "SRC-010", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者认为这种跨产品经验使其成为知识共享的最佳媒介，在父节中承担确立团队核心优势的作用，解释为何LCE能胜任复杂协调工作。"}]}], "sourceIds": ["SRC-010"], "sourceParts": [{"id": "SRC-010", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "跨职能的视角"}]}], "sourceIds": ["SRC-011"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调LCE拥有发布过程的整体视角，能协调SRE、研发等多团队。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中指出这种全局视角对协调跨时区团队至关重要，在父节中说明LCE如何打破部门壁垒，确保复杂发布流程中各分散小组目标一致。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 2, "total" 来的复杂性。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "发布检查列表"}]}], "sourceIds": ["SRC-033"]}, {"lines": [{"indent": 0, "chunks": [{"t": "详细说明发布检查列表的作用与维护原则。列表用于减少失败并保证跨部门一致性，包含具体问题及待办事项。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "为防止列表无限增长，新增问题需经副总裁批准，且必须基于高重要性和过往经验。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "LCE需持续维护列表，定期评估过时项目，确保开发者负担可控。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种机制推动了通用基础设施的融合，简化了发布过程。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "推动融合和简化"}]}], "sourceIds": ["SRC-035"]}, {"lines": [{"indent": 0, "chunks": [{"t": "解释LCE如何通过检查列表推动基础设施融合。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "LCE推荐经过优化的通用基础设施作为构建单元，消除重复劳动并提高工程质量。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过识别可简化区域，LCE协助产品团队争取权益，简化审批流程并实现自动化。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种标准化机制大幅简化了检查列表，例如将复杂的限速要求简化为调用特定系统，提升了发布效率。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "发布未知的产品"}]}], "sourceIds": ["SRC-037"]}, {"lines": [{"indent": 0, "chunks": [{"t": "讨论发布全新产品空间时的挑战。当项目进入新领域时，LCE需引入领域专家创建全新检查列表。"}]}], "sourceIds": ["SRC-038"], "sourceParts": [{"id": "SRC-038", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "以Android发布为例，LCE与移动端专家合作，确保检查列表关注可靠性、故障模式等宽泛主题。"}]}], "sourceIds": ["SRC-038"], "sourceParts": [{"id": "SRC-038", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这一过程强调坚守安全发布的抽象原则，并将之细化为对开发者有用的具体检查项，确保非常规发布的安全性。"}]}], "sourceIds": ["SRC-038"], "sourceParts": [{"id": "SRC-038", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "起草一个发布检查列表"}]}], "sourceIds": ["SRC-039"]}, {"lines": [{"indent": 0, "chunks": [{"t": "从Google LCE检查列表中抽取主题进行具体讨论。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "包括架构与依赖、集成、容量规划、故障模式、客户端行为、流程与自动化、开发流程、外部依赖及发布计划等。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "每个主题都包含示范问题和待办事项，旨在确保服务正确使用通用基础设施，预测故障影响，并规划发布步骤。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这些主题构成了可靠发布新服务和新产品的重要组成部分。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "架构与依赖"}]}], "sourceIds": ["SRC-041"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出架构评审确保服务正确使用通用基础设施，并纳入依赖负责人。文中提到依赖列表用于容量规划。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，该部分通过检查请求流和隔离非用户请求，确保系统架构满足可靠性与性能要求。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "集成"}]}], "sourceIds": ["SRC-043"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中提到内部生态系统指导新服务器建立、DNS配置等。作者指出各公司生态不同，需定制集成步骤。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，集成部分确保新服务能无缝融入现有基础设施，避免配置陷阱，保障服务正常运行。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "容量规划"}]}], "sourceIds": ["SRC-045"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出容量规划需应对发布初期的尖峰负载，并预留冗余。文中提到需提前申请资源，并考虑15倍峰值。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，容量规划通过评估流量增速和获取计算资源，确保服务在压力下不崩溃，保障可用性。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "故障模式"}]}], "sourceIds": ["SRC-047"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中提到故障模式分析需检查组件故障影响及降级能力。作者指出需应对DoS攻击和依赖不可用。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，该部分通过设置截止时间和负载丢弃，确保系统在故障时仍能维持基本服务，提升可靠性。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "客户端行为"}]}], "sourceIds": ["SRC-049"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出客户端滥用行为（如自动同步）可能影响稳定性。文中提到需实现指数重试和随机抖动。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，客户端行为部分通过规范客户端逻辑，防止因客户端行为导致的服务过载，保障服务端稳定。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "流程与自动化"}]}], "sourceIds": ["SRC-051"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中提到Google鼓励自动化，但需文档化剩余手动流程。作者指出需减少单点故障。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，流程与自动化部分确保紧急情况下工程师能依据文档处理问题，保障发布流程的可靠性和可恢复性。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "开发流程"}]}], "sourceIds": ["SRC-053"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出Google利用版本控制系统管理代码和配置。文中提到发布分支用于隔离Bug修复。"}]}], "sourceIds": ["SRC-054"], "sourceParts": [{"id": "SRC-054", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，开发流程部分通过版本控制确保代码历史可追溯，简化发布分支管理，提升开发效率和发布安全性。"}]}], "sourceIds": ["SRC-054"], "sourceParts": [{"id": "SRC-054", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "外部依赖"}]}], "sourceIds": ["SRC-055"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中提到发布可能依赖第三方代码或服务，需提前确认不确定性。作者指出需计划应对第三方故障。"}]}], "sourceIds": ["SRC-056"], "sourceParts": [{"id": "SRC-056", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，外部依赖部分通过识别第三方因素，制定备用方案，防止外部问题影响直接用户体验。"}]}], "sourceIds": ["SRC-056"], "sourceParts": [{"id": "SRC-056", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "发布计划"}]}], "sourceIds": ["SRC-057"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出复杂发布需分步启动功能，并制定备用方案。文中提到需应对市场宣传带来的复杂性。"}]}], "sourceIds": ["SRC-058"], "sourceParts": [{"id": "SRC-058", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，发布计划部分通过细化任务和责任，确保发布过程可控，并在失败时有回退策略，保障可靠性。"}]}], "sourceIds": ["SRC-058"], "sourceParts": [{"id": "SRC-058", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "可靠发布所需要的方法论"}]}], "sourceIds": ["SRC-059"]}, {"lines": [{"indent": 0, "chunks": [{"t": "介绍适用于安全发布的方法论，如灰度和阶段性发布。"}]}], "sourceIds": ["SRC-060"], "sourceParts": [{"id": "SRC-060", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "Google通过灰度发布降低风险，先在少量机器上测试，监控无异常后再逐步扩大范围。"}]}], "sourceIds": ["SRC-060"], "sourceParts": [{"id": "SRC-060", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "金丝雀测试嵌入自动化工具，确保服务不崩溃。"}]}], "sourceIds": ["SRC-060"], "sourceParts": [{"id": "SRC-060", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "此外，功能开关框架允许在真实负载下观察系统行为，支持快速屏蔽副作用，为发布提供额外的可靠性保障。"}]}], "sourceIds": ["SRC-060"], "sourceParts": [{"id": "SRC-060", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "灰度和阶段性发布"}]}], "sourceIds": ["SRC-061"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中提到Google采用灰度发布，先在小范围测试并监控。作者指出金丝雀测试可检测异常。"}]}], "sourceIds": ["SRC-062"], "sourceParts": [{"id": "SRC-062", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，灰度发布通过逐步扩大流量，最小化改动风险，确保在全面推广前发现并解决问题，保障系统稳定。"}]}], "sourceIds": ["SRC-062"], "sourceParts": [{"id": "SRC-062", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "功能开关框架"}]}], "sourceIds": ["SRC-063"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出功能开关允许在真实负载下观察系统行为。文中提到框架需支持灰度发布和快速屏蔽。"}]}], "sourceIds": ["SRC-064"], "sourceParts": [{"id": "SRC-064", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，功能开关通过灵活控制功能可见性，降低发布风险，支持快速迭代和故障隔离，提升发布安全性。"}]}], "sourceIds": ["SRC-064"], "sourceParts": [{"id": "SRC-064", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "应对客户端滥用行为"}]}], "sourceIds": ["SRC-065"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中提到客户端滥用包括同步重试和惊群效应。作者指出需引入随机抖动和指数退避。"}]}], "sourceIds": ["SRC-066"], "sourceParts": [{"id": "SRC-066", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，该部分通过规范客户端重试逻辑，防止过载加剧，确保服务端在压力下仍能稳定处理请求，避免死锁。"}]}], "sourceIds": ["SRC-066"], "sourceParts": [{"id": "SRC-066", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "过载行为和压力测试"}]}], "sourceIds": ["SRC-067"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出过载行为复杂，压力测试对可靠性至关重要。文中提到需关注非线性转折点和死锁风险。"}]}], "sourceIds": ["SRC-068"], "sourceParts": [{"id": "SRC-068", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，过载行为部分通过压力测试识别服务瓶颈，确保在极端负载下系统行为可控，保障发布后的稳定性。"}]}], "sourceIds": ["SRC-068"], "sourceParts": [{"id": "SRC-068", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "LCE的发展"}]}], "sourceIds": ["SRC-069"]}, {"lines": [{"indent": 0, "chunks": [{"t": "回顾LCE团队的历史演变。早期由志愿者发布工程师组成，后发展为全职团队以加速发布并保障可靠性。"}]}], "sourceIds": ["SRC-070"], "sourceParts": [{"id": "SRC-070", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "随着环境复杂化，LCE将评审环节标准化为“生产评审”。通过分类低风险发布，LCE简化了评审流程。"}]}], "sourceIds": ["SRC-070"], "sourceParts": [{"id": "SRC-070", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "同时，基础设施的改进如大型数据中心建设，也进一步简化了依赖多个服务的新产品上线速度。"}]}], "sourceIds": ["SRC-070"], "sourceParts": [{"id": "SRC-070", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "LCE检查列表的变迁"}]}], "sourceIds": ["SRC-071"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中提到LCE检查列表随发布数量增加而演变。作者指出通过分类低风险发布简化流程。"}]}], "sourceIds": ["SRC-072"], "sourceParts": [{"id": "SRC-072", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，变迁部分展示LCE如何通过标准化和简化，应对规模增长，提高发布效率，同时保持对高风险发布的严格管控。"}]}], "sourceIds": ["SRC-072"], "sourceParts": [{"id": "SRC-072", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "LCE没有解决的问题"}]}], "sourceIds": ["SRC-073"]}, {"lines": [{"indent": 0, "chunks": [{"t": "指出LCE无法单独解决的挑战，如扩展性改变、运维压力增加和基础设施变更。"}]}], "sourceIds": ["SRC-074"], "sourceParts": [{"id": "SRC-074", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "当产品用量激增时，原始架构可能无法维护，需重构架构。运维压力需控制在50%以内，否则影响新功能开发。"}]}], "sourceIds": ["SRC-074"], "sourceParts": [{"id": "SRC-074", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "基础设施的非向后兼容变更需自动化迁移工具支持。"}]}], "sourceIds": ["SRC-074"], "sourceParts": [{"id": "SRC-074", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这些问题需全公司投入，通过更好的平台API和标准化环境来解决。"}]}], "sourceIds": ["SRC-074"], "sourceParts": [{"id": "SRC-074", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "扩展性的改变"}]}], "sourceIds": ["SRC-075"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出产品成功导致用量激增，需重构架构。文中提到扩展性改变增加运维难度。"}]}], "sourceIds": ["SRC-076"], "sourceParts": [{"id": "SRC-076", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，扩展性改变部分说明随着规模扩大，原始架构难以维护，需投入资源重构，以应对新的技术挑战和运维压力。"}]}], "sourceIds": ["SRC-076"], "sourceParts": [{"id": "SRC-076", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "不停增加的运维压力"}]}], "sourceIds": ["SRC-077"]}, {"lines": [{"indent": 0, "chunks": [{"t": "文中提到运维压力随服务发布后增长，需控制自动化和手工工作。作者指出需跟踪运维来源。"}]}], "sourceIds": ["SRC-078"], "sourceParts": [{"id": "SRC-078", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，运维压力部分强调需持续投入减少自动化通知和部署复杂度，确保运维工作占比低于50%，保障开发效率。"}]}], "sourceIds": ["SRC-078"], "sourceParts": [{"id": "SRC-078", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "基础设施的改变"}]}], "sourceIds": ["SRC-079"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出基础设施修改迫使服务负责人跟进改动。文中提到需禁止非向后兼容改变。"}]}], "sourceIds": ["SRC-080"], "sourceParts": [{"id": "SRC-080", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在父节中，基础设施改变部分通过自动化迁移工具，减少服务负责人压力，确保基础设施演进不影响上层服务的稳定性和开发进度。"}]}], "sourceIds": ["SRC-080"], "sourceParts": [{"id": "SRC-080", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "小结"}]}], "sourceIds": ["SRC-081"]}, {"lines": [{"indent": 0, "chunks": [{"t": "总结LCE团队在快速变化中保障安全性的价值。对于希望快速扩展开发团队和服务规模的公司，LCE角色极具价值。"}]}], "sourceIds": ["SRC-082"], "sourceParts": [{"id": "SRC-082", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "本章介绍了LCE在十年间积累的经验，旨在为面临类似问题的其他组织提供启发。"}]}], "sourceIds": ["SRC-082"], "sourceParts": [{"id": "SRC-082", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "最后提及LCE成员Mikey将SRE理念引入美国政府IT部门，展示了该方法论的广泛适用性。"}]}], "sourceIds": ["SRC-082"], "sourceParts": [{"id": "SRC-082", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "二、主题讲解：可靠发布的核心机制与工程实践"}]}], "sourceIds": ["SRC-083"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "发布协调工程师（LCE）的组织价值"}]}], "sourceIds": ["SRC-084"]}, {"lines": [{"indent": 0, "chunks": [{"t": "在大规模互联网环境中，开发团队往往擅长编码但缺乏大规模发布的经验。"}]}], "sourceIds": ["SRC-085"], "sourceParts": [{"id": "SRC-085", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "LCE团队作为SRE内部的专职顾问，填补了这一空白。"}]}], "sourceIds": ["SRC-085"], "sourceParts": [{"id": "SRC-085", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "其核心价值在于提供跨产品的广泛经验、全局的跨职能视角以及中立的客观性。"}]}], "sourceIds": ["SRC-085"], "sourceParts": [{"id": "SRC-085", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "LCE不仅审核产品是否符合可靠性标准，还协调多个分散团队，确保在快速迭代中不牺牲稳定性。"}]}], "sourceIds": ["SRC-085"], "sourceParts": [{"id": "SRC-085", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种组织设计解决了传统发布流程中沟通成本高、责任不清的问题，通过专职人员持续优化发布体验，平衡成本与收益。"}]}], "sourceIds": ["SRC-085"], "sourceParts": [{"id": "SRC-085", "index": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "发布检查列表的工程化应用"}]}], "sourceIds": ["SRC-086"]}, {"lines": [{"indent": 0, "chunks": [{"t": "发布检查列表是保障发布可靠性的关键工具，旨在减少失败并保证跨部门一致性。"}]}], "sourceIds": ["SRC-087"], "sourceParts": [{"id": "SRC-087", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "列表包含具体问题及待办事项，如域名注册、备份实现、限速功能等。"}]}], "sourceIds": ["SRC-087"], "sourceParts": [{"id": "SRC-087", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "为防止列表无限增长，新增问题需经高层批准，且必须基于高重要性和过往经验。"}]}], "sourceIds": ["SRC-087"], "sourceParts": [{"id": "SRC-087", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "LCE需持续维护列表，定期评估过时项目。"}]}], "sourceIds": ["SRC-087"], "sourceParts": [{"id": "SRC-087", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过推动通用基础设施的融合，LCE将复杂的检查项简化为调用标准系统，如将限速要求简化为使用系统X，从而降低开发者负担，提升发布效率。"}]}], "sourceIds": ["SRC-087"], "sourceParts": [{"id": "SRC-087", "index": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "灰度发布与功能开关框架"}]}], "sourceIds": ["SRC-088"]}, {"lines": [{"indent": 0, "chunks": [{"t": "灰度发布是降低风险的核心方法论，通过逐步扩大新版本覆盖范围，在真实负载下观察系统行为。"}]}], "sourceIds": ["SRC-089"], "sourceParts": [{"id": "SRC-089", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "金丝雀测试嵌入自动化工具，确保服务不崩溃后再全面推广。"}]}], "sourceIds": ["SRC-089"], "sourceParts": [{"id": "SRC-089", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "功能开关框架进一步增强了发布的灵活性，允许在真实负载下测试新功能，并支持快速屏蔽副作用。"}]}], "sourceIds": ["SRC-089"], "sourceParts": [{"id": "SRC-089", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过控制用户、服务器或数据中心的流量分布，团队可以在发现严重Bug时迅速单独屏蔽某个改变，无需重新发布整个应用，从而在可靠性与迭代速度间取得平衡。"}]}], "sourceIds": ["SRC-089"], "sourceParts": [{"id": "SRC-089", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "LCE的演进与局限性"}]}], "sourceIds": ["SRC-090"]}, {"lines": [{"indent": 0, "chunks": [{"t": "LCE团队从志愿者小组发展为全职团队，通过标准化“生产评审”和分类低风险发布，简化了评审流程。"}]}], "sourceIds": ["SRC-091"], "sourceParts": [{"id": "SRC-091", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "然而，LCE无法单独解决扩展性改变、运维压力增加和基础设施变更等问题。"}]}], "sourceIds": ["SRC-091"], "sourceParts": [{"id": "SRC-091", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "当产品用量激增时，原始架构可能无法维护，需重构架构。运维压力需控制在50%以内，否则影响新功能开发。"}]}], "sourceIds": ["SRC-091"], "sourceParts": [{"id": "SRC-091", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "基础设施的非向后兼容变更需自动化迁移工具支持。"}]}], "sourceIds": ["SRC-091"], "sourceParts": [{"id": "SRC-091", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这些问题需全公司投入，通过更好的平台API和标准化环境来解决，体现了组织变革与技术架构的紧密关联。"}]}], "sourceIds": ["SRC-091"], "sourceParts": [{"id": "SRC-091", "index": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "检验理解"}]}], "sourceIds": ["SRC-092"]}, {"lines": [{"indent": 0, "chunks": [{"t": "情形：假设你负责一个面向全球用户的视频流媒体服务发布。"}]}], "sourceIds": ["SRC-093"], "sourceParts": [{"id": "SRC-093", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该服务依赖第三方CDN进行内容分发，且客户端APP具有自动重试失败请求的功能。"}]}], "sourceIds": ["SRC-093"], "sourceParts": [{"id": "SRC-093", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在发布新版本时，你发现CDN提供商出现了间歇性的高延迟，导致部分用户视频卡顿。"}]}], "sourceIds": ["SRC-093"], "sourceParts": [{"id": "SRC-093", "index": 3, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "问题：基于本章内容，请分析LCE团队应如何利用发布检查列表和功能开关框架来应对这一危机？"}]}], "sourceIds": ["SRC-094"], "sourceParts": [{"id": "SRC-094", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "并说明为何仅依靠传统的“全量发布”策略在此场景下是危险的。"}]}], "sourceIds": ["SRC-094"], "sourceParts": [{"id": "SRC-094", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "核对思路（先作答再看）"}]}], "sourceIds": ["SRC-095"]}, {"lines": [{"indent": 0, "chunks": [{"t": "LCE应首先通过发布检查列表中的“外部依赖”和“客户端行为”部分，确认CDN依赖的风险及客户端重试逻辑。"}]}], "sourceIds": ["SRC-096"], "sourceParts": [{"id": "SRC-096", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "利用功能开关框架，迅速将受影响区域的流量切换至备用CDN或降低视频质量，避免全量故障。"}]}], "sourceIds": ["SRC-096"], "sourceParts": [{"id": "SRC-096", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "传统“全量发布”在此场景下危险，因为一旦CDN故障，所有用户同时受影响，且客户端自动重试会加剧服务器负载，导致系统过载甚至死锁。"}]}], "sourceIds": ["SRC-096"], "sourceParts": [{"id": "SRC-096", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "灰度发布允许在小范围测试CDN交互，功能开关允许快速隔离问题，从而最小化用户影响。"}]}], "sourceIds": ["SRC-096"], "sourceParts": [{"id": "SRC-096", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "来源、范围与阅读连接"}]}], "sourceIds": ["SRC-097"]}, {"semanticGroup": "list-run", "lines": [{"indent": 0, "chunks": [{"t": "原书定位：PDF 374-403。"}]}, {"indent": 0, "chunks": [{"t": "源文件 SHA-256：75611d407c657cfcbe2079507dc6957df46836ad8cdf6bea30912fdeab4f3a96。"}]}, {"indent": 0, "chunks": [{"t": "“原书回顾”只归纳本单元作者的展开；“主题讲解”和理解检查属于书镜重构。"}]}, {"indent": 0, "chunks": [{"t": "版本边界：书中工具、Google组织结构和规模数字来自2016年中文版及更早实践，不作为当前产品或组织现状。"}]}], "sourceIds": ["SRC-098", "SRC-099", "SRC-100", "SRC-101"]}, {"semanticGroup": "list-run", "lines": [{"indent": 0, "chunks": [{"t": "边界：本章内容基于Google特定组织结构和基础设施，其他公司需根据自身情况调整。"}]}, {"indent": 0, "chunks": [{"t": "边界：LCE团队的有效性依赖于公司高层对可靠性标准的重视和支持。"}]}, {"indent": 0, "chunks": [{"t": "边界：功能开关框架的实施需要前期大量的工程投入和架构设计。"}]}, {"indent": 0, "chunks": [{"t": "阅读连接：下一单元是“第28章 迅速培养SRE加入on-call”，继续回答：如何平衡新SRE的入职培训与老员工的on-call效率，确保新人快速具备独立处理故障的能力，同时不增加团队负担？"}]}], "sourceIds": ["SRC-102", "SRC-103", "SRC-104", "SRC-105"]}];

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function latexBody(raw) {
    let value = raw
      .replace(/\\cdot/g, "·")
      .replace(/\\times/g, "×")
      .replace(/\\propto/g, "∝")
      .replace(/\\alpha/g, "α")
      .replace(/\\beta/g, "β")
      .replace(/\\gamma/g, "γ");
    value = escapeHtml(value);
    value = value.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    value = value.replace(/\^([A-Za-z0-9αβγ+\-]+)/g, "<sup>$1</sup>");
    value = value.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
    value = value.replace(/_([A-Za-z0-9]+)/g, "<sub>$1</sub>");
    return value;
  }

  function renderPlainAware(text) {
    const escaped = escapeHtml(text);
    return escaped.replace(
      /([\u3400-\u9fff]{3}(?:[，。！？；：、…—」』）》】]+)?)(\s*)$/u,
      '<span class="keep-cjk-tail">$1</span>$2'
    );
  }

  function renderMathAware(text) {
    const exactDisplay = text.trim().match(/^\$\$([\s\S]+)\$\$$/);
    const exactInline = text.trim().match(/^\$(?![\d?])([^$\n]+)\$$/);
    if (exactDisplay) return '<span class="math math-display">' + latexBody(exactDisplay[1]) + "</span>";
    if (exactInline) return '<span class="math math-display">' + latexBody(exactInline[1]) + "</span>";

    const pattern = /\$\$([\s\S]+?)\$\$|\$(?![\d?])([^$\n]+?)\$/g;
    let result = "";
    let cursor = 0;
    for (const match of text.matchAll(pattern)) {
      const at = match.index ?? 0;
      result += renderPlainAware(text.slice(cursor, at));
      result += '<span class="math">' + latexBody(match[1] ?? match[2]) + "</span>";
      cursor = at + match[0].length;
    }
    result += renderPlainAware(text.slice(cursor));
    return result;
  }

  const graphemeSegmenter = typeof Intl.Segmenter === "function"
    ? new Intl.Segmenter("zh", { granularity: "grapheme" })
    : null;

  function glyphCount(text) {
    const compact = String(text || "").replace(/\s/g, "");
    return graphemeSegmenter
      ? Array.from(graphemeSegmenter.segment(compact)).length
      : Array.from(compact).length;
  }

  function isListLike(text) {
    return /^\s*(?:[-+]\s+|\d+[.)]\s+)/.test(text);
  }

  function isDisplayMathSource(text) {
    const value = String(text || "").trim();
    return /^\$\$[\s\S]+\$\$$/.test(value) || /^\$(?![\d?])[^$\n]+\$$/.test(value);
  }

  function lineLength(line) {
    let count = 0;
    for (const chunk of line.chunks || []) {
      for (const char of chunk.t || "") {
        count += /[\u3000-\u30ff\u3400-\u9fff\uff00-\uffef]/.test(char) ? 1.8 : 1;
      }
    }
    return count;
  }

  function lengthTier(lines) {
    const max = Math.max(0, ...lines.map(lineLength)) + Math.max(0, lines.length - 1) * 4;
    if (max <= 2) return "single";
    if (max <= 6) return "short";
    if (max <= 10) return "medium";
    if (max <= 26) return "long";
    return "xlong";
  }

  function linesText(slide) {
    return (slide?.lines || []).map((line) => (line.chunks || []).map((chunk) => chunk.t || "").join("")).join("\n").trim();
  }

  function normalizeSlides(raw) {
    const slides = Array.isArray(raw) ? raw.slice() : [];
    const title = document.title.trim();
    if (slides[0]?.cover) return slides;
    if (slides[0] && linesText(slides[0]) === title) {
      slides[0] = { ...slides[0], cover: true, emphasis: true };
      return slides;
    }
    return [{ cover: true, emphasis: true, lines: [{ indent: 0, chunks: [{ t: title }] }], sourceIds: [] }, ...slides];
  }

  const SLIDES = normalizeSlides(RAW_SLIDES);

  function compositionFor(slide) {
    const lineCount = slide?.lines?.length ?? 0;
    if (slide?.cover) return "identity";
    if (slide?.emphasis || slide?.title) return "chapter";
    if (slide?.table || slide?.pre != null) return "evidence";
    if (slide?.quote) return "quotation";
    if (slide?.semanticGroup === "list-run" || (lineCount >= 2 && lineCount <= 4)) return "sequence";
    return "statement";
  }

  SLIDES.forEach((slide) => {
    const element = document.createElement("section");
    element.className = "slide";
    if (slide.cover) element.dataset.cover = "true";
    if (slide.emphasis) element.dataset.emphasis = "true";
    if (slide.title) element.dataset.title = "true";
    if (slide.depth) element.dataset.depth = String(slide.depth);
    if (slide.quote) element.dataset.quote = "true";
    if (slide.semanticGroup) element.dataset.semanticGroup = slide.semanticGroup;
    element.dataset.composition = compositionFor(slide);
    element.dataset.sourceIds = (slide.sourceIds || []).join(",");
    if (slide.sourceParts?.length) element.dataset.sourceParts = JSON.stringify(slide.sourceParts);

    if (slide.pre != null) {
      const preLines = String(slide.pre).split("\n");
      const preRows = preLines.length;
      const preCols = Math.max(0, ...preLines.map((line) => Array.from(line).length));
      element.dataset.preRows = String(preRows);
      element.dataset.preCols = String(preCols);
      element.dataset.preDensity = preRows >= 25 ? "x-dense" : preRows >= 17 ? "dense" : "normal";
      const wrap = document.createElement("div");
      wrap.className = "pre-wrap fit-box";
      const inner = document.createElement("div");
      if (slide.preTitle) {
        const title = document.createElement("div");
        title.className = "pre-title";
        title.textContent = slide.preTitle;
        inner.appendChild(title);
      }
      const pre = document.createElement("pre");
      pre.textContent = slide.pre;
      inner.appendChild(pre);
      wrap.appendChild(inner);
      element.appendChild(wrap);
    } else if (slide.table) {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap fit-box";
      if (slide.table.caption) {
        const caption = document.createElement("div");
        caption.className = "table-caption";
        caption.textContent = slide.table.caption;
        wrap.appendChild(caption);
      }
      const table = document.createElement("table");
      const hasHeader = slide.table.header === true;
      const tableHead = hasHeader ? document.createElement("thead") : null;
      const bodyRows = document.createElement("tbody");
      (slide.table.rows || []).forEach((row, rowIndex) => {
        const tr = document.createElement("tr");
        row.forEach((cell) => {
          const cellNode = document.createElement(hasHeader && rowIndex === 0 ? "th" : "td");
          cellNode.textContent = cell;
          tr.appendChild(cellNode);
        });
        if (hasHeader && rowIndex === 0) tableHead.appendChild(tr);
        else bodyRows.appendChild(tr);
      });
      if (tableHead) table.appendChild(tableHead);
      table.appendChild(bodyRows);
      wrap.appendChild(table);
      element.appendChild(wrap);
    } else if (slide.lines?.length) {
      const weights = slide.lines.map(lineLength);
      const lineCount = slide.lines.length;
      const maxWeight = Math.max(...weights);
      const totalWeight = weights.reduce((sum, value) => sum + value, 0);
      const density = maxWeight >= 45 || totalWeight >= 110 ? "dense" : maxWeight >= 24 || totalWeight >= 65 ? "medium" : "light";
      const layout = lineCount >= 2 && lineCount <= 4 ? "rows" : "single";

      const len = lengthTier(slide.lines);
      const semanticText = linesText(slide);
      const semanticAtom = lineCount === 1
        && glyphCount(semanticText) <= 16
        && !isListLike(semanticText)
        && !isDisplayMathSource(semanticText);
      element.dataset.len = len;
      element.dataset.lineCount = String(lineCount);
      element.dataset.density = density;
      element.dataset.layout = layout;
      if (semanticAtom) element.dataset.semanticAtom = "true";
      if (semanticAtom || (lineCount === 1 && ["single", "short", "medium"].includes(len))) element.dataset.takahashi = "true";

      const lines = document.createElement("div");
      lines.className = "lines fit-box";
      slide.lines.forEach((line, lineIndex) => {
        const node = document.createElement("div");
        node.className = "line";
        node.dataset.indent = String(line.indent || 0);
        node.dataset.lineIndex = String(lineIndex + 1);
        node.dataset.weight = String(Math.round(weights[lineIndex]));
        node.innerHTML = (line.chunks || []).map((chunk) => {
          const rendered = renderMathAware(chunk.t);
          return chunk.hl ? '<span class="hl">' + rendered + "</span>" : rendered;
        }).join("");
        lines.appendChild(node);
      });
      element.appendChild(lines);
      if (lines.querySelector(".math-display")) element.dataset.math = "display";
    }

    stage.appendChild(element);
  });

  const slides = Array.from(stage.querySelectorAll(".slide"));
  let index = 0;

  function fitSlide(slide) {
    const box = slide.querySelector(".fit-box");
    if (!box) return { scale: 1, fits: true };
    box.style.transform = "none";
    const style = getComputedStyle(slide);
    const availableWidth = Math.max(1, slide.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
    const availableHeight = Math.max(1, slide.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
    const contentWidth = Math.max(1, box.scrollWidth);
    const contentHeight = Math.max(1, box.scrollHeight);
    const scale = Math.min(1, availableWidth / contentWidth, availableHeight / contentHeight) * .975;
    box.style.transform = "scale(" + scale.toFixed(5) + ")";
    slide.dataset.fitScale = scale.toFixed(5);

    const content = box.getBoundingClientRect();
    const bounds = slide.getBoundingClientRect();
    const safeLeft = bounds.left + parseFloat(style.paddingLeft) - 1;
    const safeRight = bounds.right - parseFloat(style.paddingRight) + 1;
    const safeTop = bounds.top + parseFloat(style.paddingTop) - 1;
    const safeBottom = bounds.bottom - parseFloat(style.paddingBottom) + 1;
    const fits = content.left >= safeLeft && content.right <= safeRight && content.top >= safeTop && content.bottom <= safeBottom;
    slide.dataset.fits = String(fits);
    return { scale, fits };
  }

  function show(nextIndex) {
    nextIndex = Math.max(0, Math.min(slides.length - 1, nextIndex));
    slides[index]?.classList.remove("active");
    index = nextIndex;
    slides[index]?.classList.add("active");
    pager.textContent = String(index + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
    metaFooter.hidden = index !== 0;
    body.dataset.current = slides[index]?.dataset.emphasis === "true" || slides[index]?.dataset.cover === "true" ? "emphasis" : "theme";
    requestAnimationFrame(() => fitSlide(slides[index]));
  }

  function fullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  function isEditableTarget(target) {
    return target instanceof Element && Boolean(target.closest('input, textarea, select, [contenteditable="true"]'));
  }

  document.addEventListener("keydown", (event) => {
    if (isEditableTarget(event.target)) return;
    if (["ArrowRight", "ArrowDown", " ", "Enter", "j", "PageDown"].includes(event.key)) {
      event.preventDefault();
      show(index + 1);
    } else if (["ArrowLeft", "ArrowUp", "k", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(slides.length - 1);
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      fullscreen();
    }
  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
