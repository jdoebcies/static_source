<style>

<script>
  const RAW_SLIDES = [{"cover": true, "lines": [{"indent": 0, "chunks": [{"t": "《SRE：Google运维解密》第9章 简单化 · 原书回顾与主题讲解"}]}], "sourceIds": []}, {"lines": [{"indent": 0, "chunks": [{"t": "本单元要回答：软件系统本质上是动态和不稳定的，SRE需要在系统的灵活性和稳定性之间维持平衡。"}]}], "sourceIds": ["SRC-001"]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "一、原书回顾：作者怎样展开"}]}], "sourceIds": ["SRC-002"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "系统的稳定性与灵活性"}]}], "sourceIds": ["SRC-003"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节指出软件系统本质上是动态且不稳定的，SRE的核心工作是在灵活性与稳定性之间寻找平衡。"}]}], "sourceIds": ["SRC-004"], "sourceParts": [{"id": "SRC-004", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者通过“探索性编码”这一案例，说明在不熟悉的问题域中，可以通过设置代码保质期来换取灵活性，而不影响生产环境的稳定。"}]}], "sourceIds": ["SRC-004"], "sourceParts": [{"id": "SRC-004", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "接着论述了可靠的流程实际上能提高开发人员的灵活性，因为快速发布能让错误更显而易见，从而缩短修复时间，使开发人员能专注于功能与性能。"}]}], "sourceIds": ["SRC-004"], "sourceParts": [{"id": "SRC-004", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "乏味是一种美德"}]}], "sourceIds": ["SRC-005"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节强调对于软件而言，“乏味”是正面态度，因为生产环境中的意外是SRE最大的敌人。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者引用Fred Brooks关于“必要复杂度”与“意外复杂度”的区分，指出应通过工程努力消除后者。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE团队应在引入意外复杂度时及时抗议，并持续消除已负责系统中的复杂度，以确保代码按设计可预见地执行，避免侦探小说般的悬念与困惑。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "我绝对不放弃我的代码"}]}], "sourceIds": ["SRC-007"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论工程师对代码的情感依附问题，反对保留注释代码或功能开关，认为这会造成干扰和混乱，甚至像定时炸弹。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者以Knight Capital的经历为例，说明未执行代码的风险。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE推崇保证所有代码都有必须存在目的的实践，包括审查代码是否符合商业目标、定期删除无用代码，以及在测试中增加代码膨胀检测，确保每一行代码都承担明确职责。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "“负代码行”作为一个指标"}]}], "sourceIds": ["SRC-009"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节引入“软件膨胀”概念，描述软件随时间增加新功能而变慢变大的趋势。"}]}], "sourceIds": ["SRC-010"], "sourceParts": [{"id": "SRC-010", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "从SRE视角看，每行新代码都可能引入新缺陷，较小项目更易理解和测试。"}]}], "sourceIds": ["SRC-010"], "sourceParts": [{"id": "SRC-010", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者分享删除数千行无用代码的满意经历，主张在增加新功能需求时保持保守态度。"}]}], "sourceIds": ["SRC-010"], "sourceParts": [{"id": "SRC-010", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过“负代码行”这一指标，强调减少代码量是提升系统可靠性和可维护性的关键手段。"}]}], "sourceIds": ["SRC-010"], "sourceParts": [{"id": "SRC-010", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "最小 API"}]}], "sourceIds": ["SRC-011"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节引用圣埃克苏佩里名言，强调完美在于无可去除。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "API设计应遵循最小化原则，提供的方法和参数越少，API越易理解，开发者能更完善核心方法。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出，有意识地不解决某些问题能让团队更专注核心问题，使现有解决方案更好。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "一个简单且小的API通常标志着对问题有深刻理解，体现了“少即是多”的软件工程哲学。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "模块化"}]}], "sourceIds": ["SRC-013"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节将模块化概念延伸至分布式系统，强调隔离式变更对系统运维的必要性。"}]}], "sourceIds": ["SRC-014"], "sourceParts": [{"id": "SRC-014", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过推行二进制文件或配置间的松耦合，同时提高开发灵活性和系统稳定性。"}]}], "sourceIds": ["SRC-014"], "sourceParts": [{"id": "SRC-014", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出，API版本化允许开发人员安全升级，避免全面生产更新。"}]}], "sourceIds": ["SRC-014"], "sourceParts": [{"id": "SRC-014", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "此外，模块化适用于数据格式，如Google Protobuf旨在创建前后兼容的传输格式，确保每个模块具有明确范围，避免“大杂烩”式设计。"}]}], "sourceIds": ["SRC-014"], "sourceParts": [{"id": "SRC-014", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "发布的简单化"}]}], "sourceIds": ["SRC-015"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节主张简单的发布流程优于复杂流程，因为测量单一变化的影响比应对一系列变化更容易。"}]}], "sourceIds": ["SRC-016"], "sourceParts": [{"id": "SRC-016", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过类比机器学习中的梯度下降法，说明按更小批次发布能让每个变更的影响独立理解，从而更自信地快速发布。"}]}], "sourceIds": ["SRC-016"], "sourceParts": [{"id": "SRC-016", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种渐进式更新方式有助于在系统改善与退化之间寻找最佳方案，避免同时发布多个不相关更改导致的性能定位困难。"}]}], "sourceIds": ["SRC-016"], "sourceParts": [{"id": "SRC-016", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "小结"}]}], "sourceIds": ["SRC-017"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节重申简单性是可靠性的前提条件，简化任务步骤并非偷懒，而是明确实际任务并更易实现。"}]}], "sourceIds": ["SRC-018"], "sourceParts": [{"id": "SRC-018", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过对新功能说“不”来保持环境整洁，避免分心，从而持续关注创新并进行真正的工程工作。"}]}], "sourceIds": ["SRC-018"], "sourceParts": [{"id": "SRC-018", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这一总结呼应全章主题，强调简化对于维持系统稳定性和灵活性的核心作用，为后续章节奠定思想基础。"}]}], "sourceIds": ["SRC-018"], "sourceParts": [{"id": "SRC-018", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "二、主题讲解：简单化：平衡稳定与灵活的工程实践"}]}], "sourceIds": ["SRC-019"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "理解复杂度的来源与分类"}]}], "sourceIds": ["SRC-020"]}, {"lines": [{"indent": 0, "chunks": [{"t": "软件系统的复杂性分为“必要复杂度”和“意外复杂度”。必要复杂度由问题定义固有决定，无法移除；"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "而意外复杂度源于工程实现不当，可通过努力消除。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "例如，Web服务器处理页面是必要的，但为减少GC影响而引入的Java特定优化可能带来意外复杂度。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE应识别并抗议引入意外复杂度的行为，持续消除已负责系统中的冗余。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "理解这一区别有助于团队聚焦于真正影响可靠性的因素，而非被不必要的技术债务困扰。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "代码精简与模块化设计"}]}], "sourceIds": ["SRC-022"]}, {"lines": [{"indent": 0, "chunks": [{"t": "代码精简要求每行代码都有明确目的，反对保留注释代码或功能开关，因其易造成混乱和潜在风险。"}]}], "sourceIds": ["SRC-023"], "sourceParts": [{"id": "SRC-023", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "模块化设计通过松耦合和API版本化，隔离系统变更，提高稳定性和灵活性。"}]}], "sourceIds": ["SRC-023"], "sourceParts": [{"id": "SRC-023", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "例如，Protobuf确保数据格式兼容，避免“大杂烩”式模块。"}]}], "sourceIds": ["SRC-023"], "sourceParts": [{"id": "SRC-023", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "模块化不仅适用于代码，也适用于发布流程，通过小批次发布独立理解变更影响，降低系统整体风险，提升运维效率。"}]}], "sourceIds": ["SRC-023"], "sourceParts": [{"id": "SRC-023", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "发布流程的简化策略"}]}], "sourceIds": ["SRC-024"]}, {"lines": [{"indent": 0, "chunks": [{"t": "简化发布流程是提升可靠性的关键。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "相比同时发布多个不相关更改，小批次发布能独立评估每个变更的影响，类似梯度下降法逐步优化。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这要求团队建立清晰的发布标准和监控机制，确保每次变更可追溯、可回滚。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过减少发布复杂度，团队能更快发现并修复问题，维持系统稳定，同时保持开发灵活性，避免大规模重构带来的风险。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "简单化对可靠性的长期价值"}]}], "sourceIds": ["SRC-026"]}, {"lines": [{"indent": 0, "chunks": [{"t": "简单化并非偷懒，而是通过明确任务边界和减少干扰，提升工程效率。"}]}], "sourceIds": ["SRC-027"], "sourceParts": [{"id": "SRC-027", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "保持环境整洁有助于团队专注创新，避免分心。长期来看，简单系统更易测试、理解和维护，降低缺陷引入概率。"}]}], "sourceIds": ["SRC-027"], "sourceParts": [{"id": "SRC-027", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE应通过持续简化代码、API和发布流程，构建稳定可靠的系统，实现灵活性与稳定性的平衡，确保软件在动态环境中持续交付价值。"}]}], "sourceIds": ["SRC-027"], "sourceParts": [{"id": "SRC-027", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "检验理解"}]}], "sourceIds": ["SRC-028"]}, {"lines": [{"indent": 0, "chunks": [{"t": "情形：假设你负责一个核心API，近期频繁因新增功能导致系统不稳定。"}]}], "sourceIds": ["SRC-029"], "sourceParts": [{"id": "SRC-029", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "团队提议保留所有历史代码分支以备不时之需，并增加更多功能开关。"}]}], "sourceIds": ["SRC-029"], "sourceParts": [{"id": "SRC-029", "index": 2, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "问题：基于本章关于简单化和模块化的原则，你会如何反驳这些提议？请说明理由并给出替代方案。"}]}], "sourceIds": ["SRC-030"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "核对思路（先作答再看）"}]}], "sourceIds": ["SRC-031"]}, {"lines": [{"indent": 0, "chunks": [{"t": "反驳理由：保留历史代码和功能开关会增加意外复杂度，造成混乱和潜在风险，违背“负代码行”指标和模块化原则。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "替代方案："}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "删除无用代码，实施最小API设计，通过版本化隔离变更，采用小批次发布独立测试影响，确保每行代码有明确目的，提升系统稳定性和可维护性。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "来源、范围与阅读连接"}]}], "sourceIds": ["SRC-033"]}, {"semanticGroup": "list-run", "lines": [{"indent": 0, "chunks": [{"t": "原书定位：PDF 130-136。"}]}, {"indent": 0, "chunks": [{"t": "源文件 SHA-256：75611d407c657cfcbe2079507dc6957df46836ad8cdf6bea30912fdeab4f3a96。"}]}, {"indent": 0, "chunks": [{"t": "“原书回顾”只归纳本单元作者的展开；“主题讲解”和理解检查属于书镜重构。"}]}, {"indent": 0, "chunks": [{"t": "版本边界：书中工具、Google组织结构和规模数字来自2016年中文版及更早实践，不作为当前产品或组织现状。"}]}], "sourceIds": ["SRC-034", "SRC-035", "SRC-036", "SRC-037"]}, {"semanticGroup": "list-run", "lines": [{"indent": 0, "chunks": [{"t": "边界：本章强调简单化是可靠性的前提，但未提供具体量化指标（如代码行数阈值），需结合团队实际评估。"}]}, {"indent": 0, "chunks": [{"t": "边界：模块化设计需平衡松耦合与紧密协作，过度模块化可能增加沟通成本，需根据系统规模调整。"}]}, {"indent": 0, "chunks": [{"t": "边界：发布简化策略依赖有效的监控和回滚机制，若团队缺乏相应工具，小批次发布可能难以实施。"}]}, {"indent": 0, "chunks": [{"t": "阅读连接：下一单元是“第10章 基于时间序列数据进行有效报警”，继续回答：如何构建一个能支撑大规模服务、低维护成本且能自动过滤噪声的有效报警系统？"}]}], "sourceIds": ["SRC-038", "SRC-039", "SRC-040", "SRC-041"]}];
  const stage = document.getElementById("stage");
  const pager = document.getElementById("pager");
  const metaFooter = document.getElementById("metaFooter");
  const body = document.body;

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function latexBody(raw) {
    let value = raw
      .replace(/\\cdot/g, "·")
      .replace(/\\times/g, "×")
      .replace(/\\propto/g, "∝")
      .replace(/\\alpha/g, "α")
      .replace(/\\beta/g, "β")
      .replace(/\\gamma/g, "γ");
    value = escapeHtml(value);
    value = value.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    value = value.replace(/\^([A-Za-z0-9αβγ+\-]+)/g, "<sup>$1</sup>");
    value = value.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
    value = value.replace(/_([A-Za-z0-9]+)/g, "<sub>$1</sub>");
    return value;
  }

  function renderPlainAware(text) {
    const escaped = escapeHtml(text);
    return escaped.replace(
      /([\u3400-\u9fff]{3}(?:[，。！？；：、…—」』）》】]+)?)(\s*)$/u,
      '<span class="keep-cjk-tail">$1</span>$2'
    );
  }

  function renderMathAware(text) {
    const exactDisplay = text.trim().match(/^\$\$([\s\S]+)\$\$$/);
    const exactInline = text.trim().match(/^\$(?![\d?])([^$\n]+)\$$/);
    if (exactDisplay) return '<span class="math math-display">' + latexBody(exactDisplay[1]) + "</span>";
    if (exactInline) return '<span class="math math-display">' + latexBody(exactInline[1]) + "</span>";

    const pattern = /\$\$([\s\S]+?)\$\$|\$(?![\d?])([^$\n]+?)\$/g;
    let result = "";
    let cursor = 0;
    for (const match of text.matchAll(pattern)) {
      const at = match.index ?? 0;
      result += renderPlainAware(text.slice(cursor, at));
      result += '<span class="math">' + latexBody(match[1] ?? match[2]) + "</span>";
      cursor = at + match[0].length;
    }
    result += renderPlainAware(text.slice(cursor));
    return result;
  }

  const graphemeSegmenter = typeof Intl.Segmenter === "function"
    ? new Intl.Segmenter("zh", { granularity: "grapheme" })
    : null;

  function glyphCount(text) {
    const compact = String(text || "").replace(/\s/g, "");
    return graphemeSegmenter
      ? Array.from(graphemeSegmenter.segment(compact)).length
      : Array.from(compact).length;
  }

  function isListLike(text) {
    return /^\s*(?:[-+]\s+|\d+[.)]\s+)/.test(text);
  }

  function isDisplayMathSource(text) {
    const value = String(text || "").trim();
    return /^\$\$[\s\S]+\$\$$/.test(value) || /^\$(?![\d?])[^$\n]+\$$/.test(value);
  }

  function lineLength(line) {
    let count = 0;
    for (const chunk of line.chunks || []) {
      for (const char of chunk.t || "") {
        count += /[\u3000-\u30ff\u3400-\u9fff\uff00-\uffef]/.test(char) ? 1.8 : 1;
      }
    }
    return count;
  }

  function lengthTier(lines) {
    const max = Math.max(0, ...lines.map(lineLength)) + Math.max(0, lines.length - 1) * 4;
    if (max <= 2) return "single";
    if (max <= 6) return "short";
    if (max <= 10) return "medium";
    if (max <= 26) return "long";
    return "xlong";
  }

  function linesText(slide) {
    return (slide?.lines || []).map((line) => (line.chunks || []).map((chunk) => chunk.t || "").join("")).join("\n").trim();
  }

  function normalizeSlides(raw) {
    const slides = Array.isArray(raw) ? raw.slice() : [];
    const title = document.title.trim();
    if (slides[0]?.cover) return slides;
    if (slides[0] && linesText(slides[0]) === title) {
      slides[0] = { ...slides[0], cover: true, emphasis: true };
      return slides;
    }
    return [{ cover: true, emphasis: true, lines: [{ indent: 0, chunks: [{ t: title }] }], sourceIds: [] }, ...slides];
  }

  const SLIDES = normalizeSlides(RAW_SLIDES);

  function compositionFor(slide) {
    const lineCount = slide?.lines?.length ?? 0;
    if (slide?.cover) return "identity";
    if (slide?.emphasis || slide?.title) return "chapter";
    if (slide?.table || slide?.pre != null) return "evidence";
    if (slide?.quote) return "quotation";
    if (slide?.semanticGroup === "list-run" || (lineCount >= 2 && lineCount <= 4)) return "sequence";
    return "statement";
  }

  SLIDES.forEach((slide) => {
    const element = document.createElement("section");
    element.className = "slide";
    if (slide.cover) element.dataset.cover = "true";
    if (slide.emphasis) element.dataset.emphasis = "true";
    if (slide.title) element.dataset.title = "true";
    if (slide.depth) element.dataset.depth = String(slide.depth);
    if (slide.quote) element.dataset.quote = "true";
    if (slide.semanticGroup) element.dataset.semanticGroup = slide.semanticGroup;
    element.dataset.composition = compositionFor(slide);
    element.dataset.sourceIds = (slide.sourceIds || []).join(",");
    if (slide.sourceParts?.length) element.dataset.sourceParts = JSON.stringify(slide.sourceParts);

    if (slide.pre != null) {
      const preLines = String(slide.pre).split("\n");
      const preRows = preLines.length;
      const preCols = Math.max(0, ...preLines.map((line) => Array.from(line).length));
      element.dataset.preRows = String(preRows);
      element.dataset.preCols = String(preCols);
      element.dataset.preDensity = preRows >= 25 ? "x-dense" : preRows >= 17 ? "dense" : "normal";
      const wrap = document.createElement("div");
      wrap.className = "pre-wrap fit-box";
      const inner = document.createElement("div");
      if (slide.preTitle) {
        const title = document.createElement("div");
        title.className = "pre-title";
        title.textContent = slide.preTitle;
        inner.appendChild(title);
      }
      const pre = document.createElement("pre");
      pre.textContent = slide.pre;
      inner.appendChild(pre);
      wrap.appendChild(inner);
      element.appendChild(wrap);
    } else if (slide.table) {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap fit-box";
      if (slide.table.caption) {
        const caption = document.createElement("div");
        caption.className = "table-caption";
        caption.textContent = slide.table.caption;
        wrap.appendChild(caption);
      }
      const table = document.createElement("table");
      const hasHeader = slide.table.header === true;
      const tableHead = hasHeader ? document.createElement("thead") : null;
      const bodyRows = document.createElement("tbody");
      (slide.table.rows || []).forEach((row, rowIndex) => {
        const tr = document.createElement("tr");
        row.forEach((cell) => {
          const cellNode = document.createElement(hasHeader && rowIndex === 0 ? "th" : "td");
          cellNode.textContent = cell;
          tr.appendChild(cellNode);
        });
        if (hasHeader && rowIndex === 0) tableHead.appendChild(tr);
        else bodyRows.appendChild(tr);
      });
      if (tableHead) table.appendChild(tableHead);
      table.appendChild(bodyRows);
      wrap.appendChild(table);
      element.appendChild(wrap);
    } else if (slide.lines?.length) {
      const weights = slide.lines.map(lineLength);
      const lineCount = slide.lines.length;
      const maxWeight = Math.max(...weights);
      const totalWeight = weights.reduce((sum, value) => sum + value, 0);
      const density = maxWeight >= 45 || totalWeight >= 110 ? "dense" : maxWeight >= 24 || totalWeight >= 65 ? "medium" : "light";
      const layout = lineCount >= 2 && lineCount <= 4 ? "rows" : "single";

      const len = lengthTier(slide.lines);
      const semanticText = linesText(slide);
      const semanticAtom = lineCount === 1
        && glyphCount(semanticText) <= 16
        && !isListLike(semanticText)
        && !isDisplayMathSource(semanticText);
      element.dataset.len = len;
      element.dataset.lineCount = String(lineCount);
      element.dataset.density = density;
      element.dataset.layout = layout;
      if (semanticAtom) element.dataset.semanticAtom = "true";
      if (semanticAtom || (lineCount === 1 && ["single", "short", "medium"].includes(len))) element.dataset.takahashi = "true";

      const lines = document.createElement("div");
      lines.className = "lines fit-box";
      slide.lines.forEach((line, lineIndex) => {
        const node = document.createElement("div");
        node.className = "line";
        node.dataset.indent = String(line.indent || 0);
        node.dataset.lineIndex = String(lineIndex + 1);
        node.dataset.weight = String(Math.round(weights[lineIndex]));
        node.innerHTML = (line.chunks || []).map((chunk) => {
          const rendered = renderMathAware(chunk.t);
          return chunk.hl ? '<span class="hl">' + rendered + "</span>" : rendered;
        }).join("");
        lines.appendChild(node);
      });
      element.appendChild(lines);
      if (lines.querySelector(".math-display")) element.dataset.math = "display";
    }

    stage.appendChild(element);
  });

  const slides = Array.from(stage.querySelectorAll(".slide"));
  let index = 0;

  function fitSlide(slide) {
    const box = slide.querySelector(".fit-box");
    if (!box) return { scale: 1, fits: true };
    box.style.transform = "none";
    const style = getComputedStyle(slide);
    const availableWidth = Math.max(1, slide.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
    const availableHeight = Math.max(1, slide.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
    const contentWidth = Math.max(1, box.scrollWidth);
    const contentHeight = Math.max(1, box.scrollHeight);
    const scale = Math.min(1, availableWidth / contentWidth, availableHeight / contentHeight) * .975;
    box.style.transform = "scale(" + scale.toFixed(5) + ")";
    slide.dataset.fitScale = scale.toFixed(5);

    const content = box.getBoundingClientRect();
    const bounds = slide.getBoundingClientRect();
    const safeLeft = bounds.left + parseFloat(style.paddingLeft) - 1;
    const safeRight = bounds.right - parseFloat(style.paddingRight) + 1;
    const safeTop = bounds.top + parseFloat(style.paddingTop) - 1;
    const safeBottom = bounds.bottom - parseFloat(style.paddingBottom) + 1;
    const fits = content.left >= safeLeft && content.right <= safeRight && content.top >= safeTop && content.bottom <= safeBottom;
    slide.dataset.fits = String(fits);
    return { scale, fits };
  }

  function show(nextIndex) {
    nextIndex = Math.max(0, Math.min(slides.length - 1, nextIndex));
    slides[index]?.classList.remove("active");
    index = nextIndex;
    slides[index]?.classList.add("active");
    pager.textContent = String(index + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
    metaFooter.hidden = index !== 0;
    body.dataset.current = slides[index]?.dataset.emphasis === "true" || slides[index]?.dataset.cover === "true" ? "emphasis" : "theme";
    requestAnimationFrame(() => fitSlide(slides[index]));
  }

  function fullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  function isEditableTarget(target) {
    return target instanceof Element && Boolean(target.closest('input, textarea, select, [contenteditable="true"]'));
  }

  document.addEventListener("keydown", (event) => {
    if (isEditableTarget(event.target)) return;
    if (["ArrowRight", "ArrowDown", " ", "Enter", "j", "PageDown"].includes(event.key)) {
      event.preventDefault();
      show(index + 1);
    } else if (["ArrowLeft", "ArrowUp", "k", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(slides.length - 1);
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      fullscreen();
    }
  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
