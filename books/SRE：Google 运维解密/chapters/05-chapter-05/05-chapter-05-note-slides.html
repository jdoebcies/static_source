  const RAW_SLIDES = [{"cover": true, "lines": [{"indent": 0, "chunks": [{"t": "《SRE：Google运维解密》第5章 减少琐事 · 原书回顾与主题讲解"}]}], "sourceIds": []}, {"lines": [{"indent": 0, "chunks": [{"t": "本单元要回答：怎样理解并使用“减少琐事”，以及它在什么条件下不适用。"}]}], "sourceIds": ["SRC-001"]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "一、原书回顾：作者怎样展开"}]}], "sourceIds": ["SRC-002"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "琐事的定义"}]}], "sourceIds": ["SRC-003"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节界定琐事为运维中手动、重复、可自动化且无持久价值的工作，区别于流程开销与有长期价值的脏活。"}]}], "sourceIds": ["SRC-004"], "sourceParts": [{"id": "SRC-004", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者通过排除法厘清概念边界，指出琐事虽具战术性但不应成为常态，为后文量化其危害及自动化目标奠定逻辑基础。"}]}], "sourceIds": ["SRC-004"], "sourceParts": [{"id": "SRC-004", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "手动性"}]}], "sourceIds": ["SRC-005"]}, {"lines": [{"indent": 0, "chunks": [{"t": "该标题指出琐事包含手动执行脚本的时间，而非脚本运行时间。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者通过对比手动运行与自动执行的区别，强调只要涉及人工干预耗时，即便脚本本身自动化，其手动操作部分仍属琐事。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这为界定自动化边界提供了具体标准。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "重复性的"}]}], "sourceIds": ["SRC-007"]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者定义琐事为不停反复做的工作，而非首次或第二次解决新问题。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过区分解决新出现问题的创新性与重复性劳动，说明只有当工作成 , "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过说明良好设计的服务应能应对数量级增长而不需额外一次性工作，强调琐事随规模扩张而增加的特性，反衬工程优化的必要性。"}]}], "sourceIds": ["SRC-016"], "sourceParts": [{"id": "SRC-016", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "为什么琐事越少越好"}]}], "sourceIds": ["SRC-017"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节提出SRE应将琐事时间控制在50%以下，以保障工程投入。"}]}], "sourceIds": ["SRC-018"], "sourceParts": [{"id": "SRC-018", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出若不控制，琐事将吞噬全部时间，而工程工作能提升服务规模与可靠性，从而从根源减少运维负担，确立SRE作为工程组织的核心价值。"}]}], "sourceIds": ["SRC-018"], "sourceParts": [{"id": "SRC-018", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "琐事的计算"}]}], "sourceIds": ["SRC-019"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节通过On-call轮值周期计算琐事最低占比，指出中断性工作为主要来源。"}]}], "sourceIds": ["SRC-020"], "sourceParts": [{"id": "SRC-020", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "结合Google调查数据，揭示团队间琐事负荷差异，强调管理者需均衡分布负荷并引导员工转向工程项，以达成50%的目标。"}]}], "sourceIds": ["SRC-020"], "sourceParts": [{"id": "SRC-020", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "什么算作工程工作"}]}], "sourceIds": ["SRC-021"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节定义工程工作为需主观判断、具长期战略价值且能改善服务的工作，涵盖软件与系统工程。"}]}], "sourceIds": ["SRC-022"], "sourceParts": [{"id": "SRC-022", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过对比琐事与流程负担，明确工程工作对扩大服务规模的重要性，确立长期工程投入低于50%需警惕的原则。"}]}], "sourceIds": ["SRC-022"], "sourceParts": [{"id": "SRC-022", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "软件工程"}]}], "sourceIds": ["SRC-023"]}, {"lines": [{"indent": dex": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "实践检查：区分琐事与工程工作"}]}], "sourceIds": ["SRC-056"]}, {"lines": [{"indent": 0, "chunks": [{"t": "假设你负责一个高流量服务，发现大量时间用于手动配置服务器。请判断这是否属琐事？"}]}], "sourceIds": ["SRC-057"], "sourceParts": [{"id": "SRC-057", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "若配置重复且无持久价值，即为琐事，应自动化；若配置优化提升系统稳定性，则属工程工作。核对思路："}]}], "sourceIds": ["SRC-057"], "sourceParts": [{"id": "SRC-057", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "问自己“完成后服务状态是否永久改变？”若否，即为琐事。"}]}], "sourceIds": ["SRC-057"], "sourceParts": [{"id": "SRC-057", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过此区分，可优先自动化重复任务，保留工程投入，确保持续改进。"}]}], "sourceIds": ["SRC-057"], "sourceParts": [{"id": "SRC-057", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "检验理解"}]}], "sourceIds": ["SRC-058"]}, {"lines": [{"indent": 0, "chunks": [{"t": "情形：某SRE团队发现，随着用户量增长，手动审核日志的工作量线性增加，导致工程师疲惫且新功能发布延迟。"}]}], "sourceIds": ["SRC-059"]}, {"lines": [{"indent": 0, "chunks": [{"t": "问题：请分析此场景中的工作是否属于琐事？若属于，应如何通过工程手段减少？若不属于，原因是什么？"}]}], "sourceIds": ["SRC-060"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "核对思路（先作答再看）"}]}], "sourceIds": ["SRC-061"]}, {"lines": [{"indent": 0, "chunks": [{"t": "此工作属琐事，因手动、重复、线性增长且无持久价值。应通过自动化日志分析工具或引入AI审核减少手动操作。"}]}], "sourceIds": ["SRC-062"], "sourceParts": [{"id": "SRC-062", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "若审核需主观判断复杂异常，则可能属工程工作，需优化算法而非完全自动化。"}]}], "sourceIds": ["SRC-062"], "sourceParts": [{"id": "SRC-062", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "来源、范围与阅读连接"}]}], "sourceIds": ["SRC-063"]}, {"semanticGroup": "list-run", "lines": [{"indent": 0, "chunks": [{"t": "原书定位：PDF 80-85。"}]}, {"indent": 0, "chunks": [{"t": "源文件 SHA-256：75611d407c657cfcbe2079507dc6957df46836ad8cdf6bea30912fdeab4f3a96。"}]}, {"indent": 0, "chunks": [{"t": "“原书回顾”只归纳本单元作者的展开；“主题讲解”和理解检查属于书镜重构。"}]}, {"indent": 0, "chunks": [{"t": "版本边界：书中工具、Google组织结构和规模数字来自2016年中文版及更早实践，不作为当前产品或组织现状。"}]}], "sourceIds": ["SRC-064", "SRC-065", "SRC-066", "SRC-067"]}, {"semanticGroup": "list-run", "lines": [{"indent": 0, "chunks": [{"t": "边界：琐事定义基于Google SRE实践，其他团队可能因文化或技术栈差异有不同标准。"}]}, {"indent": 0, "chunks": [{"t": "边界：50%工程时间目标为Google经验，非所有团队通用，需结合实际情况调整。"}]}, {"indent": 0, "chunks": [{"t": "边界：自动化并非万能，需权衡开发成本与维护复杂度，避免过度工程化。"}]}, {"indent": 0, "chunks": [{"t": "阅读连接：下一单元是“第6章 分布式系统的监控”，继续回答：怎样理解并使用“分布式系统的监控”，以及它在什么条件下不适用。"}]}], "sourceIds": ["SRC-068", "SRC-069", "SRC-070", "SRC-071"]}];
  const stage = document.getElementById("stage");

  function escapeHtml(value) {

  function latexBody(raw) {

      .replace(/\\cdot/g, "·")

      .replace(/\\propto/g, "∝")

      .replace(/\\beta/g, "β")
      .replace(/\\gamma/g, "γ");
    value = escapeHtml(value);
    value = value.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    value = value.replace(/\^([A-Za-z0-9αβγ+\-]+)/g, "<sup>$1</sup>");
    value = value.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
    value = value.replace(/_([A-Za-z0-9]+)/g, "<sub>$1</sub>");

  function renderPlainAware(text) {

    const pattern = /\$\$([\s\S]+?)\$\$|\$(?![\d?])([^$\n]+?)\$/g;

    let cursor = 0;
    for (const match of text.matchAll(pattern)) {

    const style = getComputedStyle(slide);
    const availableWidth = Math.max(1, slide.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
    const availableHeight = Math.max(1, slide.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
    const contentWidth = Math.max(1, box.scrollWidth);
    const contentHeight = Math.max(1, box.scrollHeight);
    const scale = Math.min(1, availableWidth / contentWidth, availableHeight / contentHeight) * .975;
    box.style.transform = "scale(" + scale.toFixed(5) + ")";
    slide.dataset.fitScale = scale.toFixed(5);

    const content = box.getBoundingClientRect();
    const bounds = slide.getBoundingClientRect();
    const safeLeft = bounds.left + parseFloat(style.paddingLeft) - 1;
    const safeRight = bounds.right - parseFloat(style.paddingRight) + 1;
    const safeTop = bounds.top + parseFloat(style.paddingTop) - 1;
    const safeBottom = bounds.bottom - parseFloat(style.paddingBottom) + 1;
    const fits = content.left >= safeLeft && content.right <= safeRight && content.top >= safeTop && content.bottom <= safeBottom;
    slide.dataset.fits = String(fits);
    return { scale, fits };
  }

  function show(nextIndex) {
    nextIndex = Math.max(0, Math.min(slides.length - 1, nextIndex));
    slides[index]?.classList.remove("active");
    index = nextIndex;
    slides[index]?.classList.add("active");
    pager.textContent = String(index + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
    metaFooter.hidden = index !== 0;
    body.dataset.current = slides[index]?.dataset.emphasis === "true" || slides[index]?.dataset.cover === "true" ? "emphasis" : "theme";
    requestAnimationFrame(() => fitSlide(slides[index]));
  }

  function fullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  function isEditableTarget(target) {
    return target instanceof Element && Boolean(target.closest('input, textarea, select, [contenteditable="true"]'));
  }

  document.addEventListener("keydown", (event) => {
    if (isEditableTarget(event.target)) return;
    if (["ArrowRight", "ArrowDown", " ", "Enter", "j", "PageDown"].includes(event.key)) {
      event.preventDefault();
      show(index + 1);
    } else if (["ArrowLeft", "ArrowUp", "k", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(slides.length - 1);
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      fullscreen();
    }
  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
