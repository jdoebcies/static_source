致性要求及数据大小。"}]}], "sourceIds": ["SRC-030"], "sourceParts": [{"id": "SRC-030", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过列举部署策略如局部或广域部署、仲裁过程、分片等，说明性能优化需综合考虑。"}]}], "sourceIds": ["SRC-030"], "sourceParts": [{"id": "SRC-030", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "强调没有最优算法，需根据系统负载和部署情况权衡，引出后续具体性能优化技术的讨论。"}]}], "sourceIds": ["SRC-030"], "sourceParts": [{"id": "SRC-030", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "复合式Paxos：消息流过程详解"}]}], "sourceIds": ["SRC-031"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节详解复合式Paxos的消息流过程，引入强势领头人概念以优化性能。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在正常状态下，提议者只需向法定人数进程发送一次消息即可达成共识。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者通过图示说明第一阶段建立有序视图后，后续阶段可跳过第一阶段直接发送Accept消息。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "同时指出领头人更换可能导致“提议者决斗”，引发活跃死锁，需通过随机变量或固定领头人来解决。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "应对大量的读操作"}]}], "sourceIds": ["SRC-033"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节探讨应对大量读操作的优化策略，指出读操作居多的系统需优化性能。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明数据可从任意副本读取，若无需强一致性，过期数据仅造成额外工作。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "为保障读取最新数据，需进行只读共识操作、从稳定领头人读取或使用法定租约协议。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "法定租约通过发放短期租约，换取强一致性本地读操作的可能，平衡读写性能。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "法定租约"}]}], "sourceIds": ["SRC-035"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节深入解析法定租约技术，旨在降低操作延迟和提高读操作吞吐量。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该技术向法定人数进程发放带有时间范围的租约，期间数据修改需所有租约进程响应。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出该技术适用于读操作多且数据集中的系统，通过牺牲部分写性能换取强一致性本地读，有效缓解经典Paxos中强一致性读带来的性能瓶颈，提升系统整体效率。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "分布式共识系统的性能与网络延迟"}]}], "sourceIds": ["SRC-037"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析分布式共识系统的性能与网络延迟，指出写性能受网络往返时间（RTT）和磁盘写入时间限制。"}]}], "sourceIds": ["SRC-038"], "sourceParts": [{"id": "SRC-038", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明RTT受物理距离和网络拥塞影响，TCP/IP连接建立和慢启动机制增加开销。"}]}], "sourceIds": ["SRC-038"], "sourceParts": [{"id": "SRC-038", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过引入地域性代理池，减少客户端跨地理区域打开TCP连接的开销，代理池负责包装分片逻辑和负载均衡，优化客户端体验。"}]}], "sourceIds": ["SRC-038"], "sourceParts": [{"id": "SRC-038", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "快速Paxos协议：性能优化"}]}], "sourceIds": ["SRC-039"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节介绍快速Paxos协议的性能优化，该协议允许客户端直接向接收者发送Propose消息，替代经典Paxos的两步操作。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出，若客户端到接收者RTT高而接收者间RTT低，快速Paxos可能因慢速网络并发操作而变慢。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "此外，客户端直接提议使批处理困难，因提议独立到达接收者，难以合并，影响吞吐量优化效果。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "稳定的领头人机制"}]}], "sourceIds": ["SRC-041"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论稳定的领头人机制，指出Zab和Raft等协议通过选举稳定领头人提高性能。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "领头人始终拥有最新信息，利于读操作优化，但所有写操作需经领头人，增加远距离客户端延迟。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "领头人外发带宽是瓶颈，因其发送包含数据的提议。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者建议采用稳定领头人或轮换机制，平衡性能与故障域，减少广域网络中的延迟影响。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "批处理"}]}], "sourceIds": ["SRC-043"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节阐述批处理机制对系统吞吐量的提升，指出批处理可与流水线机制结合，使多个提议同时进行，类似TCP/IP滑动窗口。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "流水线中的请求通过视图序号和交易序号全局排序，不违反复制状态机要求。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者提及详细讨论见相关文献，强调批处理将磁盘日志写开销与网络延迟分布到更多操作上，提高系统整体吞吐量，优化资源利用。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "磁盘访问"}]}], "sourceIds": ["SRC-045"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析磁盘访问对共识系统性能的影响，指出节点需将请求写入持久化存储以恢复状态。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在Paxos协议中，接收者在承诺前需写入磁盘，提议者在发送Accept前也需写入。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明磁盘写入时间约1毫秒至数毫秒，影响共识操作延迟。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过合并日志和批处理操作，减少磁盘寻址时间，提高每秒处理操作数，优化系统性能。"}]}], "sourceIds": ["SRC-046"], "sourceParts": [{"id": "SRC-046", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "分布式共识系统的部署"}]}], "sourceIds": ["SRC-047"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论分布式共识系统的部署，强调副本数量和位置是关键决策。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出，2f+1副本可容忍f个失败，3副本可容忍1个失败，5副本可容忍2个失败。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "部署需权衡可靠性、维护频率、危险性、性能和成本。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过选择副本数量和位置，系统可在故障域间平衡，确保在部分副本失败时仍能运行，同时最小化网络延迟对性能的影响。"}]}], "sourceIds": ["SRC-048"], "sourceParts": [{"id": "SRC-048", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "副本的数量"}]}], "sourceIds": ["SRC-049"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论副本数量的选择，指出3副本可容忍1个失败，5副本可容忍2个失败。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明，若大部分副本不可访问，系统进入无法恢复状态，需管理员强制重新配置，但存在数据丢失风险。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过监控副本状态和日志，系统管理员可决定是等待恢复还是强制配置，确保系统鲁棒性。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "副本数量决策需基于可靠性、维护频率和成本的综合权衡。"}]}], "sourceIds": ["SRC-050"], "sourceParts": [{"id": "SRC-050", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "副本的位置"}]}], "sourceIds": ["SRC-051"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析副本位置的部署决策，主要权衡故障域数量和延迟要求。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出，随着副本距离增加，RTT增加但故障容忍度提高。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "部署需考虑客户端可见性能，理想情况下最小化客户端与共识系统的RTT。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在无领头人协议中，均匀分布副本可形成固定系统性能。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调，需考虑灾难恢复，将数据备份在其他地方，以应对软件和人为错误导致的故障。"}]}], "sourceIds": ["SRC-052"], "sourceParts": [{"id": "SRC-052", "index": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "容量规划和负载均衡"}]}], "sourceIds": ["SRC-053"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论容量规划和负载均衡，指出增加副本可提高读性能，但可能降低可用性，因法定仲裁过程所需副本数增加。"}]}], "sourceIds": ["SRC-054"], "sourceParts": [{"id": "SRC-054", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明，将多个副本放在同一数据中心可能减少可用性，因该中心故障导致所有副本不可用。"}]}], "sourceIds": ["SRC-054"], "sourceParts": [{"id": "SRC-054", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过负载均衡机制，避免负载集中导致连锁故障。"}]}], "sourceIds": ["SRC-054"], "sourceParts": [{"id": "SRC-054", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调，需考虑客户端分布，将副本放置在离客户端近的地方，优化系统性能。"}]}], "sourceIds": ["SRC-054"], "sourceParts": [{"id": "SRC-054", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "仲裁组的组成"}]}], "sourceIds": ["SRC-055"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节探讨仲裁组的组成，指出地理位置分布影响性能。"}]}], "sourceIds": ["SRC-056"], "sourceParts": [{"id": "SRC-056", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者建议将副本均匀分布，使RTT基本类似，形成固定系统性能。"}]}], "sourceIds": ["SRC-056"], "sourceParts": [{"id": "SRC-056", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "然而，跨大陆部署存在延迟差异，如跨大西洋链路较慢。"}]}], "sourceIds": ["SRC-056"], "sourceParts": [{"id": "SRC-056", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过重叠仲裁组，如5副本中2个在美国中部，1个在东海岸，2个在欧洲，可保证北美洲副本完成共识，无需等待欧洲回复。"}]}], "sourceIds": ["SRC-056"], "sourceParts": [{"id": "SRC-056", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "东海岸副本作为关键轴，连接两个组，优化性能。"}]}], "sourceIds": ["SRC-056"], "sourceParts": [{"id": "SRC-056", "index": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "每个共识组中的成员数量，以及每个成员的状态（健康或不健"}]}], "sourceIds": ["SRC-057"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节详细讨论监控每个共识组成员数量和状态，指出进程可能运行但无法工作。"}]}], "sourceIds": ["SRC-058"], "sourceParts": [{"id": "SRC-058", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调，需监控成员是否健康，以及时发现硬件或软件故障。"}]}], "sourceIds": ["SRC-058"], "sourceParts": [{"id": "SRC-058", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过监控成员状态，系统管理员可判断系统是否正常运行，并在出现故障时采取相应措施。"}]}], "sourceIds": ["SRC-058"], "sourceParts": [{"id": "SRC-058", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该监控指标是确保分布式共识系统可靠性的基础，帮助识别潜在问题。"}]}], "sourceIds": ["SRC-058"], "sourceParts": [{"id": "SRC-058", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "对分布式共识系统的监控"}]}], "sourceIds": ["SRC-059"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节介绍对分布式共识系统的监控，指出需关注成员数量、状态、落后副本、领头人角色及变化次数。"}]}], "sourceIds": ["SRC-060"], "sourceParts": [{"id": "SRC-060", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明，监控共识交易记录数字、提议数量和接受数量，可判断系统运行状态。"}]}], "sourceIds": ["SRC-060"], "sourceParts": [{"id": "SRC-060", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "同时监控吞吐量、延迟、网络延迟和磁盘写入时间，帮助故障排查。"}]}], "sourceIds": ["SRC-060"], "sourceParts": [{"id": "SRC-060", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过监控这些指标，系统管理员可及时发现并处理故障，确保系统高可用性。"}]}], "sourceIds": ["SRC-060"], "sourceParts": [{"id": "SRC-060", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "始终落后的副本"}]}], "sourceIds": ["SRC-061"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节探讨监控始终落后的副本，指出健康成员可能处于不同状态，如启动恢复、始终落后或完全参与。"}]}], "sourceIds": ["SRC-062"], "sourceParts": [{"id": "SRC-062", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明，监控落后副本有助于判断系统同步状态，及时发现同步问题。"}]}], "sourceIds": ["SRC-062"], "sourceParts": [{"id": "SRC-062", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过监控副本状态，系统管理员可评估系统性能，并在必要时调整副本配置，确保数据一致性和系统可靠性，避免落后副本影响整体性能。"}]}], "sourceIds": ["SRC-062"], "sourceParts": [{"id": "SRC-062", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "领头人角色是否存在"}]}], "sourceIds": ["SRC-063"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论监控领头人角色是否存在，指出基于复合Paxos的系统需确保领头人存在，否则系统不可用。"}]}], "sourceIds": ["SRC-064"], "sourceParts": [{"id": "SRC-064", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调，通过监控领头人角色，系统管理员可及时发现领头人故障，并触发重新选举。"}]}], "sourceIds": ["SRC-064"], "sourceParts": [{"id": "SRC-064", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该监控指标是确保系统连续运行的关键，帮助识别网络或软件问题导致的领头人缺失，保障系统高可用性。"}]}], "sourceIds": ["SRC-064"], "sourceParts": [{"id": "SRC-064", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "领头人角色变化的次数"}]}], "sourceIds": ["SRC-065"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析监控领头人角色变化次数，指出快速变化影响系统性能，可能由网络连接问题或软件Bug引起。"}]}], "sourceIds": ["SRC-066"], "sourceParts": [{"id": "SRC-066", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明，通过监控视图编号降低或角色变化频率，系统管理员可识别领头人抖动或严重Bug。"}]}], "sourceIds": ["SRC-066"], "sourceParts": [{"id": "SRC-066", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该监控指标有助于评估系统稳定性，及时发现并处理网络或软件问题，确保系统正常运行，避免性能下降。"}]}], "sourceIds": ["SRC-066"], "sourceParts": [{"id": "SRC-066", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "共识交易记录数字"}]}], "sourceIds": ["SRC-067"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论监控共识交易记录数字，指出系统管理员需知道系统是否正在处理交易。"}]}], "sourceIds": ["SRC-068"], "sourceParts": [{"id": "SRC-068", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明，递增的共识交易数字代表系统进度，健康时随时间增长。"}]}], "sourceIds": ["SRC-068"], "sourceParts": [{"id": "SRC-068", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过监控该数字，系统管理员可判断系统是否正常运行，及时发现停滞或异常。"}]}], "sourceIds": ["SRC-068"], "sourceParts": [{"id": "SRC-068", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该指标是评估系统活跃度和处理能力的关键，帮助识别潜在故障，确保系统高效运行。"}]}], "sourceIds": ["SRC-068"], "sourceParts": [{"id": "SRC-068", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "系统中的提议数量，以及系统中被接受的提议数量"}]}], "sourceIds": ["SRC-069"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节探讨监控系统中的提议数量和被接受数量，指出这些数字显示系统是否正常运行。"}]}], "sourceIds": ["SRC-070"], "sourceParts": [{"id": "SRC-070", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者说明，通过监控提议和接受数量，系统管理员可评估系统处理能力和效率。"}]}], "sourceIds": ["SRC-070"], "sourceParts": [{"id": "SRC-070", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该监控指标有助于识别系统瓶颈或故障，如提议堆积或接受率低，帮助及时调整系统配置，确保系统高可用性和性能，及时发现并处理潜在问题。"}]}], "sourceIds": ["SRC-070"], "sourceParts": [{"id": "SRC-070", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "吞吐量和延迟"}]}], "sourceIds": ["SRC-071"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论监控吞吐量和延迟，指出这些特性虽不特定于共识系统，但需被管理员理解。"}]}], "sourceIds": ["SRC-072"], "sourceParts": [{"id": "SRC-072", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调，通过监控提议接收时间延迟分布、网络延迟、磁盘写入时间和每秒处理字节数，系统管理员可全面了解系统性能。"}]}], "sourceIds": ["SRC-072"], "sourceParts": [{"id": "SRC-072", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该监控指标帮助识别性能瓶颈，优化系统配置，确保高可用性和低延迟，及时发现并处理潜在问题，提升系统整体效率。"}]}], "sourceIds": ["SRC-072"], "sourceParts": [{"id": "SRC-072", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "小结"}]}], "sourceIds": ["SRC-073"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节总结本章内容，回顾分布式共识问题的定义、系统架构及性能特点。"}]}], "sourceIds": ["SRC-074"], "sourceParts": [{"id": "SRC-074", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调，分布式共识系统可用于解决领头人选举、关键共享状态和分布式锁等问题，使用心跳机制等非共识方案可能导致严重问题。"}]}], "sourceIds": ["SRC-074"], "sourceParts": [{"id": "SRC-074", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过本章学习，读者应掌握分布式共识系统的应用场景和重要性，避免使用不可靠的协调机制，确保系统高可靠性和一致性。"}]}], "sourceIds": ["SRC-074"], "sourceParts": [{"id": "SRC-074", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "二、主题讲解：分布式共识的核心机制与性能优化"}]}], "sourceIds": ["SRC-075"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "共识系统的基础架构与一致性保障"}]}], "sourceIds": ["SRC-076"]}, {"lines": [{"indent": 0, "chunks": [{"t": "分布式共识系统旨在解决网络不稳定环境下多节点状态一致性问题。"}]}], "sourceIds": ["SRC-077"], "sourceParts": [{"id": "SRC-077", "index": 1, "total": 6, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "核心机制如Paxos协议，通过提案序列和多数派同意确保数据顺序性和一致性。"}]}], "sourceIds": ["SRC-077"], "sourceParts": [{"id": "SRC-077", "index": 2, "total": 6, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "复合式Paxos引入强势领头人，优化消息流，减少通信轮次。"}]}], "sourceIds": ["SRC-077"], "sourceParts": [{"id": "SRC-077", "index": 3, "total": 6, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "然而，领头人更换可能导致“提议者决斗”，引发活跃死锁。因此，系统需通过随机延迟或固定领头人机制避免冲突。"}]}], "sourceIds": ["SRC-077"], "sour       .replace(/\\beta/g, "β")

    value = value.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    value = value.replace(/\^([A-Za-z0-9αβγ+\-]+)/g, "<sup>$1</sup>");
