  const RAW_SLIDES = [{"cover": true, "lines": [{"indent": 0, "chunks": [{"t": "《SRE：Google运维解密》第30章 通过嵌入SRE的方式帮助团队从运维过载中恢复 · 原书回顾与主题讲解"}]}], "sourceIds": []}, {"lines": [{"indent": 0, "chunks": [{"t": "本单元要回答：嵌入式SRE如何帮助团队从运维过载中恢复？"}]}], "sourceIds": ["SRC-001"]}, {"lines": [{"indent": 0, "chunks": [{"t": "[图示] 图30-1｜嵌入式SRE怎样帮助团队从运维过载恢复"}]}], "sourceIds": ["SRC-002"]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "一、原书回顾：作者怎样展开"}]}], "sourceIds": ["SRC-003"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "第一阶段：了解服务，了解上下文"}]}], "sourceIds": ["SRC-004"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本章开篇指出，长期处于Ops模式会导致团队疲劳且服务可靠性下降。"}]}], "sourceIds": ["SRC-005"], "sourceParts": [{"id": "SRC-005", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "嵌入式SRE的核心任务不是清理工单，而是改善团队工作方式。"}]}], "sourceIds": ["SRC-005"], "sourceParts": [{"id": "SRC-005", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过观察日常流程，SRE能发现成员视角盲区，引导团队建立减少工单的健康习惯，而非单纯增加人手。"}]}], "sourceIds": ["SRC-005"], "sourceParts": [{"id": "SRC-005", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "Ops模式与非线性扩展"}]}], "sourceIds": ["SRC-006"]}, {"lines": [{"indent": 0, "chunks": [{"t": "Ops模式通过增加管理员应对规模扩大，而SRE通过消除瓶颈实现非线性扩展。SRE需判断服务规模："}]}], "sourceIds": ["SRC-007"], "sourceParts": [{"id": "SRC-007", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "若商业价值高但规模小，应聚焦改进工作方式；若处于增长初期，则需为爆发式增长做准备。"}]}], "sourceIds": ["SRC-007"], "sourceParts": [{"id": "SRC-007", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "可扩展性判断直接影响后续策略制定。"}]}], "sourceIds": ["SRC-007"], "sourceParts": [{"id": "SRC-007", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "确定最大的压力来源"}]}], "sourceIds": ["SRC-008"]}, {"lines": [{"indent": 0, "chunks": [{"t": "团队陷入Ops模式常因过度关注快速解决紧急事件而非减少其数量。"}]}], "sourceIds": ["SRC-009"], "sourceParts": [{"id": "SRC-009", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE需根据历史中断对团队压力的程度对问题进行排序。"}]}], "sourceIds": ["SRC-009"], "sourceParts": [{"id": "SRC-009", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "需注意，由于视角局限，团队可能忽视某些实际负担沉重的小问题，SRE需客观识别这些被低估的压力源。"}]}], "sourceIds": ["SRC-009"], "sourceParts": [{"id": "SRC-009", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "找到导火索"}]}], "sourceIds": ["SRC-010"]}, {"lines": [{"indent": 0, "chunks": [{"t": "确定最大问题后，需关注即将发生的紧急情况。导火索包括："}]}], "sourceIds": ["SRC-011"], "sourceParts": [{"id": "SRC-011", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "知识代沟导致的依赖、SRE直接开发功能被忽视、对“未来解决方案”的过度依赖、被视而不见的警报、缺乏SLI/SLO/SLA且有投诉的服务、仅靠增加服务器解决容量问题的服务、仅回滚不究根源的事后总结，以及SRE对关键组件缺乏理解的状况。"}]}], "sourceIds": ["SRC-011"], "sourceParts": [{"id": "SRC-011", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "知识代沟"}]}], "sourceIds": ["SRC-012"]}, {"lines": [{"indent": 0, "chunks": [{"t": "指出大型团队过度专业化导致成员缺乏广泛知识，在on-call时因不懂关键系统而需他人帮助，同时其他成员也缺乏该专家的知识，形成恶性循环。"}]}], "sourceIds": ["SRC-013"], "sourceParts": [{"id": "SRC-013", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者以此说明专业化带来的沟通壁垒是运维压力的来源之一。"}]}], "sourceIds": ["SRC-013"], "sourceParts": [{"id": "SRC-013", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "SRE直接参与开发的功能变得越来越重要"}]}], "sourceIds": ["SRC-014"]}, {"lines": [{"indent": 0, "chunks": [{"t": "指出SRE直接参与开发的功能常被忽视，因其规模小且曾有SRE支持。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者强调这些功能虽不起眼，但缺乏同等关注会导致可靠性隐患，提醒团队需给予其与新功能同等重视，以预防潜在故障。"}]}], "sourceIds": ["SRC-015"], "sourceParts": [{"id": "SRC-015", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "对“未来的一件大事”的过度依赖"}]}], "sourceIds": ["SRC-016"]}, {"lines": [{"indent": 0, "chunks": [{"t": "描述团队成员常忽略当前问题，坚信即将上线的新方案能解决一切，从而认为临时措施无意义。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者借此揭示这种心态导致问题被长期搁置，阻碍了即时改进，是造成运维负担的重要心理因素。"}]}], "sourceIds": ["SRC-017"], "sourceParts": [{"id": "SRC-017", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "开发团队和SRE都视而不见的警报"}]}], "sourceIds": ["SRC-018"]}, {"lines": [{"indent": 0, "chunks": [{"t": "指出某些警报常被定性为暂时性而被忽视，实则分散团队精力。"}]}], "sourceIds": ["SRC-019"], "sourceParts": [{"id": "SRC-019", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者建议要么彻底调查此类警报，要么修改规则使其不再出现，强调消除干扰源对提升运维效率至关重要，避免无效警报消耗团队注意力。"}]}], "sourceIds": ["SRC-019"], "sourceParts": [{"id": "SRC-019", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "第二阶段：分享背景知识"}]}], "sourceIds": ["SRC-020"]}, {"lines": [{"indent": 0, "chunks": [{"t": "了解痛点后，需通过建立最佳实践改善状况。重点在于书写好的事后总结作为示范。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "不健康的团队视事后总结为惩罚，SRE应避免评论过往错误，而是亲自负责下一次事故的事后总结，展示如何通过永久性修复根源问题来减少长期影响，打破“坏苹果”理论误区。"}]}], "sourceIds": ["SRC-021"], "sourceParts": [{"id": "SRC-021", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "书写一个好的事后总结作为示范"}]}], "sourceIds": ["SRC-022"]}, {"lines": [{"indent": 0, "chunks": [{"t": "事后总结体现团队集体推理能力。SRE应亲自撰写示范文档，解释如何从根源受益，而非指责个人。"}]}], "sourceIds": ["SRC-023"], "sourceParts": [{"id": "SRC-023", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "面对“为什么是我”的防御心理，需指出复杂系统中错误不可避免，引导成员记录决策时的信息，发现系统误导之处，从而建立对事不对人的文化。"}]}], "sourceIds": ["SRC-023"], "sourceParts": [{"id": "SRC-023", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "将紧急事件按类型排序"}]}], "sourceIds": ["SRC-024"]}, {"lines": [{"indent": 0, "chunks": [{"t": "将紧急事件分为两类：不应存在的琐事和日常工作中产生压力的事件。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE需将列表交给团队，清晰解释哪些应自动化，哪些是必须承担的运维工作。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过分类，帮助团队区分可消除的负担与必须管理的复杂性，为后续自动化奠定基础。"}]}], "sourceIds": ["SRC-025"], "sourceParts": [{"id": "SRC-025", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "第三阶段：主导改变"}]}], "sourceIds": ["SRC-026"]}, {"lines": [{"indent": 0, "chunks": [{"t": "团队健康是持续过程，需建立良好SRE心理模型。SRE应关注创建正确的初始条件，传授简单原则。"}]}], "sourceIds": ["SRC-027"], "sourceParts": [{"id": "SRC-027", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "避免个人英雄主义，通过帮助团队成员完成有价值工作，解释其如何永久解决问题，并亲自评审代码和文档，逐步引导团队接受改变。"}]}], "sourceIds": ["SRC-027"], "sourceParts": [{"id": "SRC-027", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "从基础开始"}]}], "sourceIds": ["SRC-028"]}, {"lines": [{"indent": 0, "chunks": [{"t": "若团队无法区分SRE与Ops模型，需从基础原则开始。"}]}], "sourceIds": ["SRC-029"], "sourceParts": [{"id": "SRC-029", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "首要目标是制定服务等级目标（SLO），它为事故后果提供量化依据，也是流程改变重要性的基础。"}]}], "sourceIds": ["SRC-029"], "sourceParts": [{"id": "SRC-029", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "若无SLO，其他建议无效。需召集技术负责人和管理层讨论确定SLO，达成共识。"}]}], "sourceIds": ["SRC-029"], "sourceParts": [{"id": "SRC-029", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "获取团队成员的帮助"}]}], "sourceIds": ["SRC-030"]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE需克制直接修复问题的冲动，避免宣扬“改变是别人的事”。"}]}], "sourceIds": ["SRC-031"], "sourceParts": [{"id": "SRC-031", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "应找到可由成员完成的价值工作，解释其如何永久解决问题，并亲自作为评审者。"}]}], "sourceIds": ["SRC-031"], "sourceParts": [{"id": "SRC-031", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "重复此过程两三次，将其他问题写入文档鼓励成员提供意见，促进信息共享和文档编写。"}]}], "sourceIds": ["SRC-031"], "sourceParts": [{"id": "SRC-031", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "解释你的逻辑推理过程"}]}], "sourceIds": ["SRC-032"]}, {"lines": [{"indent": 0, "chunks": [{"t": "随着团队接受改变，SRE需解释日常决策背后的逻辑。"}]}], "sourceIds": ["SRC-033"], "sourceParts": [{"id": "SRC-033", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "即使无人要求，也应主动解释，引用基础理念以建立心理模型。"}]}], "sourceIds": ["SRC-033"], "sourceParts": [{"id": "SRC-033", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "提供充分解释的例子，如基于错误预算或SLO要求说明反对发布的原因，避免模糊理由，防止团队形成懒惰风气。"}]}], "sourceIds": ["SRC-033"], "sourceParts": [{"id": "SRC-033", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "提出引导性问题"}]}], "sourceIds": ["SRC-034"]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE应 Ids": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "同时，需识别最大压力来源，包括知识代沟、被忽视的警报、缺乏SLI/SLO/SLA的服务以及仅靠增加服务器解决容量问题的做法。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过排序历史中断对团队的压力，SRE能发现被团队低估的问题，从而精准定位改进切入点。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "第二阶段：建立最佳实践与知识共享"}]}], "sourceIds": ["SRC-041"]}, {"lines": [{"indent": 0, "chunks": [{"t": "在识别痛点后，SRE需通过建立最佳实践来改善团队动态。核心示范是书写高质量的事后总结。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 1, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE应避免评论过往错误，而是亲自撰写下一次事故的事后总结，展示如何通过永久性修复根源问题来减少长期影响。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这有助于打破“坏苹果”理论误区，建立对事不对人的文化。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "此外，SRE需将紧急事件分类为不应存在的琐事和日常压力事件，明确哪些应自动化，哪些是必须承担的运维工作，从而为团队提供清晰的行动指南和知识共享框架。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 4, "total": 4, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "第三阶段：主导改变与逻辑解释"}]}], "sourceIds": ["SRC-043"]}, {"lines": [{"indent": 0, "chunks": [{"t": "SRE需通过主导改变来建立健康的SRE心理模型。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "首先，从基础开始，制定服务等级目标（SLO），为事故后果提供量化依据，这是流程改变的基础。"}]}], "sourceIds": ["SRC-044"], "sourceParts": [{"id": "SRC-044", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"ind   const stage = document.getElementById("stage");

  function escapeHtml(value) {

      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")

  function latexBody(raw) {

      .replace(/\\cdot/g, "·")

      .replace(/\\propto/g, "∝")
      .replace(/\\alpha/g, "α")
      .replace(/\\beta/g, "β")

    value = escapeHtml(value);
    value = value.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    value = value.replace(/\^([A-Za-z0-9αβγ+\-]+)/g, "<sup>$1</sup>");
    value = value.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
    value = value.replace(/_([A-Za-z0-9]+)/g, "<sub>$1</sub>");

    } else if (["ArrowLeft", "ArrowUp", "k", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(slides.length - 1);
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      fullscreen();
    }
  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
