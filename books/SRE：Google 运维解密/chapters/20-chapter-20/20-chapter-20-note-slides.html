  const RAW_SLIDES = [{"cover": true, "lines": [{"indent": 0, "chunks": [{"t": "《SRE：Google运维解密》第20章 数据中心内部的负载均衡系统 · 原书回顾与主题讲解"}]}], "sourceIds": []}, {"lines": [{"indent": 0, "chunks": [{"t": "本单元要回答：怎样理解并使用“数据中心内部的负载均衡系统”，以及它在什么条件下不适用。"}]}], "sourceIds": ["SRC-001"]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "一、原书回顾：作者怎样展开"}]}], "sourceIds": ["SRC-002"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "理想情况"}]}], "sourceIds": ["SRC-003"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节确立了负载均衡的目标：让所有后端任务消耗相同的CPU资源，避免资源浪费。"}]}], "sourceIds": ["SRC-004"], "sourceParts": [{"id": "SRC-004", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者通过对比两种负载分布场景，指出糟糕的策略会导致大量CPU闲置。"}]}], "sourceIds": ["SRC-004"], "sourceParts": [{"id": "SRC-004", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这为后续讨论如何识别异常任务以实现均匀负载奠定了理论基础。"}]}], "sourceIds": ["SRC-004"], "sourceParts": [{"id": "SRC-004", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "识别异常任务：流速控制和跛脚鸭任务"}]}], "sourceIds": ["SRC-005"]}, {"lines": [{"indent": 0, "chunks": [{"t": "在路由请求前，必须先识别并避开不健康的后端。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节介绍了通过跟踪活跃请求数进行流速控制的简单方法，但指出其无法区分真正过载与暂时慢速。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "因此，引入了更可靠的“跛脚鸭”状态机制来优雅地处理任务下线。"}]}], "sourceIds": ["SRC-006"], "sourceParts": [{"id": "SRC-006", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "异常任务的简单应对办法：流速控制"}]}], "sourceIds": ["SRC-007"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节详细分析了基于活跃请求数的流速控制机制。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "虽然简单，但它只能应对极端过载，且容易因长连接请求导致误判。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出，根本问题在于无法区分任务是真的不健康还是仅仅回复缓慢，从而引出更精细的状态管理需求。"}]}], "sourceIds": ["SRC-008"], "sourceParts": [{"id": "SRC-008", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "健康"}]}], "sourceIds": ["SRC-009"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节定义了后端任务的“健康”状态，即初始化成功且正在处理请求。"}]}], "sourceIds": ["SRC-010"], "sourceParts": [{"id": "SRC-010", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这是负载均衡的基础前提，确保客户端只将请求发送给具备服务能力的后端，排除那些尚未就绪或已停止的任务。"}]}], "sourceIds": ["SRC-010"], "sourceParts": [{"id": "SRC-010", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "拒绝连接"}]}], "sourceIds": ["SRC-011"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节定义了“拒绝连接”状态，通常由任务启动、停止或异常引起。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种状态表明后端无响应，客户端应避免向其发送请求。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这是识别异常任务的一种基本表现形式，与跛脚鸭状态形成对比。"}]}], "sourceIds": ["SRC-012"], "sourceParts": [{"id": "SRC-012", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "跛脚鸭状态"}]}], "sourceIds": ["SRC-013"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节重点介绍“跛脚鸭”状态，即后端仍可服务但要求客户端停止发送新请求。"}]}], "sourceIds": ["SRC-014"], "sourceParts": [{"id": "SRC-014", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过SIGTERM信号和UDP健康检查，该状态能快速广播给所有客户端，实现无缝停机，避免中断正在处理的请求，提升系统稳定性。"}]}], "sourceIds": ["SRC-014"], "sourceParts": [{"id": "SRC-014", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "利用划分子集限制连接池大小"}]}], "sourceIds": ["SRC-015"]}, {"lines": [{"indent": 0, "chunks": [{"t": "除了健康管理，负载均衡还需限制客户端连接的后端数量，即子集划分。这能避免连接过多导致的资源消耗。"}]}], "sourceIds": ["SRC-016"], "sourceParts": [{"id": "SRC-016", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论了子集大小的选择依据，如客户端数量比例和突发流量需求，旨在平衡资源利用率与连接维护成本。"}]}], "sourceIds": ["SRC-016"], "sourceParts": [{"id": "SRC-016", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "子集选择算法一：随机选择"}]}], "sourceIds": ["SRC-017"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析了最简单的随机子集选择算法。虽然实现简单且能处理重启，但实际负载分布极不均匀。"}]}], "sourceIds": ["SRC-018"], "sourceParts": [{"id": "SRC-018", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "通过Google的模拟数据展示，随机算法导致负载最高与最低后端差异巨大，证明其在大规模部署中效果不佳。"}]}], "sourceIds": ["SRC-018"], "sourceParts": [{"id": "SRC-018", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "负载均衡策略"}]}], "sourceIds": ["SRC-019"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节从子集选择过渡到具体的负载均衡策略，即客户端如何在子集中选择具体后端。"}]}], "sourceIds": ["SRC-020"], "sourceParts": [{"id": "SRC-020", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "策略分为不考虑后端状态的简单算法（如轮询）和基于状态的算法（如最小负载轮询）。"}]}], "sourceIds": ["SRC-020"], "sourceParts": [{"id": "SRC-020", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "重点在于解决分布式决策中的实时性与信息滞后问题。"}]}], "sourceIds": ["SRC-020"], "sourceParts": [{"id": "SRC-020", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "简单轮询算法"}]}], "sourceIds": ["SRC-021"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节介绍简单轮询策略，即按顺序将请求发送给子集中的后端。尽管广泛使用，但其负载效果往往很差。"}]}], "sourceIds": ["SRC-022"], "sourceParts": [{"id": "SRC-022", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "作者指出，由于请求处理成本、物理服务器差异及不可预知因素，轮询可能导致负载最高的任务消耗两倍的CPU资源。"}]}], "sourceIds": ["SRC-022"], "sourceParts": [{"id": "SRC-022", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "子集过小"}]}], "sourceIds": ["SRC-023"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析简单轮询效果差的原因之一：子集过小。"}]}], "sourceIds": ["SRC-024"], "sourceParts": [{"id": "SRC-024", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "当客户端数量少或请求速率不同时，部分后端可能接收过多请求。"}]}], "sourceIds": ["SRC-024"], "sourceParts": [{"id": "SRC-024", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这导致负载分布不均，因为轮询无法感知不同客户端的实际发送速率差异，从而造成后端负载失衡。"}]}], "sourceIds": ["SRC-024"], "sourceParts": [{"id": "SRC-024", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "请求处理成本不同"}]}], "sourceIds": ["SRC-025"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节指出请求处理成本的巨大差异是轮询失效的另一原因。某些请求可能消耗其他请求上千倍的CPU资源。"}]}], "sourceIds": ["SRC-026"], "sourceParts": [{"id": "SRC-026", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在无法预知成本的情况下，轮询会将高成本请求随机分配，导致特定后端过载，而其他后端闲置，破坏负载均衡。"}]}], "sourceIds": ["SRC-026"], "sourceParts": [{"id": "SRC-026", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "物理服务器的差异"}]}], "sourceIds": ["SRC-027"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节讨论物理服务器性能差异对负载均衡的影响。同一数据中心内服务器性能不同，导致相同请求负载不同。"}]}], "sourceIds": ["SRC-028"], "sourceParts": [{"id": "SRC-028", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "Google通过引入虚拟CPU单位（GCU）来建模不同性能，试图在调度时考虑硬件差异，以优化资源分配。"}]}], "sourceIds": ["SRC-028"], "sourceParts": [{"id": "SRC-028", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "无法预知的性能因素"}]}], "sourceIds": ["SRC-029"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节探讨无法预知的性能因素，如“坏邻居”效应和任务重启。"}]}], "sourceIds": ["SRC-030"], "sourceParts": [{"id": "SRC-030", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "其他进程竞争共享资源或重启时的性能波动，会导致后端性能剧烈变化。"}]}], "sourceIds": ["SRC-030"], "sourceParts": [{"id": "SRC-030", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这些因素难以通过统计学衡量，使得简单的负载均衡策略难以应对实际性能波动。"}]}], "sourceIds": ["SRC-030"], "sourceParts": [{"id": "SRC-030", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "坏邻居"}]}], "sourceIds": ["SRC-031"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节具体解释“坏邻居”效应，即同一物理机上的其他无关进程竞争内存缓存或带宽，导致性能波动达20%。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种竞争使得后端性能不稳定，简单的负载均衡策略无法感知这种底层资源竞争，从而导致负载分配不均。"}]}], "sourceIds": ["SRC-032"], "sourceParts": [{"id": "SRC-032", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "任务重启"}]}], "sourceIds": ["SRC-033"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节分析任务重启期间的性能问题，特别是Java平台需要动态优化代码。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "重启初期性能较差，Google通过让任务进入跛脚鸭状态并预热来解决。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这强调了负载均衡策略需考虑任务生命周期中的性能变化，避免在重启期分配过多负载。"}]}], "sourceIds": ["SRC-034"], "sourceParts": [{"id": "SRC-034", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "最闲轮询策略"}]}], "sourceIds": ["SRC-035"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节介绍最闲轮询策略，即跟踪活跃请求数并在最少负载的任务中轮询。该策略旨在将负载从忙碌任务迁走。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "然而，它存在“地漏效应”风险，即不健康任务可能因快速返回错误而被误认为可用，导致负载进一步集中。"}]}], "sourceIds": ["SRC-036"], "sourceParts": [{"id": "SRC-036", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "活跃请求的数量并不一定是后端容量的代表"}]}], "sourceIds": ["SRC-037"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节指出最闲轮询的局限：活跃请求数不代表后端容量。等待I/O的请求消耗极少CPU，导致快速后端看似负载高。"}]}], "sourceIds": ["SRC-038"], "sourceParts": [{"id": "SRC-038", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "最闲轮询无法区分等待时间与处理时间，从而错误地分配负载，无法反映真实的处理能力差异。"}]}], "sourceIds": ["SRC-038"], "sourceParts": [{"id": "SRC-038", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "每个客户端的活跃请求不包括其他客户端发往同一个后端的请求"}]}], "sourceIds": ["SRC-039"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节指出最闲轮询的另一缺陷：客户端仅能看到自身发往后端的请求。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "它无法感知其他客户端对该后端的负载，导致视图片面。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种局部视角使得全局负载均衡失效，造成最忙任务比最闲任务消耗两倍的CPU资源。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "加权轮询策略"}]}], "sourceIds": ["SRC-041"]}, {"lines": [{"indent": 0, "chunks": [{"t": "本节介绍加权轮询策略，通过后端反馈的能力值（如CPU利用率、错误率）调节负载分配。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 1, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "该策略结合了后端状态信息，显著降低了最高与最低负载任务的差距。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 2, "total": 3, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "Google的实践证明，加权轮询能有效应对复杂负载场景，提升整体效率。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 3, "total": 3, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 2, "lines": [{"indent": 0, "chunks": [{"t": "二、主题讲解：数据中心负载均衡的核心挑战与演进"}]}], "sourceIds": ["SRC-043"]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "负载均衡的理想目标与现实偏差"}]}], "sourceIds": ["SRC-044"]}, {"lines": [{"indent": 0, "chunks": [{"t": "负载均衡的核心目标是实现后端任务间CPU消耗的绝对均匀，避免资源浪费。"}]}], "sourceIds": ["SRC-045"], "sourceParts": [{"id": "SRC-045", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "然而，现实系统中负载分布往往极不均匀。"}]}], "sourceIds": ["SRC-045"], "sourceParts": [{"id": "SRC-045", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "例如，糟糕的策略可能导致最忙任务消耗的资源远超平均，而其他任务闲置。"}]}], "sourceIds": ["SRC-045"], "sourceParts": [{"id": "SRC-045", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "这种偏差不仅降低了数据中心的整体容量利用率，还可能导致服务过载。"}]}], "sourceIds": ["SRC-045"], "sourceParts": [{"id": "SRC-045", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "理解这一理想与现实的差距，是设计有效负载均衡算法的前提。"}]}], "sourceIds": ["SRC-045"], "sourceParts": [{"id": "SRC-045", "index": 5, "total": 5, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent":   const stage = document.getElementById("stage");

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function latexBody(raw) {
    let value = raw
      .replace(/\\cdot/g, "·")
      .replace(/\\times/g, "×")
      .replace(/\\propto/g, "∝")
      .replace(/\\alpha/g, "α")
      .replace(/\\beta/g, "β")
      .replace(/\\gamma/g, "γ");
    value = escapeHtml(value);
    value = value.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    value = value.replace(/\^([A-Za-z0-9αβγ+\-]+)/g, "<sup>$1</sup>");
    value = value.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
    value = value.replace(/_([A-Za-z0-9]+)/g, "<sub>$1</sub>");
    return value;
  }

  function renderPlainAware(text) {
    const escaped = escapeHtml(text);
    return escaped.replace(
      /([\u3400-\u9fff]{3}(?:[，。！？；：、…—」』）》】]+)?)(\s*)$/u,
      '<span class="keep-cjk-tail">$1</span>$2'
    );
  }

  function renderMathAware(text) {
    const exactDisplay = text.trim().match(/^\$\$([\s\S]+)\$\$$/);
    const exactInline = text.trim().match(/^\$(?![\d?])([^$\n]+)\$$/);
    if (exactDisplay) return '<span class="math math-display">' + latexBody(exactDisplay[1]) + "</span>";
    if (exactInline) return '<span class="math math-display">' + latexBody(exactInline[1]) + "</span>";

    const pattern = /\$\$([\s\S]+?)\$\$|\$(?![\d?])([^$\n]+?)\$/g;
    let result = "";
    let cursor = 0;
    for (const match of text.matchAll(pattern)) {
      const at = match.index ?? 0;
      result += renderPlainAware(text.slice(cursor, at));
      result += '<span class="math">' + latexBody(match[1] ?? match[2]) + "</span>";
      cursor = at + match[0].length;
    }
    result += renderPlainAware(text.slice(cursor));
    return result;
  }

  const graphemeSegmenter = typeof Intl.Segmenter === "function"

  function normalizeSlides(raw) {

      element.dataset.density = density;
      element.dataset.layout = layout;
      if (semanticAtom) element.dataset.semanticAtom = "true";
      if (semanticAtom || (lineCount === 1 && ["single", "short", "medium"].includes(len))) element.dataset.takahashi = "true";

      const lines = document.createElement("div");
      lines.className = "lines fit-box";
      slide.lines.forEach((line, lineIndex) => {
        const node = document.createElement("div");
        node.className = "line";
        node.dataset.indent = String(line.indent || 0);
        node.dataset.lineIndex = String(lineIndex + 1);
        node.dataset.weight = String(Math.round(weights[lineIndex]));
        node.innerHTML = (line.chunks || []).map((chunk) => {
          const rendered = renderMathAware(chunk.t);
          return chunk.hl ? '<span class="hl">' + rendered + "</span>" : rendered;
        }).join("");
        lines.appendChild(node);
      });
      element.appendChild(lines);
      if (lines.querySelector(".math-display")) element.dataset.math = "display";
    }

    stage.appendChild(element);
  });

  const slides = Array.from(stage.querySelectorAll(".slide"));
  let index = 0;

  function fitSlide(slide) {
    const box = slide.querySelector(".fit-box");
    if (!box) return { scale: 1, fits: true };
    box.style.transform = "none";
    const style = getComputedStyle(slide);
    const availableWidth = Math.max(1, slide.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
    const availableHeight = Math.max(1, slide.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
    const contentWidth = Math.max(1, box.scrollWidth);
    const contentHeight = Math.max(1, box.scrollHeight);
    const scale = Math.min(1, availableWidth / contentWidth, availableHeight / contentHeight) * .975;
    box.style.transform = "scale(" + scale.toFixed(5) + ")";
    slide.dataset.fitScale = scale.toFixed(5);

    const content = box.getBoundingClientRect();
    const bounds = slide.getBoundingClientRect();
    const safeLeft = bounds.left + parseFloat(style.paddingLeft) - 1;
    const safeRight = bounds.right - parseFloat(style.paddingRight) + 1;
    const safeTop = bounds.top + parseFloat(style.paddingTop) - 1;
    const safeBottom = bounds.bottom - parseFloat(style.paddingBottom) + 1;
    const fits = content.left >= safeLeft && content.right <= safeRight && content.top >= safeTop && content.bottom <= safeBottom;
    slide.dataset.fits = String(fits);
    return { scale, fits };
  }

  function show(nextIndex) {
    nextIndex = Math.max(0, Math.min(slides.length - 1, nextIndex));
    slides[index]?.classList.remove("active");
    index = nextIndex;
    slides[index]?.classList.add("active");
    pager.textContent = String(index + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
    metaFooter.hidden = index !== 0;
    body.dataset.current = slides[index]?.dataset.emphasis === "true" || slides[index]?.dataset.cover === "true" ? "emphasis" : "theme";
    requestAnimationFrame(() => fitSlide(slides[index]));
  }

  function fullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  function isEditableTarget(target) {
    return target instanceof Element && Boolean(target.closest('input, textarea, select, [contenteditable="true"]'));
  }

  document.addEventListener("keydown", (event) => {
    if (isEditableTarget(event.target)) return;
    if (["ArrowRight", "ArrowDown", " ", "Enter", "j", "PageDown"].includes(event.key)) {
      event.preventDefault();
      show(index + 1);
    } else if (["ArrowLeft", "ArrowUp", "k", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      show(0);
    } else if (event.key === "End") {
      event.preventDefault();
      show(slides.length - 1);
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      fullscreen();
    }
  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
