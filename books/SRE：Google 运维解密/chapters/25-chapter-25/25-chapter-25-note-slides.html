ceIds": ["SRC-039"], "sourceParts": [{"id": "SRC-039", "index": 2, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "在数据量突然激增导致部分任务超时，且集群资源紧张时，哪种架构更能避免“惊群效应”和“摩尔负载模式”带来的系统崩溃风险？"}]}], "sourceIds": ["SRC-039"], "sourceParts": [{"id": "SRC-039", "index": 3, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "并说明理由。"}]}], "sourceIds": ["SRC-039"], "sourceParts": [{"id": "SRC-039", "index": 4, "total": 4, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "问题：在数据量激增且资源紧张的场景下，对比周期性流水线和Workflow架构，哪种更能避免系统崩溃？"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 1, "total": 2, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "请结合惊群效应和正确性保障机制说明理由。"}]}], "sourceIds": ["SRC-040"], "sourceParts": [{"id": "SRC-040", "index": 2, "total": 2, "joinBefore": ""}]}, {"emphasis": false, "title": true, "depth": 3, "lines": [{"indent": 0, "chunks": [{"t": "核对思路（先作答再看）"}]}], "sourceIds": ["SRC-041"]}, {"lines": [{"indent": 0, "chunks": [{"t": "Workflow架构更能避免崩溃。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 1, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "周期性流水线在数据激增时易因任务重启和并发启动引发惊群效应，且低优先级调度导致启动延迟和任务挤占，加剧资源紧张。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 2, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "Workflow通过领头人-追随者模式集中管理状态，工作进程无状态且可动态伸缩，避免了大规模并发启动。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 3, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "其租约机制和唯一文件名保障了正确性，即使部分任务失败，也不会像周期性流水线那样因无状态记录而浪费大量计算资源。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 4, "total": 5, "joinBefore": ""}]}, {"lines": [{"indent": 0, "chunks": [{"t": "此外，Workflow的持续运行特性避免了周期性任务在资源缝隙中运行的不稳定性，通过Spanner和Chubby实现全局一致性和自动灾难恢复，更能应对资源紧张和突发负载。"}]}], "sourceIds": ["SRC-042"], "sourceParts": [{"id": "SRC-042", "index": 5, "tota   const stage = document.getElementById("stage");

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function latexBody(raw) {
    let value = raw
      .replace(/\\cdot/g, "·")
      .replace(/\\times/g, "×")
      .replace(/\\propto/g, "∝")
      .replace(/\\alpha/g, "α")
      .replace(/\\beta/g, "β")
      .replace(/\\gamma/g, "γ");
    value = escapeHtml(value);
    value = value.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    value = value.replace(/\^([A-Za-z0-9αβγ+\-]+)/g, "<sup>$1</sup>");
    value = value.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
    value = value.replace(/_([A-Za-z0-9]+)/g, "<sub>$1</sub>");

  function renderMathAware(text) {

    if (exactDisplay) return '<span class="math math-display">' + latexBody(exactDisplay[1]) + "</span>";
    if (exactInline) return '<span class="math math-display">' + latexBody(exactInline[1]) + "</span>";

    const pattern = /\$\$([\s\S]+?)\$\$|\$(?![\d?])([^$\n]+?)\$/g;
    let result = "";
    let cursor = 0;
    for (const match of text.matchAll(pattern)) {

  });

  let touchX = null;
  document.addEventListener("touchstart", (event) => {
    touchX = event.touches[0]?.clientX ?? null;
  }, { passive: true });
  document.addEventListener("touchend", (event) => {
    if (touchX == null) return;
    const dx = (event.changedTouches[0]?.clientX ?? touchX) - touchX;
    if (dx < -40) show(index + 1);
    else if (dx > 40) show(index - 1);
    touchX = null;
  }, { passive: true });

  document.addEventListener("click", (event) => {
    if (event.target.closest?.(".deck-footer")) return;
    show(event.clientX > innerWidth / 2 ? index + 1 : index - 1);
  });

  const refit = () => requestAnimationFrame(() => fitSlide(slides[index]));
  window.addEventListener("resize", refit);
  document.addEventListener("fullscreenchange", refit);
  document.fonts?.ready.then(refit);
  if ("ResizeObserver" in window) new ResizeObserver(refit).observe(stage);

  window.__DECK_AUDIT = {
    templateVersion: body.dataset.templateVersion,
    title: document.title,
    slideCount: slides.length,
    activeIndex: () => index,
    show,
    fitCurrent: () => fitSlide(slides[index]),
    currentLayout: () => ({
      lineCount: slides[index]?.dataset.lineCount,
      density: slides[index]?.dataset.density,
      layout: slides[index]?.dataset.layout,
      semanticAtom: slides[index]?.dataset.semanticAtom,
      semanticGroup: slides[index]?.dataset.semanticGroup,
      composition: slides[index]?.dataset.composition,
      fitScale: slides[index]?.dataset.fitScale,
      fits: slides[index]?.dataset.fits
    }),
    footerState: () => ({ index, metaHidden: metaFooter.hidden, pager: pager.textContent }),
    renderMathAware
  };

  show(0);
</script>
</body>
</html>
