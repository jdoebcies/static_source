<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 856" width="1120" height="856" role="img" aria-label="共享背景色以后，仍可能漏改强调色"><title>共享背景色以后，仍可能漏改强调色</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1120" height="856" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="64" font-size="32" text-anchor="start" fill="#2d3142" font-weight="600">共享背景色以后，仍可能漏改强调色</text><text x="40" y="108" font-size="20" text-anchor="start" fill="#4f5d75" font-weight="400">三种方案对同一次换色的影响：每行分别阅读</text><text x="40" y="164" font-size="24" text-anchor="start" fill="#2d3142" font-weight="600">A  每页写死颜色</text><polyline points="324,232 416,232" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="336.0" y="188" width="64" height="32" fill="#f5f5f5"/><text x="368" y="212" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">需要</text><polyline points="704,232 796,232" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="716.0" y="188" width="64" height="32" fill="#f5f5f5"/><text x="748" y="212" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">影响</text><rect x="40" y="188" width="284" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="182.0" y="240.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">统一换背景色</text><rect x="416" y="188" width="288" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="560.0" y="240.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">找到每页颜色值</text><rect x="796" y="188" width="284" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="938.0" y="240.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">逐页修改</text><text x="40" y="340" font-size="24" text-anchor="start" fill="#2d3142" font-weight="600">B  页面共同引用变量</text><polyline points="440,408 720,408" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="488.0" y="364" width="184" height="32" fill="#f5f5f5"/><text x="580" y="388" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">自动影响引用页面</text><rect x="40" y="364" width="400" height="88" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><text x="240.0" y="416.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">修改 bannerBg</text><rect x="720" y="364" width="360" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="900.0" y="416.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">各页得到新背景色</text><text x="40" y="516" font-size="24" text-anchor="start" fill="#2d3142" font-weight="600">C  部分页面另有写死的强调色</text><polyline points="400,584 720,584" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="468.0" y="540" width="184" height="32" fill="#f5f5f5"/><text x="560" y="564" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">自动影响引用页面</text><polyline points="220,628 220,700 720,700" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="360.0" y="656" width="224" height="32" fill="#f5f5f5"/><text x="472" y="680" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">另须同步；代码未表达</text><rect x="40" y="540" width="360" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="220.0" y="592.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">修改 bannerBg</text><rect x="720" y="540" width="360" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="900.0" y="592.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">各页得到新背景色</text><rect x="720" y="656" width="360" height="88" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><text x="900.0" y="708.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">强调色仍是旧的深色</text><line x1="40" y1="788" x2="1080" y2="788" stroke="#bfc0c0"/><text x="40" y="824" font-size="20" text-anchor="start" fill="#4f5d75" font-weight="400">来源：原书图2.1。实线＝变更影响；虚线＝未被明确表达的同步要求。</text></g></svg>