<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 688" width="1120" height="688" role="img" aria-labelledby="title desc">
  <title id="title">Buffer：逻辑字节顺序与存储所有权</title>
  <desc id="desc">逻辑顺序为内部块1、外部块2、外部块3、内部块4、内部块5。内部块归Buffer所有；外部块归调用者所有，Buffer只引用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1120" height="688" fill="#f5f5f5"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#2d3142">
    <text x="40" y="68" font-size="32">Buffer：逻辑连续，存储可以分散</text>
    <text x="40" y="112" font-size="20" fill="#4f5d75">依据原书图20.1重绘｜数字保留五个数据块的逻辑顺序</text>
    <text x="40" y="180" font-size="24">字节序列：从左到右，依次读取 1 → 5</text>
    <g fill="#ffffff" stroke="#4f5d75" stroke-width="1.2">
      <rect x="40" y="208" width="208" height="104"/>
      <rect x="248" y="208" width="208" height="104"/>
      <rect x="456" y="208" width="208" height="104"/>
      <rect x="664" y="208" width="208" height="104"/>
      <rect x="872" y="208" width="208" height="104"/>
    </g>
    <g font-size="24" text-anchor="middle">
      <text x="144" y="268">1 · 内部块</text>
      <text x="352" y="268">2 · 外部块</text>
      <text x="560" y="268">3 · 外部块</text>
      <text x="768" y="268">4 · 内部块</text>
      <text x="976" y="268">5 · 内部块</text>
    </g>
    <text x="40" y="368" font-size="24">同一组块，按存储所有权分开看</text>
    <rect x="40" y="400" width="528" height="188" rx="8" fill="#fff3ec" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="64" y="444" font-size="24">Buffer 拥有：块 1、4、5</text>
    <text x="64" y="484" font-size="20">小数据复制进内部存储。</text>
    <text x="64" y="520" font-size="20">先用内置分配，必要时增加分配。</text>
    <text x="64" y="556" font-size="20">Buffer 销毁时处理自有存储。</text>
    <rect x="600" y="400" width="480" height="188" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="624" y="444" font-size="24">调用者拥有：块 2、3</text>
    <text x="624" y="484" font-size="20">Buffer 只保留存储引用。</text>
    <text x="624" y="520" font-size="20">大数据可免去一次组装复制。</text>
    <text x="624" y="556" font-size="20">Buffer 不释放外部块存储。</text>
    <line x1="40" y1="620" x2="1080" y2="620" stroke="#bfc0c0"/>
    <text x="40" y="652" font-size="20" fill="#4f5d75">上下数字指向同一数据块；横向邻接表示逻辑顺序，不表示物理地址相邻。</text>
  </g>
</svg>
