<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>06-02</title><style>html,body{margin:0;background:#f5f5f5}main{max-width:1120px;margin:auto}svg{display:block;width:100%;height:auto}</style><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 588" role="img"><title>空选区是长度为零的范围</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs>
<rect width="1120" height="100%" fill="#f5f5f5"/>
<g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142">
<text x="40" y="60" font-size="32" fill="#2d3142" text-anchor="start">空选区是长度为零的范围</text>
<text x="40" y="100" font-size="20" fill="#4f5d75" text-anchor="start">示意字符串 ABCDE；范围用两端的位置界定，end 所在端不包含字符</text>
<text x="40" y="164" font-size="24" fill="#2d3142" text-anchor="start">普通选择 [1, 3)：删除 BC</text>
<rect x="360" y="188" width="96" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="384" y="228" font-size="24" fill="#2d3142" text-anchor="start">A</text>
<text x="360" y="300" font-size="20" fill="#2d3142" text-anchor="start">0</text>
<rect x="464" y="188" width="96" height="80" rx="8" fill="#fff3ed" stroke="#eb6c36" stroke-width="2"/>
<text x="488" y="228" font-size="24" fill="#2d3142" text-anchor="start">B</text>
<text x="464" y="300" font-size="20" fill="#2d3142" text-anchor="start">1</text>
<rect x="568" y="188" width="96" height="80" rx="8" fill="#fff3ed" stroke="#eb6c36" stroke-width="2"/>
<text x="592" y="228" font-size="24" fill="#2d3142" text-anchor="start">C</text>
<text x="568" y="300" font-size="20" fill="#2d3142" text-anchor="start">2</text>
<rect x="672" y="188" width="96" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="696" y="228" font-size="24" fill="#2d3142" text-anchor="start">D</text>
<text x="672" y="300" font-size="20" fill="#2d3142" text-anchor="start">3</text>
<rect x="776" y="188" width="96" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="800" y="228" font-size="24" fill="#2d3142" text-anchor="start">E</text>
<text x="776" y="300" font-size="20" fill="#2d3142" text-anchor="start">4</text>
<text x="880" y="300" font-size="20" fill="#2d3142" text-anchor="start">5</text>
<text x="40" y="244" font-size="24" fill="#2d3142" text-anchor="start">结果：ADE</text>
<line x1="40" y1="332" x2="1080" y2="332" stroke="#bfc0c0" stroke-width="2"/>
<text x="40" y="380" font-size="24" fill="#2d3142" text-anchor="start">空选择 [2, 2)：没有字符</text>
<rect x="360" y="404" width="96" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="384" y="444" font-size="24" fill="#2d3142" text-anchor="start">A</text>
<rect x="464" y="404" width="96" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="488" y="444" font-size="24" fill="#2d3142" text-anchor="start">B</text>
<rect x="568" y="404" width="96" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="592" y="444" font-size="24" fill="#2d3142" text-anchor="start">C</text>
<rect x="672" y="404" width="96" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="696" y="444" font-size="24" fill="#2d3142" text-anchor="start">D</text>
<rect x="776" y="404" width="96" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="800" y="444" font-size="24" fill="#2d3142" text-anchor="start">E</text>
<line x1="568" y1="384" x2="568" y2="504" stroke="#bfc0c0" stroke-width="2"/>
<text x="588" y="504" font-size="20" fill="#2d3142" text-anchor="start">start = end</text>
<text x="40" y="460" font-size="24" fill="#2d3142" text-anchor="start">结果：ABCDE</text>
<line x1="40" y1="512" x2="1080" y2="512" stroke="#bfc0c0" stroke-width="2"/>
<text x="40" y="552" font-size="20" fill="#4f5d75" text-anchor="start">依据原书 6.8 节，字母与位置为本文示意；适用于零长度与无可见选区含义一致的操作。</text>
</g></svg></main></html>
