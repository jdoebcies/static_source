<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 684" role="img" aria-label="提取子任务，还是拆成两个公开入口？">
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e5aa8"/></marker></defs>
<rect width="1120" height="684" fill="#f5f5f5"/>
<g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#2d3142">
<text x="40" y="60" font-size="32" text-anchor="start" fill="#2d3142">提取子任务，还是拆成两个公开入口？</text>
<text x="40" y="104" font-size="20" text-anchor="start" fill="#4f5d75">判断标准：拆分后能否独立理解，调用者是否更轻松</text>
<path d="M288,288 L288,356" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="260.0" y="286.0" width="56" height="32" fill="#f5f5f5"/>
<text x="288.0" y="310.0" font-size="20" text-anchor="middle" fill="#4f5d75">调用</text>
<path d="M288,448 L288,504" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="260.0" y="440.0" width="56" height="32" fill="#f5f5f5"/>
<text x="288.0" y="464.0" font-size="20" text-anchor="middle" fill="#4f5d75">调用</text>
<path d="M840,288 L716,384" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="672.0" y="308" width="96" height="32" fill="#f5f5f5"/>
<text x="720" y="332" font-size="20" text-anchor="middle" fill="#4f5d75">按需调用</text>
<path d="M840,288 L968,384" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="928.0" y="308" width="96" height="32" fill="#f5f5f5"/>
<text x="976" y="332" font-size="20" text-anchor="middle" fill="#4f5d75">按需调用</text>
<rect x="80" y="168" width="416" height="120" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="104" y="208" font-size="24" text-anchor="start" fill="#2d3142">提取子任务</text>
<text x="104" y="244" font-size="20" text-anchor="start" fill="#4f5d75">对外入口保持不变</text>
<rect x="112" y="356" width="352" height="92" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="136" y="396" font-size="24" text-anchor="start" fill="#2d3142">父方法</text>
<rect x="112" y="504" width="352" height="80" rx="8" fill="#fff4ee" stroke="#eb6c36" stroke-width="2"/>
<text x="136" y="544" font-size="24" text-anchor="start" fill="#2d3142">独立子任务</text>
<rect x="624" y="168" width="416" height="120" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="648" y="208" font-size="24" text-anchor="start" fill="#2d3142">拆成独立入口</text>
<text x="648" y="244" font-size="20" text-anchor="start" fill="#4f5d75">原任务含两件关系较弱的事</text>
<rect x="592" y="384" width="248" height="96" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="616" y="424" font-size="24" text-anchor="start" fill="#2d3142">方法 A</text>
<rect x="856" y="384" width="248" height="96" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="880" y="424" font-size="24" text-anchor="start" fill="#2d3142">方法 B</text>
<text x="608" y="536" font-size="20" text-anchor="start" fill="#2d3142">若必须全部调用并搬运状态，</text>
<text x="608" y="568" font-size="20" text-anchor="start" fill="#2d3142">拆分很可能增加复杂性。</text>
<line x1="40" y1="620" x2="1080" y2="620" stroke="#bfc0c0"/>
<text x="40" y="656" font-size="20" text-anchor="start" fill="#4f5d75">依据：原图9.3；箭头表示调用，右侧两个入口按用途选择。</text>
</g></svg>