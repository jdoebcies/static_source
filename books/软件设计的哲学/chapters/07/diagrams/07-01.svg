<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 764" role="img"><title>上下文把实例配置留在需要它的对象旁</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs>
<rect width="1120" height="100%" fill="#f5f5f5"/>
<g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142">
<text x="40" y="60" font-size="32" fill="#2d3142" text-anchor="start">上下文把实例配置留在需要它的对象旁</text>
<text x="40" y="100" font-size="20" fill="#4f5d75" text-anchor="start">左：正常业务调用　　右：构造时保存上下文引用，运行时由使用者访问</text>
<path d="M 240 232 L 240 284" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 240 364 L 240 416" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 240 496 L 240 548" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 440 600 L 808 600 L 808 496" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="548.0" y="556" width="104" height="32" fill="#f5f5f5"/>
<text x="600" y="580" font-size="20" fill="#4f5d75" text-anchor="middle">访问配置</text>
<rect x="40" y="152" width="400" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="64" y="192" font-size="24" fill="#2d3142" text-anchor="start">main：启动业务</text>
<rect x="40" y="284" width="400" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="64" y="324" font-size="24" fill="#2d3142" text-anchor="start">m1：不使用 cert</text>
<rect x="40" y="416" width="400" height="80" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="64" y="456" font-size="24" fill="#2d3142" text-anchor="start">m2：不使用 cert</text>
<rect x="40" y="548" width="400" height="104" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="64" y="588" font-size="24" fill="#2d3142" text-anchor="start">对象中的 m3</text>
<text x="64" y="624" font-size="20" fill="#4f5d75" text-anchor="start">打开连接，需要 cert</text>
<text x="640" y="188" font-size="24" fill="#2d3142" text-anchor="start">每个系统实例一个上下文</text>
<text x="640" y="228" font-size="20" fill="#4f5d75" text-anchor="start">主要对象在构造时取得引用</text>
<rect x="640" y="352" width="440" height="144" rx="8" fill="#fff3ed" stroke="#eb6c36" stroke-width="2"/>
<text x="664" y="392" font-size="24" fill="#2d3142" text-anchor="start">实例上下文</text>
<text x="664" y="428" font-size="20" fill="#4f5d75" text-anchor="start">cert / timeout / metrics</text>
<text x="664" y="464" font-size="20" fill="#4f5d75" text-anchor="start">优先保持配置不可变</text>
<line x1="40" y1="688" x2="1080" y2="688" stroke="#bfc0c0" stroke-width="2"/>
<text x="40" y="728" font-size="20" fill="#4f5d75" text-anchor="start">左侧箭头：运行调用；右侧箭头：访问保存的上下文。实例级共享状态仍可能形成隐蔽依赖。</text>
</g></svg>