<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 712" width="1120" height="712" role="img" aria-label="当前省下的时间，怎样变成后续成本"><title>当前省下的时间，怎样变成后续成本</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1120" height="712" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="64" font-size="32" text-anchor="start" fill="#2d3142" font-weight="600">当前省下的时间，怎样变成后续成本</text><text x="40" y="108" font-size="20" text-anchor="start" fill="#4f5d75" font-weight="400">定性解释；不据此计算投入收益率或回本时间</text><text x="40" y="164" font-size="24" text-anchor="start" fill="#2d3142" font-weight="600">战术性编程</text><polyline points="316,244 416,244" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="332.0" y="200" width="64" height="32" fill="#f5f5f5"/><text x="364" y="224" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">留下</text><polyline points="712,244 800,244" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="724.0" y="200" width="64" height="32" fill="#f5f5f5"/><text x="756" y="224" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">增加</text><polyline points="944,304 944,360 184,360 184,304" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="448.0" y="324" width="224" height="32" fill="#f5f5f5"/><text x="560" y="348" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">时间压力促成更多补丁</text><rect x="40" y="184" width="276" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="178.0" y="234.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">尽快补上当前功能</text><text x="178.0" y="270.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">接受一点复杂性</text><rect x="416" y="184" width="296" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="564.0" y="234.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">补丁与隐藏规则</text><text x="564.0" y="270.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">逐次积累</text><rect x="800" y="184" width="280" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="940.0" y="234.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">后续修改更难</text><text x="940.0" y="270.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">交付压力增加</text><text x="40" y="436" font-size="24" text-anchor="start" fill="#2d3142" font-weight="600">战略性编程</text><polyline points="316,516 416,516" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="332.0" y="472" width="64" height="32" fill="#f5f5f5"/><text x="364" y="496" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">减少</text><polyline points="712,516 800,516" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="724.0" y="472" width="64" height="32" fill="#f5f5f5"/><text x="756" y="496" font-size="20" text-anchor="middle" fill="#4f5d75" font-weight="400">便于</text><rect x="40" y="456" width="276" height="120" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><text x="178.0" y="506.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">本次花时间</text><text x="178.0" y="542.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">比较与修正设计</text><rect x="416" y="456" width="296" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="564.0" y="506.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">不必要的依赖</text><text x="564.0" y="542.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">和隐含规则</text><rect x="800" y="456" width="280" height="120" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="940.0" y="506.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">后续理解与修改</text><text x="940.0" y="542.0" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">继续投入设计</text><line x1="40" y1="644" x2="1080" y2="644" stroke="#bfc0c0"/><text x="40" y="680" font-size="20" text-anchor="start" fill="#4f5d75" font-weight="400">来源：3.1—3.3节。原书图3.1也是定性示意，作者未给出经验测量。</text></g></svg>