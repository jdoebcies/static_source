<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 652" width="1120" height="652" role="img" aria-label="接口成本与功能收益一起看"><title>接口成本与功能收益一起看</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1120" height="652" fill="#f5f5f5"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="64" font-size="32" text-anchor="start" fill="#2d3142" font-weight="600">接口成本与功能收益一起看</text><text x="40" y="108" font-size="20" text-anchor="start" fill="#4f5d75" font-weight="400">顶边越长，使用者需了解的接口越复杂；面积表示功能，非代码行数</text><text x="40" y="164" font-size="28" text-anchor="start" fill="#2d3142" font-weight="600">深模块</text><text x="496" y="164" font-size="28" text-anchor="start" fill="#2d3142" font-weight="600">浅模块</text><rect x="40" y="236" width="300" height="280" rx="8" fill="#fff1e9" stroke="#eb6c36" stroke-width="2"/><rect x="496" y="404" width="584" height="112" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><line x1="40" y1="236" x2="340" y2="236" stroke="#eb6c36" stroke-width="8"/><line x1="496" y1="404" x2="1080" y2="404" stroke="#2d3142" stroke-width="8"/><text x="40" y="212" font-size="24" text-anchor="start" fill="#2d3142" font-weight="400">较简单的接口</text><text x="496" y="376" font-size="24" text-anchor="start" fill="#2d3142" font-weight="400">相对复杂的接口</text><text x="188" y="348" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">隐藏较多工作</text><text x="188" y="392" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">使用者不必逐项了解</text><text x="788" y="472" font-size="24" text-anchor="middle" fill="#2d3142" font-weight="400">接口背后隐藏的功能较少</text><line x1="40" y1="584" x2="1080" y2="584" stroke="#bfc0c0"/><text x="40" y="620" font-size="20" text-anchor="start" fill="#4f5d75" font-weight="400">来源：原书图4.1。深度是成本收益的定性判断；浅模块有时仍有价值。</text></g></svg>