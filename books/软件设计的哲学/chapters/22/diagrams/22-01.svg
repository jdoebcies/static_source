<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 744" width="1120" height="744" role="img" aria-labelledby="title desc">
  <title id="title">设计投入通过后续使用产生回报</title>
  <desc id="desc">先花时间比较和改进设计，形成可复用模块与清晰文档；在后续实际使用时减少重复理解和返工，可能释放时间并积累技能，再支持下一次设计。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1120" height="744" fill="#f5f5f5"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#2d3142">
    <text x="40" y="68" font-size="32">投入怎样回到后续开发中</text>
    <text x="40" y="112" font-size="20" fill="#4f5d75">根据第22章整理｜这是作者主张的作用关系，没有固定回报期限</text>
    <g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 400 252 H 556"/>
      <path d="M 820 328 V 484"/>
      <path d="M 560 564 H 404"/>
      <path d="M 220 488 V 332" stroke-dasharray="4,4"/>
    </g>
    <rect x="40" y="176" width="360" height="152" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="64" y="224" font-size="24">先花时间做设计</text>
    <text x="64" y="264" font-size="20">比较方案、澄清规则，</text>
    <text x="64" y="296" font-size="20">学习阶段可能更慢。</text>
    <rect x="560" y="176" width="520" height="152" rx="8" fill="#fff3ec" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="584" y="224" font-size="24">形成可继续使用的设计</text>
    <text x="584" y="264" font-size="20">模块承担共同工作；</text>
    <text x="584" y="296" font-size="20">接口与文档让行为可理解。</text>
    <rect x="560" y="488" width="520" height="152" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="584" y="536" font-size="24">后续复用、修改更容易</text>
    <text x="584" y="576" font-size="20">少重写共同规则，</text>
    <text x="584" y="608" font-size="20">少重新理解与追踪关联。</text>
    <rect x="40" y="488" width="360" height="152" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="64" y="536" font-size="24">留下时间与经验</text>
    <text x="64" y="576" font-size="20">减少重复工作，</text>
    <text x="64" y="608" font-size="20">从实际使用中学习。</text>
    <g font-size="20" text-anchor="middle" fill="#4f5d75">
      <rect x="416" y="216" width="128" height="28" fill="#f5f5f5"/><text x="480" y="236">产生可用成果</text>
      <rect x="840" y="392" width="224" height="28" fill="#f5f5f5"/><text x="952" y="412">条件：确有后续使用</text>
      <rect x="416" y="528" width="128" height="28" fill="#f5f5f5"/><text x="480" y="548">减少重复投入</text>
      <rect x="64" y="392" width="132" height="28" fill="#f5f5f5"/><text x="128" y="412">可继续练习</text>
    </g>
    <line x1="40" y1="680" x2="1080" y2="680" stroke="#bfc0c0"/>
    <text x="40" y="716" font-size="20" fill="#4f5d75">实线：预期作用关系；虚线：可能的再投入。是否减少工作，需要实际使用来检验。</text>
  </g>
</svg>
