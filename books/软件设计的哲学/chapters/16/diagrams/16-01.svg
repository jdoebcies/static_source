<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" role="img" aria-labelledby="title desc">
<title id="title">把完整说明放在读者会去找的地方</title><desc id="desc">同一变量影响多个使用点时，让查阅路径汇合。；依据原书16.4节；没有自然归属时，可集中在 designNotes。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142">
<text x="40" y="64" font-size="32" font-weight="600">把完整说明放在读者会去找的地方</text>
<text x="40" y="104" font-size="20" fill="#4f5d75">同一变量影响多个使用点时，让查阅路径汇合。</text>
<path d="M336 224 H472 V344 H620" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440.0" y="180" width="64" height="32" fill="#f5f5f5"/>
<text x="472" y="204" text-anchor="middle" font-size="20" fill="#4f5d75">查阅</text>
<path d="M336 368 H620" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440.0" y="328" width="64" height="32" fill="#f5f5f5"/>
<text x="472" y="352" text-anchor="middle" font-size="20" fill="#4f5d75">查阅</text>
<path d="M336 512 H472 V392 H620" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440.0" y="520" width="64" height="32" fill="#f5f5f5"/>
<text x="472" y="544" text-anchor="middle" font-size="20" fill="#4f5d75">查阅</text>
<rect x="40" y="176" width="296" height="96" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="188.0" y="214.0" text-anchor="middle" font-size="24">使用点 A</text>
<text x="188.0" y="250.0" text-anchor="middle" font-size="24">只留查阅指引</text>
<rect x="40" y="320" width="296" height="96" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="188.0" y="358.0" text-anchor="middle" font-size="24">使用点 B</text>
<text x="188.0" y="394.0" text-anchor="middle" font-size="24">只留查阅指引</text>
<rect x="40" y="464" width="296" height="96" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="188.0" y="502.0" text-anchor="middle" font-size="24">使用点 C</text>
<text x="188.0" y="538.0" text-anchor="middle" font-size="24">只留查阅指引</text>
<rect x="620" y="296" width="440" height="144" rx="8" fill="#fce8de" stroke="#eb6c36" stroke-width="2"/>
<text x="840.0" y="340.0" text-anchor="middle" font-size="24">变量声明旁</text>
<text x="840.0" y="376.0" text-anchor="middle" font-size="24">完整解释共同约束</text>
<text x="840.0" y="412.0" text-anchor="middle" font-size="24">修改时只更新这一份</text>
<line x1="40" y1="604" x2="1080" y2="604" stroke="#bfc0c0"/>
<text x="40" y="640" font-size="20" fill="#4f5d75">依据原书16.4节；没有自然归属时，可集中在 designNotes。</text>
</g></svg>