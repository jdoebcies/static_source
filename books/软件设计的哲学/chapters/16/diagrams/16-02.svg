<rect x="890.0" y="292" width="84" height="32" fill="#f5f5f5"/>
<text x="932" y="316" text-anchor="middle" font-size="20" fill="#4f5d75">选择后</text>
<path d="M640 400 H480" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="518.0" y="356" width="84" height="32" fill="#f5f5f5"/>
<text x="560" y="380" text-anchor="middle" font-size="20" fill="#4f5d75">完成后</text>
<rect x="40" y="168" width="440" height="96" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="260.0" y="206.0" text-anchor="middle" font-size="24">确认哪些入口</text>
<text x="260.0" y="242.0" text-anchor="middle" font-size="24">适用同一条排除规则</text>
<rect x="640" y="168" width="440" height="96" rx="8" fill="#fce8de" stroke="#eb6c36" stroke-width="2"/>
<text x="860.0" y="206.0" text-anchor="middle" font-size="24">比较现有结构与候选改法</text>
<text x="860.0" y="242.0" text-anchor="middle" font-size="24">包括期限和兼容性代价</text>
<rect x="640" y="352" width="440" height="96" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="860.0" y="390.0" text-anchor="middle" font-size="24">在负责可用性的步骤修改</text>
<text x="860.0" y="426.0" text-anchor="middle" font-size="24">更新附近说明与集中规则</text>
<rect x="40" y="352" width="440" height="96" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="2"/>
<text x="260.0" y="390.0" text-anchor="middle" font-size="24">核对各类输入与注释</text>
