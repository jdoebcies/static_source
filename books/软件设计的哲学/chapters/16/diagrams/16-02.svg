<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#2d3142">
<text x="40" y="64" font-size="32" font-weight="600">一次修改，要同时检查结构、行为和说明</text>
<text x="40" y="104" font-size="20" fill="#4f5d75">假设案例：为候选服务增加“排除维护节点”的要求。</text>
<path d="M480 216 H640" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="518.0" y="172" width="84" height="32" fill="#f5f5f5"/>
<text x="560" y="196" text-anchor="middle" font-size="20" fill="#4f5d75">再比较</text>
