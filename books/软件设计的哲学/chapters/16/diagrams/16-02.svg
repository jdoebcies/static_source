<line x1="40" y1="484" x2="1080" y2="484" stroke="#bfc0c0"/>
<text x="40" y="520" font-size="20" fill="#4f5d75">箭头表示本例的执行顺序；行为测试为讲解补充，不是原书原例。</text>
