<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
<title id="title">一次修改，要同时检查结构、行为和说明</title><desc id="desc">假设案例：为候选服务增加“排除维护节点”的要求。；箭头表示本例的执行顺序；行为测试为讲解补充，不是原书原例。</desc>
<defs>
