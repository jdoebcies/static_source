<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 824" width="1120" height="824" role="img" aria-labelledby="title desc">
  <title id="title">围绕字符范围设计文本接口</title>
  <desc id="desc">界面层的退格、删除选区和替换分别确定字符范围，然后调用文本类的范围删除；文本类负责数据搬移及维护长度，不了解按键来源。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1120" height="824" fill="#f5f5f5"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#2d3142">
    <text x="40" y="68" font-size="32">编辑入口各不相同，共用字符范围操作</text>
    <text x="40" y="112" font-size="20" fill="#4f5d75">基于原书文本类例子的假设展开｜只展示删除部分</text>
    <rect x="40" y="152" width="1040" height="184" rx="8" fill="none" stroke="#bfc0c0" stroke-dasharray="4,4"/>
    <text x="64" y="192" font-size="24">界面层：决定要修改的范围</text>
    <g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 212 312 V 384 H 408 V 464"/>
      <path d="M 560 312 V 464"/>
      <path d="M 908 312 V 384 H 712 V 464"/>
      <path d="M 560 568 V 640"/>
    </g>
    <g fill="#ffffff" stroke="#4f5d75" stroke-width="1.2">
      <rect x="64" y="224" width="296" height="88" rx="8"/>
      <rect x="412" y="224" width="296" height="88" rx="8"/>
      <rect x="760" y="224" width="296" height="88" rx="8"/>
    </g>
    <g font-size="24" text-anchor="middle">
      <text x="212" y="276">退格：确定删除范围</text>
      <text x="560" y="276">删除：使用选区范围</text>
      <text x="908" y="276">替换：先删除旧范围</text>
    </g>
    <rect x="40" y="432" width="1040" height="296" rx="8" fill="none" stroke="#bfc0c0" stroke-dasharray="4,4"/>
    <rect x="264" y="464" width="592" height="104" rx="8" fill="#fff3ec" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="560" y="508" font-size="24" text-anchor="middle">文本接口：deleteRange(start, end)</text>
    <text x="560" y="544" font-size="20" text-anchor="middle">明确字符单位、范围端点和失败行为</text>
    <g font-size="20" text-anchor="middle" fill="#4f5d75">
      <rect x="264" y="352" width="104" height="28" fill="#f5f5f5"/>
      <text x="316" y="372">传入范围</text>
      <rect x="584" y="352" width="104" height="28" fill="#f5f5f5"/>
      <text x="636" y="372">传入范围</text>
      <rect x="752" y="352" width="104" height="28" fill="#f5f5f5"/>
      <text x="804" y="372">传入范围</text>
      <rect x="584" y="592" width="104" height="28" fill="#f5f5f5"/>
      <text x="636" y="612">执行修改</text>
    </g>
    <rect x="184" y="644" width="752" height="60" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="560" y="684" font-size="24" text-anchor="middle">文本类内部：搬移数据、维护长度与存储空间</text>
    <line x1="40" y1="760" x2="1080" y2="760" stroke="#bfc0c0"/>
    <text x="40" y="796" font-size="20" fill="#4f5d75">箭头表示调用与传入信息；具体存储细节留在文本类内部。</text>
  </g>
</svg>
